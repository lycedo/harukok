<style>
  :root{
    --bg: #ECE8DC;
    --bg-soft: #F7F4EA;
    --coral: #EF8C6E;
    --plum: #B85C7A;
    --ticket: #FFFFFF;
    --ticket-line: #EAD9D0;
    --ink: #33221F;
    --cream-text: #F6EBE6;
    --muted: #7C6763;
    --line: #DCC9C0;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    padding: 40px 20px 70px;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, var(--bg-soft), var(--bg) 70%);
    font-family:var(--font-body);
    color: var(--ink);
    display:flex;
    justify-content:center;
  }
  .page{ width:100%; max-width: 480px; text-align:center; }
  h1{ font-family:var(--font-body); font-size:36px; color:var(--plum); margin:0 0 6px; letter-spacing:0.01em; }
  .lede{ font-size:14px; color:var(--muted); margin:0 0 24px; }

  .group-label{ font-size:13px; color:var(--muted); margin-bottom:8px; text-align:left; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:22px; }
  .chip{ padding:8px 16px; border:1.5px solid var(--line); border-radius:999px; background:transparent; color:var(--ink); font-size:13.5px; font-weight:500; cursor:pointer; }
  .chip.active{ background:var(--coral); border-color:var(--coral); color:var(--ink); font-weight:700; }

  .machine{
    position: relative; width:220px; height:220px; margin:0 auto 24px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #452F35, #1C1317 75%);
    border: 6px solid #19100E;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 10px 18px rgba(0,0,0,0.35);
  }
  .capsule{ width:160px; height:160px; border-radius:50%; background:var(--ticket); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; transition: transform 0.2s ease; }
  .capsule .emoji{ font-size:40px; line-height:1; margin-bottom:8px; }
  .capsule .name{ font-family:var(--font-body); font-size:20px; letter-spacing:0.02em; color:var(--ink); line-height:1.3; padding:0 6px; }
  .capsule.spinning .emoji{ animation: spin-blur 0.22s ease-in-out infinite; }
  @keyframes spin-blur{ 0%, 100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.1) rotate(9deg);} }
  .capsule.landed{ animation: capsule-pop 0.36s cubic-bezier(.34,1.56,.64,1); }
  @keyframes capsule-pop{ 0%{transform:scale(0.86);} 55%{transform:scale(1.08);} 100%{transform:scale(1);} }

  .pull-btn{
    width:100%; padding:18px; background:var(--plum); color:var(--cream-text); border:none; border-radius:14px;
    font-family:var(--font-body); font-size:19px; letter-spacing:0.01em; cursor:pointer;
    box-shadow: 0 4px 0 #7E3E52;
  }
  .pull-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #7E3E52; }
  .pull-btn:disabled{ opacity:0.6; cursor:default; }

  .history{ margin-top:36px; text-align:left; }
  .history-title{ font-size:13.5px; color:var(--muted); margin-bottom:10px; text-align:center; }
  .ticket-row{ display:flex; align-items:center; justify-content:space-between; background:var(--ticket); border:1px solid var(--ticket-line); color:var(--ink); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:14px; font-weight:600; }
  .ticket-row .date{ font-size:13px; color:#8A7472; font-weight:400; }
  .empty-history{ text-align:center; color:var(--muted); font-size:13px; padding:16px 0; }


  .info-block{ margin-top:40px; text-align:left; }
  .info-block h2{ font-family:var(--font-body); font-size:18px; color:var(--plum); margin:0 0 10px; font-weight:400; }
  .info-block p{ font-size:13.5px; line-height:1.65; color:var(--muted); margin:0 0 14px; }
  .faq-item{ margin-bottom:14px; }
  .faq-item .q{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:5px; }
  .faq-item .a{ font-size:13.5px; line-height:1.6; color:var(--muted); }

  .related{ margin-top:20px; margin-bottom:32px; text-align:left; }
  .related-title{ font-size:13px; color:var(--muted); margin-bottom:10px; }
  .related-links{ display:flex; flex-wrap:wrap; gap:8px; }
  .related-links a{ padding:8px 14px; border:1.5px solid var(--line); border-radius:999px; font-size:13px; color:var(--ink); text-decoration:none; }
  .related-links a:hover{ border-color:var(--ink); }

  .back-home{ display:inline-block; font-size:13px; color:var(--muted); text-decoration:none; margin-bottom:14px; }
  .back-home:hover{ color:var(--ink); }
.share-card{ background:var(--ticket); border:1px solid var(--ticket-line); border-radius:14px; padding:18px 16px 12px; margin-bottom:14px; }
  .share-card .machine{ margin:0 auto 0; }
  .share-watermark{ text-align:center; font-family:var(--font-body); font-size:13px; color:var(--muted); margin-top:10px; letter-spacing:0.02em; }
  .share-row{ display:flex; gap:10px; margin-top:14px; margin-bottom:28px; }
  .share-btn{
    flex:1; padding:12px; border:1.5px solid var(--line); border-radius:12px; background:var(--ticket);
    color:var(--ink); font-size:13px; font-weight:600; cursor:pointer;
  }
  .share-btn:disabled{ opacity:0.5; cursor:default; }
  .share-btn:active:not(:disabled){ transform:translateY(2px); }
  .share-toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:#fff; font-size:13px; padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease; z-index:10;
  }
  .share-toast.visible{ opacity:1; transform:translateX(-50%) translateY(0); }

  .site-nav{ display:flex; align-items:center; justify-content:space-between; width:100%; margin:0 0 22px; padding:0 0 14px; border-bottom:1px solid var(--line, #D9D2BF); }
  .site-nav-brand{ font-family:var(--font-body); font-weight:700; font-size:15px; color:var(--ink); text-decoration:none; }
  .site-nav-brand span{ color:var(--stamp, #B23A2E); }
  .site-nav-links{ display:flex; gap:2px; }
  .site-nav-links a{ font-size:13.5px; color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:6px; }
  .site-nav-links a:hover{ color:var(--ink); background:var(--paper-light, rgba(0,0,0,0.045)); }
  .site-nav-links a[aria-current="page"]{ color:var(--ink); font-weight:600; }
  .site-nav-brand:focus-visible, .site-nav-links a:focus-visible{ outline:2px solid var(--stamp, #B23A2E); outline-offset:2px; border-radius:4px; }

<div class="page">

  <main>
<h1>반려동물 이름 뽑기</h1>
  <p class="tool-help"><strong>사용방법</strong> 스타일을 고른 뒤 이름 뽑기를 누르세요.</p>



  <div class="group-label">스타일</div>
  <div class="chips" id="styleChips"></div>

  <div class="share-card" id="shareCard">
    <div class="machine">
    <div class="capsule" id="capsule">
      <div class="emoji" id="capsuleEmoji">🐾</div>
      <div class="name" id="capsuleName">뽑기 대기중</div>
    </div>
  </div>
    <div class="share-watermark">하루콕 · harukok.com</div>
  </div>

  <button class="pull-btn" id="pullBtn">이름 뽑기</button>

  <div class="share-row">
    <button class="share-btn" id="saveImgBtn" disabled>이미지로 저장</button>
    <button class="share-btn" id="shareBtn" disabled>공유하기</button>
  </div>

  <div class="history">
    <div class="history-title">최근 뽑은 이름</div>
    <div id="historyList"></div>
  </div>





<aside class="ad-banner ad-banner-strip" aria-label="광고"><p class="ad-label">광고</p><div class="ad-strip-slot"><script src="/ad-banner-isolated.js?v=20261027-banner"></script></div></aside>

</div>

<div class="share-toast" id="shareToast"></div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  function showToast(msg){
    const toast = $('shareToast');
    toast.textContent = msg;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 2200);
  }

  function saveCardAsImage(cardId, filename){
    if (typeof html2canvas === 'undefined'){
      alert('이미지 생성 기능을 아직 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }
    const original = $(cardId);
    const clone = original.cloneNode(true);
    clone.style.width = '420px';
    clone.style.maxWidth = '420px';
    clone.style.position = 'fixed';
    clone.style.left = '-9999px';
    clone.style.top = '0';
    document.body.appendChild(clone);

    html2canvas(clone, { backgroundColor: '#ffffff', scale: 2, width: 420 }).then(canvas => {
      document.body.removeChild(clone);
      const link = document.createElement('a');
      link.download = filename;
      canvas.toBlob(blob => {
        if (!blob) { alert('이미지를 만들지 못했어요. 다시 시도하세요.'); return; }
        const url = URL.createObjectURL(blob);
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }, 'image/png');
    }).catch(() => {
      clone.remove();
      alert('이미지 저장에 실패했어요.');
    });
  }

  function shareResult(getText){
    const text = getText();

    function legacyCopy(){
      try {
        const ta = document.createElement('textarea');
        ta.value = text + ' ' + location.href;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('결과가 복사되었어요');
      } catch(e){
        showToast('공유를 지원하지 않는 환경이에요');
      }
    }

    function fallbackCopy(){
      if (navigator.clipboard){
        navigator.clipboard.writeText(text + ' ' + location.href).then(() => showToast('결과가 복사되었어요')).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    }

    if (navigator.share){
      navigator.share({ title: '하루콕', text, url: location.href })
        .then(() => showToast('공유했어요'))
        .catch(err => { if (!err || err.name !== 'AbortError') fallbackCopy(); });
    } else {
      fallbackCopy();
    }
  }

  const STYLES = {
    귀여운: {
      emoji: '🐾',
      prefix: ['몽실','포근','말랑','방울','폭신','몽글','살랑','깜찍'],
      suffix: ['이','순이','몽이','뭉치','봉이','랑이','공주','도령']
    },
    멋진: {
      emoji: '⭐',
      prefix: ['씩씩','당당','늠름','용맹','위풍','강인','우아','고귀'],
      suffix: ['대장','장군','왕자','여왕','태양','바람','별빛','기사']
    },
    개구쟁이: {
      emoji: '😼',
      prefix: ['장난','까불','촐랑','엉뚱','발랄','통통','오동통','깜찍'],
      suffix: ['이','돌이','순이','깨비','공주','왕자','대장','치']
    },
    음식이름: {
      emoji: '🍡',
      names: ['두부','망고','감자','고구마','옥수수','인절미','찹쌀이','호두','대추','유자','자두','딸기','메밀이','팥이','흑임자','브라우니','초코','라떼','자몽','만두','찐빵','밤톨이','콩떡이','나비']
    }
  };

    const chipsEl = $('styleChips');
  const styleNames = Object.keys(STYLES);
  let activeStyle = '아무거나';

  function renderChips(){
    chipsEl.innerHTML = '';
    styleNames.concat(['아무거나']).forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'chip' + (name === activeStyle ? ' active' : '');
      btn.textContent = name;
      btn.addEventListener('click', () => {
        activeStyle = name;
        renderChips();
      });
      chipsEl.appendChild(btn);
    });
  }
  renderChips();

  function pickRandom(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generateName(){
    const styleName = activeStyle === '아무거나' ? pickRandom(styleNames) : activeStyle;
    const style = STYLES[styleName];
    const name = style.names ? pickRandom(style.names) : pickRandom(style.prefix) + pickRandom(style.suffix);
    return { name, emoji: style.emoji };
  }

  function setCapsuleName(nameEl, text){
    nameEl.textContent = text;
    const len = text.length;
    nameEl.style.fontSize = len <= 3 ? '22px' : len <= 4 ? '20px' : len === 5 ? '18px' : '16px';
  }

  const STORAGE_KEY = 'harukok-pet-name-history';

  function loadHistory(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveHistory(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }catch(e){}
  }
  function formatDate(d){
    const date = new Date(d);
    return `${date.getMonth()+1}/${date.getDate()}`;
  }

  function renderHistory(){
    const list = loadHistory();
    const el = $('historyList');
    if (!list.length){
      el.innerHTML = '<div class="empty-history">아직 뽑은 이름이 없어요. 첫 이름을 뽑아보세요!</div>';
      return;
    }
    el.innerHTML = list.slice(0, 8).map(item => `
      <div class="ticket-row">
        <span>${item.emoji} ${item.name}</span>
        <span class="date">${formatDate(item.date)}</span>
      </div>
    `).join('');
  }

  let spinning = false;

  $('pullBtn').addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    $('pullBtn').disabled = true;

    const capsule = $('capsule');
    const emojiEl = $('capsuleEmoji');
    const nameEl = $('capsuleName');

    capsule.classList.add('spinning');
    const totalTicks = 16;
    let tick = 0;

    function nextTick(){
      const preview = generateName();
      emojiEl.textContent = preview.emoji;
      setCapsuleName(nameEl, preview.name);
      tick++;

      if (tick < totalTicks){
        const progress = tick / totalTicks;
        const delay = 60 + Math.pow(progress, 3) * 260;
        setTimeout(nextTick, delay);
      } else {
        capsule.classList.remove('spinning');
        capsule.classList.add('landed');
        setTimeout(() => capsule.classList.remove('landed'), 360);
        spinning = false;
        $('pullBtn').disabled = false;
        $('saveImgBtn').disabled = false;
        $('shareBtn').disabled = false;

        const newList = [{ name: preview.name, emoji: preview.emoji, date: Date.now() }, ...loadHistory()].slice(0, 20);
        saveHistory(newList);
        renderHistory();
      }
    }

    nextTick();
  });

  $('saveImgBtn').addEventListener('click', () => saveCardAsImage('shareCard', '하루콕-반려동물이름.png'));
  $('shareBtn').addEventListener('click', () => shareResult(() =>
    `하루콕에서 뽑은 반려동물 이름: ${$('capsuleEmoji').textContent} ${$('capsuleName').textContent}`
  ));

  renderHistory();
})();
</script>
