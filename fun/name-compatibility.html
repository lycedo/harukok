<style>
  :root{
    --bg: #ECE8DC;
    --bg-soft: #F7F4EA;
    --plum: #C43F6B;
    --ticket: #FFFFFF;
    --ticket-line: #F2D8E1;
    --ink: #2B2038;
    --cream-text: #FCEFF4;
    --muted: #7A6B72;
    --line: #E6CCD7;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    padding: 40px 20px 70px;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, var(--bg-soft), var(--bg) 70%);
    font-family:var(--font-body);
    color: var(--ink);
    display:flex;
    justify-content:center;
  }
  .page{ width:100%; max-width: 480px; text-align:center; }
  h1{ font-family:var(--font-body); font-size:38px; color:var(--plum); margin:0 0 6px; letter-spacing:0.01em; }
  .lede{ font-size:14px; color:var(--muted); margin:0 0 24px; }

  .name-form{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .name-form input{
    flex:1; min-width:0; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
    background:var(--ticket); font-size:15px; color:var(--ink); text-align:center; outline:none;
  }
  .name-form input:focus{ border-color:var(--plum); }
  .heart{ font-size:20px; flex-shrink:0; }

  .machine{
    position: relative; width: 220px; height: 220px; margin: 0 auto 24px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3E1F2C, #1C0D13 75%);
    border: 6px solid #150A0E;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 10px 18px rgba(0,0,0,0.35);
  }
  .capsule{
    width: 150px; height: 150px; border-radius: 50%; background: var(--ticket);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 10px; transition: transform 0.2s ease;
  }
  .capsule .emoji{ font-size:44px; line-height:1; margin-bottom: 6px; }
  .capsule .name{ font-family:var(--font-body); font-size:18px; color: var(--ink); line-height: 1.2; }
  .capsule.spinning .emoji{ animation: spin-blur 0.22s ease-in-out infinite; }
  @keyframes spin-blur{ 0%, 100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.1) rotate(9deg);} }
  .capsule.landed{ animation: capsule-pop 0.36s cubic-bezier(.34,1.56,.64,1); }
  @keyframes capsule-pop{ 0%{transform:scale(0.86);} 55%{transform:scale(1.08);} 100%{transform:scale(1);} }

  .pull-btn{
    width:100%; padding:18px; background:var(--plum); color:var(--cream-text); border:none; border-radius:14px;
    font-family:var(--font-body); font-size:19px; letter-spacing:0.01em; cursor:pointer;
    box-shadow: 0 4px 0 #8F2649;
  }
  .pull-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8F2649; }
  .pull-btn:disabled{ opacity:0.6; cursor:default; }

  .result{ margin-top:28px; display:none; text-align:left; }
  .result.visible{ display:block; }
  .score-wrap{ text-align:center; margin-bottom:16px; }
  .score{ font-family:var(--font-body); font-size:48px; font-weight:600; color:var(--plum); }
  .score-label{ font-size:13px; color:var(--muted); }
  .content-card{ background:var(--ticket); border:1px solid var(--ticket-line); color:var(--ink); border-radius:10px; padding:18px 20px; margin-bottom:10px; }
  .content-card .label{ font-family:var(--font-body); font-weight:700; font-size:13.5px; color:var(--plum); margin-bottom:6px; }
  .content-card .text{ font-size:14.5px; line-height:1.55; }

  .info-block{ margin-top:40px; text-align:left; }
  .info-block h2{ font-family:var(--font-body); font-size:18px; color:var(--plum); margin:0 0 10px; font-weight:400; }
  .info-block p{ font-size:13.5px; line-height:1.65; color:var(--muted); margin:0 0 14px; }
  .faq-item{ margin-bottom:14px; }
  .faq-item .q{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:5px; }
  .faq-item .a{ font-size:13.5px; line-height:1.6; color:var(--muted); }

  .related{ margin-top:32px; padding-top:20px; border-top:1px solid var(--line); text-align:left; }
  .related-title{ font-size:13px; color:var(--muted); margin-bottom:10px; }
  .related-links{ display:flex; flex-wrap:wrap; gap:8px; }
  .related-links a{ padding:8px 14px; border:1.5px solid var(--line); border-radius:999px; font-size:13px; color:var(--ink); text-decoration:none; }
  .related-links a:hover{ border-color:var(--ink); }

  .back-home{ display:inline-block; font-size:13px; color:var(--muted); text-decoration:none; margin-bottom:14px; }
  .back-home:hover{ color:var(--ink); }

  .share-watermark{ text-align:center; font-family:var(--font-body); font-size:13px; color:var(--muted); margin-top:6px; letter-spacing:0.02em; }
  .share-row{ display:flex; gap:10px; margin:0 0 28px; display:none; }
  .share-row.visible{ display:flex; }
  .share-btn{
    flex:1; padding:12px; border:1.5px solid var(--line); border-radius:12px; background:var(--ticket);
    color:var(--ink); font-size:13px; font-weight:600; cursor:pointer;
  }
  .share-btn:active{ transform:translateY(2px); }
  .share-toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:#fff; font-size:13px; padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease; z-index:10;
  }
  .share-toast.visible{ opacity:1; transform:translateX(-50%) translateY(0); }

  .site-nav{ display:flex; align-items:center; justify-content:space-between; width:100%; margin:0 0 22px; padding:0 0 14px; border-bottom:1px solid var(--line, #D9D2BF); }
  .site-nav-brand{ font-family:var(--font-body); font-weight:700; font-size:15px; color:var(--ink); text-decoration:none; }
  .site-nav-brand span{ color:var(--stamp, #B23A2E); }
  .site-nav-links{ display:flex; gap:2px; }
  .site-nav-links a{ font-size:13.5px; color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:6px; }
  .site-nav-links a:hover{ color:var(--ink); background:var(--paper-light, rgba(0,0,0,0.045)); }
  .site-nav-links a[aria-current="page"]{ color:var(--ink); font-weight:600; }
  .site-nav-brand:focus-visible, .site-nav-links a:focus-visible{ outline:2px solid var(--stamp, #B23A2E); outline-offset:2px; border-radius:4px; }
</style>

<body class="restored-tool">


<div class="page">
<nav class="site-nav" aria-label="주요 메뉴"><a class="site-nav-brand" href="/">하루<span>콕</span></a><div class="site-nav-links"><a href="/#all-tools">전체 도구</a></div></nav>



  <main>
<h1>이름궁합 테스트</h1>
  <p class="tool-help"><strong>사용방법</strong> 두 이름을 입력하고 궁합 뽑기를 누르세요.</p>

  <div class="name-form">
    <label for="name1">첫 번째 이름</label><input type="text" id="name1" aria-label="첫 번째 이름" placeholder="이름 1" maxlength="10">
    <span class="heart">💕</span>
    <label for="name2">두 번째 이름</label><input type="text" id="name2" aria-label="두 번째 이름" placeholder="이름 2" maxlength="10">
  </div>

  <div class="machine">
    <div class="capsule" id="capsule">
      <div class="emoji" id="capsuleEmoji">💌</div>
      <div class="name" id="capsuleName">뽑기 대기중</div>
    </div>
  </div>

  <button class="pull-btn" id="pullBtn">궁합 뽑기</button>

  <div class="result" id="result">
    <div class="score-wrap">
      <div class="score" id="rScore">0%</div>
      <div class="score-label" id="rNamesLabel"></div>
    </div>
    <div class="content-card"><div class="label">한줄평</div><div class="text" id="rComment"></div></div>
    <div class="content-card"><div class="label">오늘의 팁</div><div class="text" id="rTip"></div></div>
    <div class="share-watermark">하루콕 · harukok.com</div>
  </div>

  <div class="share-row" id="shareRow">
    <button class="share-btn" id="saveImgBtn">이미지로 저장</button>
    <button class="share-btn" id="shareBtn">공유하기</button>
  </div>





  <p class="disclaimer">이름으로 만든 재미용 점수이며 실제 관계를 판단하는 기준이 아닙니다.</p>
<aside class="ad-banner ad-banner-strip" aria-label="광고"><p class="ad-label">광고</p><div class="ad-strip-slot"><script src="/ad-banner-isolated.js?v=20261027-banner"></script></div></aside>
</main>
<footer><a href="/about">소개</a> · <a href="/privacy">개인정보처리방침</a> · <a href="mailto:contact@harukok.com">의견 보내기</a><p>© 2026 하루콕</p></footer>
</div>

<div class="share-toast" id="shareToast"></div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  function showToast(msg){
    const toast = $('shareToast');
    toast.textContent = msg;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 2200);
  }

  function saveCardAsImage(cardId, filename){
    if (typeof html2canvas === 'undefined'){
      alert('이미지 생성 기능을 아직 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }
    const original = $(cardId);
    const clone = original.cloneNode(true);
    clone.style.width = '420px';
    clone.style.maxWidth = '420px';
    clone.style.position = 'fixed';
    clone.style.left = '-9999px';
    clone.style.top = '0';
    document.body.appendChild(clone);

    html2canvas(clone, { backgroundColor: '#ffffff', scale: 2, width: 420 }).then(canvas => {
      document.body.removeChild(clone);
      const link = document.createElement('a');
      link.download = filename;
      canvas.toBlob(blob => {
        if (!blob) { alert('이미지를 만들지 못했어요. 다시 시도하세요.'); return; }
        const url = URL.createObjectURL(blob);
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }, 'image/png');
    }).catch(() => {
      clone.remove();
      alert('이미지 저장에 실패했어요.');
    });
  }

  function shareResult(getText){
    const text = getText();

    function legacyCopy(){
      try {
        const ta = document.createElement('textarea');
        ta.value = text + ' ' + location.href;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('결과가 복사되었어요');
      } catch(e){
        showToast('공유를 지원하지 않는 환경이에요');
      }
    }

    function fallbackCopy(){
      if (navigator.clipboard){
        navigator.clipboard.writeText(text + ' ' + location.href).then(() => showToast('결과가 복사되었어요')).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    }

    if (navigator.share){
      navigator.share({ title: '하루콕', text, url: location.href })
        .then(() => showToast('공유했어요'))
        .catch(err => { if (!err || err.name !== 'AbortError') fallbackCopy(); });
    } else {
      fallbackCopy();
    }
  }

  const COMMENTS = {
    HIGH: [
      '서로에게 최고의 짝꿍이 될 조합이에요', '같이 있으면 시너지가 폭발하는 사이예요', '오래갈수록 더 좋아지는 궁합이에요',
      '말하지 않아도 통하는 느낌이 강해요', '함께할수록 서로에게 힘이 되는 관계예요',
    ],
    MID: [
      '노력한 만큼 좋아지는 궁합이에요', '서로 다른 매력이 은근히 잘 어울려요', '대화를 많이 할수록 가까워지는 사이예요',
      '작은 배려가 관계를 크게 바꿀 수 있어요', '티키타카가 있을 때와 없을 때 차이가 큰 편이에요',
    ],
    LOW: [
      '서로 다른 점이 많아 이해가 필요한 궁합이에요', '급하게 다가가기보다 천천히 알아가는 게 좋아요',
      '취향 차이를 존중하면 의외로 괜찮은 사이예요', '오해가 생기기 쉬우니 대화가 중요해요',
      '처음엔 안 맞아도 시간이 해결해줄 수 있어요',
    ],
  };
  const TIPS = [
    '먼저 안부 인사를 건네보세요', '같이 할 수 있는 사소한 활동을 만들어보세요', '솔직한 마음을 표현해보세요',
    '작은 선물이나 메시지로 마음을 전해보세요', '서로의 이야기를 충분히 들어주세요', '함께 사진 한 장 남겨보는 것도 좋아요',
  ];

  function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // 이름 문자열을 결정적으로 0~100 점수로 변환 (같은 이름 조합 = 같은 점수)
  function scoreFor(a, b){
    // 궁합은 두 사람 사이의 값이므로 입력 순서를 바꿔도 같은 점수가 나오도록 이름을 정렬해서 계산한다.
    const [x, y] = [a, b].sort((p, q) => (p < q ? -1 : p > q ? 1 : 0));
    const combined = x + '♥' + y;
    let hash = 0;
    for (let i = 0; i < combined.length; i++){
      hash = (hash * 31 + combined.charCodeAt(i)) >>> 0;
    }
    return hash % 101;
  }

  function tierFor(score){
    if (score >= 70) return 'HIGH';
    if (score >= 40) return 'MID';
    return 'LOW';
  }

  const SPIN_EMOJIS = ['💌', '💕', '💗', '💘', '💖'];
  const RESULT_BY_TIER = {
    HIGH: { emoji: '💘', name: '찰떡궁합!' },
    MID: { emoji: '💗', name: '괜찮은 궁합' },
    LOW: { emoji: '💦', name: '노력이 필요해요' },
  };

  let spinning = false;

  $('pullBtn').addEventListener('click', () => {
    if (spinning) return;

    const n1 = $('name1').value.trim();
    const n2 = $('name2').value.trim();
    if (!n1 || !n2){
      alert('두 사람의 이름을 모두 입력해주세요.');
      return;
    }

    spinning = true;
    $('pullBtn').disabled = true;

    const capsule = $('capsule');
    const emojiEl = $('capsuleEmoji');
    const nameEl = $('capsuleName');
    const score = scoreFor(n1, n2);
    const tier = tierFor(score);
    const result = RESULT_BY_TIER[tier];

    capsule.classList.add('spinning');
    const totalTicks = 18;
    let tick = 0;

    function nextTick(){
      emojiEl.textContent = pick(SPIN_EMOJIS);
      nameEl.textContent = '궁합 뽑는 중';
      tick++;

      if (tick < totalTicks){
        const progress = tick / totalTicks;
        const delay = 60 + Math.pow(progress, 3) * 260;
        setTimeout(nextTick, delay);
      } else {
        capsule.classList.remove('spinning');
        capsule.classList.add('landed');
        setTimeout(() => capsule.classList.remove('landed'), 360);
        emojiEl.textContent = result.emoji;
        nameEl.textContent = result.name;
        spinning = false;
        $('pullBtn').disabled = false;
        reveal(n1, n2, score, tier);
      }
    }

    nextTick();
  });

  function reveal(n1, n2, score, tier){
    $('rScore').textContent = score + '%';
    $('rNamesLabel').textContent = `${n1} ♥ ${n2}`;
    $('rComment').textContent = pick(COMMENTS[tier]);
    $('rTip').textContent = pick(TIPS);

    $('result').classList.add('visible');
    $('shareRow').classList.add('visible');
  }

  $('saveImgBtn').addEventListener('click', () => saveCardAsImage('result', '하루콕-이름궁합.png'));
  $('shareBtn').addEventListener('click', () => shareResult(() =>
    `[이름궁합] ${$('rNamesLabel').textContent} → ${$('rScore').textContent}`
  ));
})();
</script>
