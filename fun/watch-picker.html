<style>
  :root{
    --bg: #ECE8DC;
    --bg-soft: #F7F4EA;
    --plum: #C4562E;
    --ticket: #FFFFFF;
    --ticket-line: #EFDCCE;
    --ink: #2B2038;

  body{
    margin:0;
    padding: 40px 20px 70px;
    background: var(--bg);

    justify-content:center;
  }
  .page{ width:100%; max-width: 480px; text-align:center; }
  h1{ font-family:var(--font-body); font-size:38px; color:var(--plum); margin:0 0 6px; letter-spacing:0.01em; }
  .lede{ font-size:14px; color:var(--muted); margin:0 0 24px; }

  .mood-seg{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:24px; }
  .mood-seg button{ padding:9px 14px; border:1.5px solid var(--line); border-radius:999px; background:var(--ticket); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; }
  .mood-seg button.active{ background:var(--plum); border-color:var(--plum); color:var(--cream-text); }

  .scroll{
    width: 200px; height: 200px; margin: 0 auto 24px; border-radius: 16px;
    background: radial-gradient(circle at 35% 30%, #3D2B22, #1C120C 75%);
    border: 6px solid #150D08;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 10px 18px rgba(0,0,0,0.35);
    transition: transform 0.2s ease;
  }
  .scroll .emoji{ font-size:64px; }
  .scroll.spinning .emoji{ animation: spin-blur 0.22s ease-in-out infinite; }
  @keyframes spin-blur{ 0%, 100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.1) rotate(9deg);} }
  .scroll.landed{ animation: scroll-pop 0.36s cubic-bezier(.34,1.56,.64,1); }
  @keyframes scroll-pop{ 0%{transform:scale(0.86);} 55%{transform:scale(1.08);} 100%{transform:scale(1);} }

  .pull-btn{
    width:100%; padding:18px; background:var(--plum); color:var(--cream-text); border:none; border-radius:14px;
    font-family:var(--font-body); font-size:19px; letter-spacing:0.01em; cursor:pointer;
    box-shadow: 0 4px 0 #8A3A1C;
  }
  .pull-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #8A3A1C; }
  .pull-btn:disabled{ opacity:0.6; cursor:default; }

  .result{ margin-top:28px; display:none; text-align:left; }
  .result.visible{ display:block; }
  .content-card{ background:var(--ticket); border:1px solid var(--ticket-line); color:var(--ink); border-radius:10px; padding:18px 20px; margin-bottom:10px; }
  .content-card .label{ font-family:var(--font-body); font-weight:700; font-size:13.5px; color:var(--plum); margin-bottom:6px; }
  .content-card .text{ font-size:14.5px; line-height:1.55; }
  .tag-row{ display:flex; gap:10px; }
  .tag-row .content-card{ flex:1; text-align:center; }

  .info-block{ margin-top:40px; text-align:left; }
  .info-block h2{ font-family:var(--font-body); font-size:18px; color:var(--plum); margin:0 0 10px; font-weight:400; }
  .info-block p{ font-size:13.5px; line-height:1.65; color:var(--muted); margin:0 0 14px; }
  .faq-item{ margin-bottom:14px; }
  .faq-item .q{ font-size:14px; font-weight:700; color:var(--ink); margin-bottom:5px; }
  .faq-item .a{ font-size:13.5px; line-height:1.6; color:var(--muted); }

  .related{ margin-top:32px; padding-top:20px; border-top:1px solid var(--line); text-align:left; }
  .related-title{ font-size:13px; color:var(--muted); margin-bottom:10px; }
  .related-links{ display:flex; flex-wrap:wrap; gap:8px; }
  .related-links a{ padding:8px 14px; border:1.5px solid var(--line); border-radius:999px; font-size:13px; color:var(--ink); text-decoration:none; }
  .related-links a:hover{ border-color:var(--ink); }

  .back-home{ display:inline-block; font-size:13px; color:var(--muted); text-decoration:none; margin-bottom:14px; }
  .back-home:hover{ color:var(--ink); }

  .share-watermark{ text-align:center; font-family:var(--font-body); font-size:13px; color:var(--muted); margin-top:6px; letter-spacing:0.02em; }
  .share-row{ display:flex; gap:10px; margin:0 0 28px; display:none; }
  .share-row.visible{ display:flex; }
  .share-btn{
    flex:1; padding:12px; border:1.5px solid var(--line); border-radius:12px; background:var(--ticket);
    color:var(--ink); font-size:13px; font-weight:600; cursor:pointer;
  }
  .share-btn:active{ transform:translateY(2px); }
  .share-toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:#fff; font-size:13px; padding:10px 18px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease; z-index:10;
  }
  .share-toast.visible{ opacity:1; transform:translateX(-50%) translateY(0); }

  .site-nav{ display:flex; align-items:center; justify-content:space-between; width:100%; margin:0 0 22px; padding:0 0 14px; border-bottom:1px solid var(--line, #D9D2BF); }
  .site-nav-brand{ font-family:var(--font-body); font-weight:700; font-size:15px; color:var(--ink); text-decoration:none; }
  .site-nav-brand span{ color:var(--stamp, #B23A2E); }
  .site-nav-links{ display:flex; gap:2px; }
  .site-nav-links a{ font-size:13.5px; color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:6px; }
  .site-nav-links a:hover{ color:var(--ink); background:var(--paper-light, rgba(0,0,0,0.045)); }
  .site-nav-links a[aria-current="page"]{ color:var(--ink); font-weight:600; }
  .site-nav-brand:focus-visible, .site-nav-links a:focus-visible{ outline:2px solid var(--stamp, #B23A2E); outline-offset:2px; border-radius:4px; }

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  function showToast(msg){
    const toast = $('shareToast');
    toast.textContent = msg;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 2200);
  }

  function saveCardAsImage(cardId, filename){
    if (typeof html2canvas === 'undefined'){
      alert('이미지 생성 기능을 아직 불러오는 중이에요. 잠시 후 다시 시도해주세요.');
      return;
    }
    const original = $(cardId);
    const clone = original.cloneNode(true);
    clone.style.width = '420px';
    clone.style.maxWidth = '420px';
    clone.style.position = 'fixed';
    clone.style.left = '-9999px';
    clone.style.top = '0';
    document.body.appendChild(clone);

    html2canvas(clone, { backgroundColor: '#ffffff', scale: 2, width: 420 }).then(canvas => {
      document.body.removeChild(clone);
      const link = document.createElement('a');
      link.download = filename;
      canvas.toBlob(blob => {
        if (!blob) { alert('이미지를 만들지 못했어요. 다시 시도하세요.'); return; }
        const url = URL.createObjectURL(blob);
        link.href = url;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }, 'image/png');
    }).catch(() => {
      clone.remove();
      alert('이미지 저장에 실패했어요.');
    });
  }

  function shareResult(getText){
    const text = getText();

    function legacyCopy(){
      try {
        const ta = document.createElement('textarea');
        ta.value = text + ' ' + location.href;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('결과가 복사되었어요');
      } catch(e){
        showToast('공유를 지원하지 않는 환경이에요');
      }
    }

    function fallbackCopy(){
      if (navigator.clipboard){
        navigator.clipboard.writeText(text + ' ' + location.href).then(() => showToast('결과가 복사되었어요')).catch(legacyCopy);
      } else {
        legacyCopy();
      }
    }

    if (navigator.share){
      navigator.share({ title: '하루콕', text, url: location.href })
        .then(() => showToast('공유했어요'))
        .catch(err => { if (!err || err.name !== 'AbortError') fallbackCopy(); });
    } else {
      fallbackCopy();
    }
  }

  // 장르·형식·러닝타임은 서로 어울리는 조합으로만 묶어 뽑는다(예: '토크쇼'는 항상 예능, '수사물 드라마'는 몰아보기).
  const POOL = {
    FUN: {
      picks: [
        { genre: '시트콤 코미디', format: '시트콤', runtime: '30분 안팎 (가볍게)' },
        { genre: '로맨틱 코미디', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '병맛 예능', format: '예능', runtime: '1시간 내외 (부담 없이)' },
        { genre: '토크쇼', format: '예능', runtime: '1시간 내외 (부담 없이)' },
        { genre: '몰래카메라 예능', format: '예능', runtime: '1시간 내외 (부담 없이)' }
      ],
      reasons: ['가볍게 웃으면서 스트레스를 풀 수 있어요', '머리 비우고 편하게 보기 좋아요', '친구랑 같이 봐도 분위기가 좋아요'],
    },
    HEALING: {
      picks: [
        { genre: '일상 힐링 드라마', format: '드라마', runtime: '몰아보기 (시리즈 정주행)' },
        { genre: '자연·여행 다큐', format: '다큐멘터리', runtime: '1시간 내외 (부담 없이)' },
        { genre: '잔잔한 음악 영화', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '요리·음식 다큐', format: '다큐멘터리', runtime: '1시간 내외 (부담 없이)' },
        { genre: '슬로우 라이프 예능', format: '예능', runtime: '1시간 내외 (부담 없이)' }
      ],
      reasons: ['마음이 편안해지는 잔잔한 전개예요', '자기 전에 부담 없이 보기 좋아요', '보고 나면 기분이 차분해져요'],
    },
    THRILL: {
      picks: [
        { genre: '범죄 스릴러', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '수사물 드라마', format: '드라마 시리즈', runtime: '몰아보기 (시리즈 정주행)' },
        { genre: '서바이벌 예능', format: '예능', runtime: '1시간 내외 (부담 없이)' },
        { genre: 'SF 액션', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '미스터리 영화', format: '영화', runtime: '2시간 안팎 (영화 한 편)' }
      ],
      reasons: ['몰입도가 높아 시간 가는 줄 몰라요', '다음 전개가 궁금해서 계속 보게 돼요', '긴장감 있는 전개로 확실히 각성돼요'],
    },
    CRY: {
      picks: [
        { genre: '가족 휴먼 드라마', format: '드라마', runtime: '몰아보기 (시리즈 정주행)' },
        { genre: '멜로 영화', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '실화 바탕 영화', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '반려동물 다큐', format: '다큐멘터리', runtime: '1시간 내외 (부담 없이)' },
        { genre: '이별·성장 서사', format: '드라마', runtime: '몰아보기 (시리즈 정주행)' }
      ],
      reasons: ['감정이입해서 실컷 울기 좋아요', '보고 나면 마음이 정화되는 느낌이에요', '눈물 버튼을 제대로 눌러줘요'],
    },
    ANY: {
      picks: [
        { genre: '로맨스', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '코미디', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '액션', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '스릴러', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '애니메이션', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '다큐멘터리', format: '다큐멘터리', runtime: '1시간 내외 (부담 없이)' },
        { genre: 'SF', format: '영화', runtime: '2시간 안팎 (영화 한 편)' },
        { genre: '미스터리', format: '드라마 시리즈', runtime: '몰아보기 (시리즈 정주행)' },
        { genre: '휴먼 드라마', format: '드라마 시리즈', runtime: '몰아보기 (시리즈 정주행)' },
        { genre: '음악 영화', format: '영화', runtime: '2시간 안팎 (영화 한 편)' }
      ],
      reasons: ['평소 안 보던 장르라 신선하게 즐길 수 있어요', '취향을 넓혀보기 좋은 기회예요', '오늘의 기분에 은근히 잘 맞을 수 있어요'],
    },
  };

  let mood = 'ANY';

  document.querySelectorAll('#moodSeg button').forEach(btn => {
    btn.addEventListener('click', () => {
      mood = btn.dataset.value;
      document.querySelectorAll('#moodSeg button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  function pick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
  }

  let spinning = false;

  $('pullBtn').addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    $('pullBtn').disabled = true;

    const scroll = $('scroll');
    const emojiEl = $('scrollEmoji');
    const emojis = ['🎬','🍿','📺','🎞️','🎧'];

    scroll.classList.add('spinning');
    const totalTicks = 16;
    let tick = 0;

    function nextTick(){
      emojiEl.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      tick++;

      if (tick < totalTicks){
        const progress = tick / totalTicks;
        const delay = 60 + Math.pow(progress, 3) * 240;
        setTimeout(nextTick, delay);
      } else {
        scroll.classList.remove('spinning');
        scroll.classList.add('landed');
        setTimeout(() => scroll.classList.remove('landed'), 360);
        emojiEl.textContent = '🎬';
        spinning = false;
        $('pullBtn').disabled = false;
        reveal();
      }
    }

    nextTick();
  });

  function reveal(){
    const pool = POOL[mood];
    const chosen = pick(pool.picks);
    $('rGenre').textContent = chosen.genre;
    $('rReason').textContent = pick(pool.reasons);
    $('rFormat').textContent = chosen.format;
    $('rRuntime').textContent = chosen.runtime;

    $('result').classList.add('visible');
    $('shareRow').classList.add('visible');
  }

  $('saveImgBtn').addEventListener('click', () => saveCardAsImage('result', '하루콕-오늘뭐볼까.png'));
  $('shareBtn').addEventListener('click', () => shareResult(() =>
    `[오늘 뭐 볼까] ${$('rGenre').textContent} (${$('rFormat').textContent})`
