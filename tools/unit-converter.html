      <button type="button" class="active" data-value="area">평수·넓이</button>

          <input type="text" id="toValue" aria-label="변환 후 값" readonly>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  // 각 카테고리: 기준 단위 대비 배율 (온도는 별도 처리)
  const CATEGORIES = {
    area: {
      unit: '넓이',
      units: { '제곱미터(㎡)': 1, '평': 400 / 121, '헥타르(ha)': 10000, '제곱피트(ft²)': 0.09290304 },
      default: ['평', '제곱미터(㎡)']
    },
    length: {
      unit: '길이',
      units: { '밀리미터(mm)': 0.001, '센티미터(cm)': 0.01, '미터(m)': 1, '킬로미터(km)': 1000, '인치(in)': 0.0254, '피트(ft)': 0.3048, '마일(mile)': 1609.344 },
      default: ['센티미터(cm)', '인치(in)']
    },
    weight: {
      unit: '무게',
      units: { '밀리그램(mg)': 0.001, '그램(g)': 1, '킬로그램(kg)': 1000, '파운드(lb)': 453.59237, '온스(oz)': 28.349523125 },
      default: ['킬로그램(kg)', '파운드(lb)']
    },
    volume: {
      unit: '부피',
      units: { '밀리리터(ml)': 0.001, '리터(L)': 1, '갤런(US gal)': 3.785411784, '컵(200ml)': 0.2 },
      default: ['리터(L)', '갤런(US gal)']
    },
    temp: {
      unit: '온도',
      units: { '섭씨(°C)': 'C', '화씨(°F)': 'F', '켈빈(K)': 'K' },
      default: ['섭씨(°C)', '화씨(°F)']
    }
  };

  let category = 'area';

  document.querySelectorAll('#categorySeg button').forEach(btn => {
    btn.addEventListener('click', () => {
      category = btn.dataset.value;
      document.querySelectorAll('#categorySeg button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      populateUnits();
      convert();
    });
  });

  function populateUnits(){
    const cat = CATEGORIES[category];
    const names = Object.keys(cat.units);
    const fromSel = $('fromUnit');
    const toSel = $('toUnit');
    fromSel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
    toSel.innerHTML = names.map(n => `<option value="${n}">${n}</option>`).join('');
    fromSel.value = cat.default[0];
    toSel.value = cat.default[1];
  }

  function toBase(value, unitKey){
    const cat = CATEGORIES[category];
    const u = cat.units[unitKey];
    if (category === 'temp'){
      if (u === 'C') return value;
      if (u === 'F') return (value - 32) * 5 / 9;
      if (u === 'K') return value - 273.15;
    }
    return value * u;
  }

  function fromBase(baseValue, unitKey){
    const cat = CATEGORIES[category];
    const u = cat.units[unitKey];
    if (category === 'temp'){
      if (u === 'C') return baseValue;
      if (u === 'F') return baseValue * 9 / 5 + 32;
      if (u === 'K') return baseValue + 273.15;
    }
    return baseValue / u;
  }

  function convert(){
    const val = parseFloat($('fromValue').value);
    if (isNaN(val)){
      $('toValue').value = '';
      return;
    }
    const base = toBase(val, $('fromUnit').value);
    const result = fromBase(base, $('toUnit').value);
    $('toValue').value = Math.round(result * 10000) / 10000;
  }

  $('fromValue').addEventListener('input', convert);
  $('fromUnit').addEventListener('change', convert);
  $('toUnit').addEventListener('change', convert);

  $('swapBtn').addEventListener('click', () => {
    const fromU = $('fromUnit').value;
    const toU = $('toUnit').value;
    $('fromUnit').value = toU;
    $('toUnit').value = fromU;
    const fromV = $('fromValue').value;
    $('fromValue').value = $('toValue').value || fromV;
    convert();
  });

  populateUnits();
  convert();
})();
</script>
