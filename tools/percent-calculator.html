<main><h1>퍼센트·할인율 계산기</h1>
<p class="tool-help"><strong>사용방법</strong> 계산 종류를 고르고, 숫자 두 개를 입력하세요.</p>
<noscript><p class="noscript">도구를 사용하려면 브라우저에서 자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet" aria-label="퍼센트 계산">
<form id="calculator">
<fieldset class="mode-choices"><legend>무엇을 구할까요?</legend><div class="mode-buttons">
<button type="button" data-mode="of" aria-pressed="true">몇 %만큼은 얼마?<small>예: 200의 10%</small></button>
<button type="button" data-mode="ratio" aria-pressed="false">전체에서 몇 %?<small>예: 200개 중 30개</small></button>
<button type="button" data-mode="change" aria-pressed="false">몇 % 늘거나 줄었나?<small>예: 3,000 → 3,300</small></button>
<button type="button" data-mode="discount" aria-pressed="false">할인하면 얼마?<small>예: 8만 원에서 15% 할인</small></button>
</div></fieldset><input id="mode" type="hidden" value="of"><p class="hint" id="mode-hint">예: 200의 10%는 20입니다.</p>
<div class="fields"><div class="field"><label id="label-a" for="a">전체 숫자</label><input id="a" placeholder="예: 200" inputmode="decimal" type="number" step="any" min="-1000000000000" max="1000000000000" required></div><div class="field"><label id="label-b" for="b">몇 %를 구할까요?</label><input id="b" placeholder="예: 10" inputmode="decimal" type="number" step="any" min="-1000000000000" max="1000000000000" required></div></div>
<button class="primary" type="submit">퍼센트 계산하기</button><p id="error" class="error" role="alert"></p>
</form>
<div class="result" id="result" aria-live="polite" hidden><div id="result-label" class="result-label"></div><div id="result-value" class="result-value"></div><p id="result-detail"></p><p class="formula" id="formula"></p><p class="hint">소수점 최대 6자리까지 표시합니다.</p></div>
<div class="examples"><button type="button" class="secondary" id="percent-example">예시 숫자로 계산해보기</button></div>
</section>
