<main><h1>평수 계산기</h1>
<p class="tool-help"><strong>사용방법</strong> 계산 종류를 고르고 숫자를 입력하세요.</p>
<noscript><p class="noscript">도구를 사용하려면 브라우저에서 자바스크립트를 허용해 주세요.</p></noscript>
<div class="purpose-switch" role="group" aria-label="계산 종류" hidden><button type="button" data-tool-panel="area-panel" aria-controls="area-panel" aria-pressed="true">㎡ ↔ 평 바꾸기</button><button type="button" data-tool-panel="rectangle-panel" aria-controls="rectangle-panel" aria-pressed="false">가로·세로로 면적 구하기</button></div>
<section class="sheet" id="area-panel" data-tool-panel-content aria-label="제곱미터 ↔ 평 변환">

<form id="area-form" novalidate>
<div class="field"><label for="area-unit">어떤 단위로 알고 있나요?</label><select id="area-unit"><option value="sqm">제곱미터 (㎡) → 평</option><option value="pyeong">평 → 제곱미터 (㎡)</option></select></div>
<div class="field"><label for="area-value" id="area-label">면적 (㎡)</label><input id="area-value" type="number" inputmode="decimal" min="0" max="1000000000" step="any" placeholder="예: 84" aria-describedby="area-input-hint" required><p class="hint" id="area-input-hint">소수점 입력 가능 · 예: 84.96</p></div>
<button class="primary" type="submit">면적 변환하기</button><p id="area-error" class="error" role="alert"></p>
</form>
<div class="result" id="area-result" aria-live="polite" hidden><div id="area-result-label" class="result-label"></div><div id="area-result-value" class="result-value"></div><p class="formula" id="area-formula"></p><p class="hint">소수점 둘째 자리까지 표시합니다. 전용면적·공급면적 구분은 그대로입니다.</p></div>
<div class="examples"><button class="secondary" type="button" data-area-example="sqm,84">84㎡ 예시</button><button class="secondary" type="button" data-area-example="pyeong,32">32평 예시</button></div>
</section>
<section class="sheet" id="rectangle-panel" data-tool-panel-content aria-label="가로·세로로 방 면적 계산">

<form id="rectangle-form" novalidate>
<div class="field"><label for="length-unit">길이를 잰 단위</label><select id="length-unit"><option value="m">미터 (m)</option><option value="cm">센티미터 (cm)</option></select></div>
<div class="fields"><div class="field"><label for="room-width" id="room-width-label">가로 (m)</label><input id="room-width" type="number" inputmode="decimal" min="0" max="1000000" step="any" placeholder="예: 3" required></div><div class="field"><label for="room-length" id="room-length-label">세로 (m)</label><input id="room-length" type="number" inputmode="decimal" min="0" max="1000000" step="any" placeholder="예: 4" required></div></div>
<button class="primary" type="submit">방 면적 계산하기</button><p id="rectangle-error" class="error" role="alert"></p>
</form>
<div class="result" id="rectangle-result" aria-live="polite" hidden><div class="result-label">직사각형 바닥 면적</div><div id="rectangle-result-value" class="result-value"></div><p id="rectangle-pyeong"></p><p class="formula" id="rectangle-formula"></p><p class="hint">벽 두께·공용 공간·시공 손실은 포함하지 않습니다.</p></div>
<div class="examples"><button class="secondary" type="button" id="rectangle-example">3m × 4m 방 예시</button></div>
</section>

<p class="meta">직사각형 기준. 전용면적을 공급면적의 평형으로 바꾸지는 않습니다. 1평 = 400/121㎡.</p>
