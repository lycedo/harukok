<main><h1>날짜·디데이 계산기</h1>
<p class="tool-help"><strong>사용방법</strong> 계산 종류를 고르고 날짜를 입력하세요.</p>
<noscript><p class="noscript">도구를 사용하려면 브라우저에서 자바스크립트를 허용해 주세요.</p></noscript>

<div class="purpose-switch" role="group" aria-label="계산 종류" hidden><button type="button" data-tool-panel="difference-panel" aria-controls="difference-panel" aria-pressed="true">날짜 사이 며칠?</button><button type="button" data-tool-panel="offset-panel" aria-controls="offset-panel" aria-pressed="false">며칠 뒤·전 날짜는?</button></div>
<section class="sheet" id="difference-panel" data-tool-panel-content aria-label="두 날짜는 며칠 차이인가요?">
<form id="difference-form"><div class="fields"><div class="field"><label for="start">이 날짜부터</label><input id="start" type="date" min="1900-01-01" max="2100-12-31" required></div><div class="field"><label for="end">이 날짜까지</label><input id="end" type="date" min="1900-01-01" max="2100-12-31" required></div></div>
<label class="check"><input id="inclusive" type="checkbox"><span>양 끝 날짜를 모두 포함해서 세기<span class="hint">예: 1월 1일~3일을 3일로 계산합니다.</span></span></label>
<button type="submit" class="primary">날짜 차이 계산하기</button><p id="difference-error" class="error" role="alert"></p></form>
<div class="result" id="difference-result" aria-live="polite" hidden><div class="result-label">두 날짜 사이</div><div class="result-value" id="difference-value"></div><p id="dday"></p><p class="hint" id="difference-detail"></p></div></section>
<section class="sheet" id="offset-panel" data-tool-panel-content aria-label="며칠 뒤·전 날짜 찾기"><form id="offset-form"><div class="field"><label for="base">시작 날짜</label><input id="base" type="date" min="1900-01-01" max="2100-12-31" required></div>
<div class="fields"><div class="field"><label for="count-mode">언제인가요?</label><select id="count-mode"><option value="offset">며칠 뒤 (시작일 제외)</option><option value="before">며칠 전</option><option value="nth">며칠째 (시작일 포함)</option></select></div><div class="field"><label for="days">며칠인가요?</label><input id="days" type="number" step="1" min="0" max="36525" value="100" aria-describedby="days-hint" required><p class="hint" id="days-hint">예: 100일 뒤는 100을 입력하세요.</p></div></div>
<button type="submit" class="primary">날짜 찾기</button><p id="offset-error" class="error" role="alert"></p></form><div class="result" id="offset-result" aria-live="polite" hidden><div class="result-label">계산한 날짜</div><div class="result-value" id="offset-value"></div><p id="offset-detail"></p></div><div class="examples"><button type="button" id="example-date" class="secondary">100일째 예시 넣기</button></div></section>
