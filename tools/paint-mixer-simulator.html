<script>
(function(){
  const $ = (id) => document.getElementById(id);

  const PIGMENTS = [
    { name: '티타늄 화이트', hex: '#F7F7F5' },
    { name: '마스 블랙', hex: '#1B1B1B' },
    { name: '카드뮴 레드', hex: '#E3242B' },
    { name: '울트라마린 블루', hex: '#1B3F8B' },
    { name: '카드뮴 옐로우', hex: '#FFD300' },
    { name: '번트 시에나', hex: '#8A3324' },
    { name: '프탈로 그린', hex: '#123524' },
    { name: '다이옥사진 퍼플', hex: '#4B0082' },
    { name: '옐로우 오커', hex: '#CC9A3E' },
    { name: '마젠타', hex: '#CA1F7B' },
  ];

  const pigmentGrid = $('pigmentGrid');
  const emptyNote = $('emptyNote');
  const sliderSection = $('sliderSection');
  const sliderRows = $('sliderRows');
  const liveMixSwatch = $('liveMixSwatch');
  const liveMixHexLabel = $('liveMixHexLabel');

  let selected = new Set();
  const sliderValues = {};

  function hexToRgb(hex){
    const h = hex.replace('#', '');
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  function rgbToHex(rgb){
    return '#' + rgb.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();
  }

  function renderPigments(){
    PIGMENTS.forEach((p, i) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'pigment-chip';
      el.setAttribute('aria-pressed', 'false');
      el.innerHTML = `<span class="swatch" style="background:${p.hex}"></span>${p.name}`;
      el.addEventListener('click', () => {
        if (selected.has(i)) {
          selected.delete(i);
          delete sliderValues[i];
          el.classList.remove('active');
          el.setAttribute('aria-pressed', 'false');
        } else {
          if (selected.size >= 4) return;
          selected.add(i);
          sliderValues[i] = 50;
          el.classList.add('active');
          el.setAttribute('aria-pressed', 'true');
        }
        renderSliders();
      });
      pigmentGrid.appendChild(el);
    });
  }

  function renderSliders(){
    if (selected.size < 2) {
      sliderSection.style.display = 'none';
      emptyNote.style.display = 'block';
      return;
    }
    emptyNote.style.display = 'none';
    sliderSection.style.display = 'block';
    const idxs = [...selected];
    sliderRows.innerHTML = idxs.map(i => `
      <div class="slider-row" data-idx="${i}">
        <span class="dot" style="background:${PIGMENTS[i].hex}"></span>
        <span class="name">${PIGMENTS[i].name}</span>
        <input type="range" aria-label="${PIGMENTS[i].name} 비율" min="1" max="100" value="${sliderValues[i]}">
        <span class="pct" id="pct-${i}">0%</span>
      </div>
    `).join('');
    sliderRows.querySelectorAll('input[type="range"]').forEach(inp => {
      const idx = Number(inp.closest('.slider-row').dataset.idx);
      inp.addEventListener('input', () => {
        sliderValues[idx] = Number(inp.value);
        updateLiveMix();
      });
    });
    updateLiveMix();
  }

  function updateLiveMix(){
    const idxs = [...selected];
    const total = idxs.reduce((s, i) => s + sliderValues[i], 0) || 1;
    const mix = [0, 0, 0];
    idxs.forEach(i => {
      const w = sliderValues[i] / total;
      const rgb = hexToRgb(PIGMENTS[i].hex);
      for (let c = 0; c < 3; c++) mix[c] += w * rgb[c];
      const pctEl = $('pct-' + i);
      if (pctEl) pctEl.textContent = Math.round(w * 100) + '%';
    });
    const hex = rgbToHex(mix);
    liveMixSwatch.style.background = hex;
    liveMixHexLabel.textContent = hex;
  }

  renderPigments();
})();
</script>
