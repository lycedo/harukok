<main><h1>텍스트 일괄 바꾸기</h1><p class="tool-help"><strong>사용방법</strong> 원문과 찾을 글·바꿀 글을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="converter" novalidate><div class="field"><label for="source">입력할 글</label><textarea id="source" rows="6" placeholder="하루콕에서 하루를 시작해요." spellcheck="false"></textarea></div><div class="field"><label for="search">찾을 글</label><textarea id="search" rows="2" placeholder="하루" spellcheck="false"></textarea></div><div class="field"><label for="replacement">바꿀 글 (비우면 삭제)</label><textarea id="replacement" rows="2" placeholder="오늘" spellcheck="false"></textarea></div><label class="check"><input id="case-sensitive" type="checkbox" checked>대소문자 구분</label><p class="hint">원문 200,000자 · 찾을 글 2,000자 · 정규식 미사용</p><button class="primary" id="run" type="submit">바꾸기</button><p id="error" class="error" role="alert"></p></form>
<section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><p id="summary" role="status"></p><label for="output">복사할 결과</label><textarea id="output" rows="6" readonly spellcheck="false"></textarea><div class="actions"><button class="secondary" id="copy" type="button">결과 복사</button></div><p id="copy-status" class="hint" role="status"></p></section></section>
