  <div class="card">
    <div class="output-row">
      <input type="text" id="output" aria-label="생성된 비밀번호" readonly value="비밀번호 생성 버튼을 눌러보세요">

      <label for="length">길이 <span class="val" id="lengthVal">16</span>자</label>
      <input type="range" id="length" min="6" max="32" value="16">
    </div>

    <div class="field">
      <label>포함할 문자 종류</label>
      <div class="check-grid">
        <label class="check-item"><input type="checkbox" id="optUpper" checked> 대문자 (A-Z)</label>
        <label class="check-item"><input type="checkbox" id="optLower" checked> 소문자 (a-z)</label>
        <label class="check-item"><input type="checkbox" id="optNumber" checked> 숫자 (0-9)</label>
        <label class="check-item"><input type="checkbox" id="optSymbol" checked> 특수문자 (!@#$…)</label>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  const CHARSETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    number: '0123456789',
    symbol: '!@#$%^&*()-_=+[]{}'
  };

  $('length').addEventListener('input', () => {
    $('lengthVal').textContent = $('length').value;
  });

  function secureRandomInt(max){
    const arr = new Uint32Array(1);
    const limit = 2 ** 32 - (2 ** 32 % max);
    do { crypto.getRandomValues(arr); } while (arr[0] >= limit);
    return arr[0] % max;
  }

  function generate(){
    const length = parseInt($('length').value, 10);
    let pool = '';
    const required = [];

    if ($('optUpper').checked){ pool += CHARSETS.upper; required.push(CHARSETS.upper); }
    if ($('optLower').checked){ pool += CHARSETS.lower; required.push(CHARSETS.lower); }
    if ($('optNumber').checked){ pool += CHARSETS.number; required.push(CHARSETS.number); }
    if ($('optSymbol').checked){ pool += CHARSETS.symbol; required.push(CHARSETS.symbol); }

    if (!pool){
      $('output').value = '문자 종류를 하나 이상 선택하세요';
      return;
    }

    let chars = required.map(set => set[secureRandomInt(set.length)]);
    while (chars.length < length){
      chars.push(pool[secureRandomInt(pool.length)]);
    }
    // shuffle
    for (let i = chars.length - 1; i > 0; i--){
      const j = secureRandomInt(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    chars = chars.slice(0, length);

    const password = chars.join('');
    $('output').value = password;
    renderStrength(password, pool.length);
  }

  function renderStrength(password, poolSize){
    const entropy = password.length * Math.log2(Math.max(poolSize, 2));
    let pct, label, color;
    if (entropy < 40){ pct = 30; label = '약함'; color = '#B23A2E'; }
    else if (entropy < 65){ pct = 60; label = '보통'; color = '#D6903B'; }
    else if (entropy < 90){ pct = 85; label = '강함'; color = '#4C8C5F'; }
    else { pct = 100; label = '매우 강함'; color = '#2F6B44'; }

    $('strengthFill').style.width = pct + '%';
    $('strengthFill').style.background = color;
    $('strengthLabel').textContent = label;
  }

  $('genBtn').addEventListener('click', generate);

  $('copyBtn').addEventListener('click', async () => {
    const val = $('output').value;
    if (!val || val.includes('선택하세요') || val.includes('눌러보세요')) return;
    try{
      await navigator.clipboard.writeText(val);
      const btn = $('copyBtn');
      const original = btn.textContent;
      btn.textContent = '복사됨!';
      setTimeout(() => { btn.textContent = original; }, 1200);
    }catch(e){
      $('output').select();
      $('copyBtn').textContent = '직접 복사하세요';
    }
  });

  generate();
})();
</script>
