<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>실효 연이율 계산기 | 하루콕</title><meta name="description" content="명목 연이율과 연간 복리 횟수로 실효 연이율 EAR을 계산하세요. 역방향으로 실효 연이율에서 같은 복리 조건의 명목 연이율도 구합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/effective-interest-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 변환 방향·이율·복리 횟수를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="mode-field"><label for="mode">변환 방향</label><select id="mode"><option value="effective">명목 연이율 → 실효 연이율</option><option value="nominal">실효 연이율 → 명목 연이율</option></select></div><div class="field" id="rate-field"><label for="rate">입력 연이율 (%)</label><input id="rate" type="text" placeholder="예: 12" inputmode="decimal" autocomplete="off"></div><div class="field" id="frequency-field"><label for="frequency">연간 복리 횟수</label><select id="frequency"><option value="1">1회</option><option value="2">2회</option><option value="4">4회</option><option value="12">12회</option><option value="365">365회</option></select></div></div><p class="hint">복리만 환산 · 수수료 포함 APR 계산 아님</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>실효 연이율=(1+명목이율÷복리횟수)^복리횟수−1입니다. 역방향은 같은 관계를 풉니다. 수수료나 상품 조건을 더한 APR과는 다릅니다.</p><a href="https://www.consumerfinance.gov/ask-cfpb/what-is-the-difference-between-a-mortgage-interest-rate-and-an-apr-en-135/" target="_blank" rel="noopener noreferrer">CFPB · 이자율과 APR의 차이</a></details></main></div></body></html>
