<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>CSS 이미지 맞춤 만들기 | 하루콕</title><meta name="description" content="이미지 상자 크기·맞춤 방식·기준 위치로 object-fit CSS를 만드세요. 이미지가 잘리는 위치도 조정합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="width">상자 너비(px)</label><input id="width" type="text" maxlength="1000" placeholder="640" autocomplete="off"></div><div class="field"><label for="height">상자 높이(px)</label><input id="height" type="text" maxlength="1000" placeholder="360" autocomplete="off"></div><div class="field"><label for="fit">맞춤 방식</label><select id="fit"><option value="cover">cover · 채우고 자르기</option><option value="contain">contain · 전체 보이기</option><option value="fill">fill · 늘리기</option><option value="none">none</option><option value="scale-down">scale-down</option></select></div><div class="field"><label for="x">가로 기준 위치(%)</label><input id="x" type="text" maxlength="1000" placeholder="50" autocomplete="off"></div><div class="field"><label for="y">세로 기준 위치(%)</label><input id="y" type="text" maxlength="1000" placeholder="50" autocomplete="off"></div><p class="hint">브라우저에서 처리합니다. 서버 전송 없음.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>이미지 상자 크기·맞춤 방식·기준 위치로 object-fit CSS를 만드세요. 이미지가 잘리는 위치도 조정합니다.</p><p><a href="https://www.w3.org/Style/CSS/specs.en.html" target="_blank" rel="noopener noreferrer">W3C CSS specifications</a></p></details>
