<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>반죽 수분율 계산기 | 하루콕</title><meta name="description" content="본반죽 밀가루·물과 스타터 무게·스타터 수분율로 반죽 전체 수분율을 계산하세요. 스타터에 포함된 밀가루와 물을 따로 나눠 더합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/dough-hydration-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="flour-field"><label for="flour">본반죽 밀가루 (g)</label><input id="flour" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div><div class="field" id="water-field"><label for="water">본반죽 물 (g)</label><input id="water" type="text" placeholder="예: 300" inputmode="decimal" autocomplete="off"></div><div class="field" id="starter-field"><label for="starter">스타터 무게 (g)</label><input id="starter" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="hydration-field"><label for="hydration">스타터 수분율 (%)</label><input id="hydration" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div></div><p class="hint">수분율=물 무게÷밀가루 무게 · 달걀·우유 등 수분 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>스타터 밀가루=스타터 무게÷(1+스타터 수분율)입니다. 물과 밀가루를 합산하며 발효 시간이나 조리 안전성은 판단하지 않습니다.</p></details></main></div></body></html>
