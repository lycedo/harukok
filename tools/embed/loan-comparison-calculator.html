<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>대출 조건 비교 계산기 | 하루콕</title><meta name="description" content="같은 원금에 대한 두 대출의 고정 연이자율·기간·별도 수수료를 비교하세요. 원리금균등 월 납입액과 입력 기간의 총비용을 추정합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/loan-comparison-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 원금과 두 조건의 이자율·기간·수수료를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="principal-field"><label for="principal">공통 원금 (원)</label><input id="principal" type="text" placeholder="예: 10000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="rateA-field"><label for="rateA">A 연이자율 (%)</label><input id="rateA" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="monthsA-field"><label for="monthsA">A 기간 (개월)</label><input id="monthsA" type="text" placeholder="예: 36" inputmode="decimal" autocomplete="off"></div><div class="field" id="feeA-field"><label for="feeA">A 별도 수수료 (원)</label><input id="feeA" type="text" placeholder="예: 0" inputmode="decimal" autocomplete="off"></div><div class="field" id="rateB-field"><label for="rateB">B 연이자율 (%)</label><input id="rateB" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div><div class="field" id="monthsB-field"><label for="monthsB">B 기간 (개월)</label><input id="monthsB" type="text" placeholder="예: 24" inputmode="decimal" autocomplete="off"></div><div class="field" id="feeB-field"><label for="feeB">B 별도 수수료 (원)</label><input id="feeB" type="text" placeholder="예: 0" inputmode="decimal" autocomplete="off"></div></div><p class="hint">원리금균등 · 입력 수수료만 포함 · 실제 상품 추천 아님</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>입력값을 일정하게 둔 수학적 추정입니다. 실제 상품의 세금·수수료·일수 계산과 다를 수 있습니다. 원 단위 반올림은 표시에만 적용합니다. 수수료는 이자에 합산해 빌리지 않고 별도 지출로 더합니다. 기간이 다르면 총비용을 같은 기간의 비용으로 해석하지 마세요.</p><a href="https://www.consumerfinance.gov/ask-cfpb/what-is-amortization-and-how-could-it-affect-my-auto-loan-en-771/" target="_blank" rel="noopener noreferrer">CFPB · 원리금 상환</a></details></main></div></body></html>
