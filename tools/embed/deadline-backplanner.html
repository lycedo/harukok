<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>마감 역산 작업일 계획기 | 하루콕</title><meta name="description" content="마감일에서 주말·제외일을 건너뛰며 작업별 필요한 평일 수를 역산하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/deadline-backplanner.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="deadline-field"><label for="deadline">마감일</label><input id="deadline" type="date" placeholder="2026-01-09" min="1900-01-01" max="2100-12-31"></div><div class="field" id="tasks-field"><label for="tasks">실행 순서 작업,평일 수</label><textarea id="tasks" rows="6" maxlength="100000" placeholder="초안,2
