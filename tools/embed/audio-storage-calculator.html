<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>PCM 오디오 용량 계산기 | 하루콕</title><meta name="description" content="샘플레이트·채널·비트 깊이와 길이로 압축하지 않은 PCM 오디오 용량을 계산하세요. 샘플 프레임 수와 바이트·MiB·GiB를 표시합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/audio-storage-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 샘플레이트·채널·비트 깊이·길이를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="sampleRate-field"><label for="sampleRate">샘플레이트 (Hz)</label><input id="sampleRate" type="text" placeholder="예: 48000" inputmode="decimal" autocomplete="off"></div><div class="field" id="channels-field"><label for="channels">채널 수</label><input id="channels" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div><div class="field" id="bits-field"><label for="bits">샘플당 비트 깊이</label><select id="bits"><option value="8">8bit</option><option value="16">16bit</option><option value="24">24bit</option><option value="32">32bit</option></select></div><div class="field" id="seconds-field"><label for="seconds">재생 길이 (초)</label><input id="seconds" type="text" placeholder="예: 60" inputmode="decimal" autocomplete="off"></div></div><p class="hint">압축 없는 PCM · 파일 헤더·메타데이터 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>데이터 크기=샘플 프레임 수×채널 수×비트 깊이÷8입니다. 길이를 가장 가까운 샘플 프레임으로 반올림하며 MP3·AAC 같은 압축 파일 크기는 계산하지 않습니다.</p></details></main></div></body></html>
