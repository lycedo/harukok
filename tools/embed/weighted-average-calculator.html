<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="pairs-field"><label for="pairs">값, 가중치</label><textarea id="pairs" rows="4" placeholder="80, 30
90, 70" spellcheck="false"></textarea></div></div><p class="hint">1~1,000행 · 값 ±10억 · 가중치 0~10억</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="4" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>가중평균은 Σ(값×가중치)÷Σ가중치입니다. 가중치의 합은 100이나 1일 필요가 없으며, 0인 가중치는 결과에 영향을 주지 않습니다.</p></details>
