<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>벽지 소요량 계산기 | 하루콕</title><meta name="description" content="벽 크기와 벽지 롤 규격으로 필요한 폭 수와 롤 수를 계산하세요. 재단 여유와 무늬 반복 길이를 반영해 세로 재단 길이를 구합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/wallpaper-calculator.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 벽·롤 크기와 무늬·재단 여유를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="width">벽 가로 (m)</label><input id="width" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div><div class="field"><label for="height">벽 높이 (m)</label><input id="height" type="text" placeholder="예: 2.4" inputmode="decimal" autocomplete="off"></div><div class="field"><label for="rollWidth">롤 폭 (m)</label><input id="rollWidth" type="text" placeholder="예: 0.5" inputmode="decimal" autocomplete="off"></div><div class="field"><label for="rollLength">롤 길이 (m)</label><input id="rollLength" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field"><label for="pattern">무늬 반복 (cm, 없으면 0)</label><input id="pattern" type="text" placeholder="예: 0" inputmode="decimal" autocomplete="off"></div><div class="field"><label for="trim">한 폭당 총 재단 여유 (cm)</label><input id="trim" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">직사각형 벽 1면 · 창·문 차감·엇갈림 무늬 제외</p><button id="start" class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>한 폭은 벽 높이와 재단 여유를 더한 뒤 무늬 반복 길이의 배수로 올림합니다. 같은 위치에서 반복되는 무늬만 가정하며 반맞춤·엇갈림 무늬나 이어 붙이기는 반영하지 않습니다.</p></details>
</main></div></body></html>
