<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>N그램 빈도 분석기 | 하루콕</title><meta name="description" content="글에서 연속된 2~5개 문자나 단어 묶음의 빈도를 세세요. 반복 구절과 문자 패턴을 횟수순으로 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/ngram-counter.js?v=20261104-300" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 글과 묶음 크기를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">원문</label><textarea id="source" rows="5" maxlength="100000" placeholder="하루 콕 하루 콕 하루" spellcheck="false"></textarea></div><div class="field"><label for="n">묶음 크기 n</label><input id="n" type="text" maxlength="1000" placeholder="2" autocomplete="off"></div><div class="field"><label for="mode">단위</label><select id="mode"><option value="words">단어 묶음</option><option value="characters">문자 묶음</option></select></div><div class="field"><label for="case">영문 대소문자</label><select id="case"><option value="lower">구분하지 않기</option><option value="keep">구분하기</option></select></div><p class="hint">20,000자 · n 2~5 · 상위 1,000종 표시</p><button class="primary" type="submit">분석하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>NFC 정규화와 LF 줄바꿈을 사용합니다. 단어는 문자·숫자 묶음, 문자는 코드 포인트이며 공백을 포함합니다. 겹치는 묶음을 모두 셉니다.</p></details>
</main></div></body></html>
