<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>모임 비용 정산 계산기 | 하루콕</title><meta name="description" content="참여자별로 낸 금액을 입력해 동일 부담 정산안을 만드세요. 1원 단위 합계를 보존하고 누가 누구에게 얼마를 보내면 되는지 계산합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/expense-settlement-calculator.js?v=20261108-1000" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 이름과 낸 금액을 한 줄에 하나씩 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="expenses-field"><label for="expenses">이름, 낸 금액 (원)</label><textarea id="expenses" rows="6" maxlength="20000" placeholder="민수,30000
지연,10000
수아,20000" spellcheck="false"></textarea></div></div><p class="hint">동일 부담 · 남는 1원은 입력 순서로 배분 · 실제 이체 없음</p><button class="primary" type="submit">정산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>이름은 중복 없이 적고 금액은 천 단위 쉼표 없는 정수로 넣습니다. 각자 지출과 최종 부담금의 차이를 맞추는 정산안 중 하나이며 실제 송금은 하지 않습니다.</p></details>
</main></div></body></html>
