<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="water-field"><label for="water">물 무게 (g)</label><input id="water" type="text" placeholder="예: 1000" inputmode="decimal" autocomplete="off"></div><div class="field" id="percent-field"><label for="percent">소금 비율 (%)</label><input id="percent" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="basis-field"><label for="basis">비율 기준</label><select id="basis"><option value="solution">물+소금 전체 질량 대비</option><option value="water">물 질량 대비</option></select></div></div><p class="hint">질량 기준 · 소금 순도 100% 가정 · 보존·발효 안전 지침 아님</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>전체 질량 기준에서는 소금=물×농도÷(100−농도)입니다. 물 기준은 물×비율÷100이며 부피 농도와는 다릅니다.</p></details></main></div></body></html>
