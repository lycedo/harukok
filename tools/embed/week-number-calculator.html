<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>주차 계산기 | 하루콕</title><meta name="description" content="날짜의 ISO 8601 주차와 주차 연도를 확인하세요. 월요일부터 일요일까지의 주간 날짜와 연말·연초의 주차 연도 차이도 표시합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/week-number-calculator.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 확인할 날짜를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="date">날짜</label><input id="date" type="date" placeholder="예: 2026-11-04" min="1900-01-01" max="2100-12-31"></div></div><p class="hint">월요일 시작 · 첫 목요일이 있는 주가 1주차</p><button id="start" class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>한 주에 속한 목요일의 연도를 주차 연도로 사용합니다. 그래서 연초 날짜가 이전 연도의 마지막 주차이거나 연말 날짜가 다음 연도 1주차일 수 있습니다.</p></details>
</main></div></body></html>
