<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>뜨개 실 소요량 계산기 | 하루콕</title><meta name="description" content="게이지 스와치의 면적·무게와 완성 면적으로 실 소요량을 비례 계산하세요. 실 한 볼의 무게·길이와 여유율로 총 길이와 필요한 볼 수를 구합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/yarn-length-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 스와치·완성 면적·실 규격을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="width-field"><label for="width">스와치 가로 (cm)</label><input id="width" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">스와치 세로 (cm)</label><input id="height" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="weight-field"><label for="weight">스와치 무게 (g)</label><input id="weight" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div><div class="field" id="area-field"><label for="area">완성 뜨개 면적</label><input id="area" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field" id="areaUnit-field"><label for="areaUnit">완성 면적 단위</label><select id="areaUnit"><option value="m2">m²</option><option value="cm2">cm²</option></select></div><div class="field" id="ballWeight-field"><label for="ballWeight">실 한 볼 무게 (g)</label><input id="ballWeight" type="text" placeholder="예: 50" inputmode="decimal" autocomplete="off"></div><div class="field" id="ballLength-field"><label for="ballLength">실 한 볼 길이 (m)</label><input id="ballLength" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="waste-field"><label for="waste">추가 여유 (%)</label><input id="waste" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">같은 실·무늬·게이지 가정 · 완성 뜨개 면적 직접 입력</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>스와치의 단위 면적당 무게를 전체 면적에 비례 적용합니다. 옷의 앞·뒤·소매 등 모든 면적을 합쳐 넣으며 무늬·장력·세탁 수축이 달라지면 실제 소요량도 달라집니다.</p></details></main></div></body></html>
