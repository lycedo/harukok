<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>바닥재 줄·끝폭 배치 계산기 | 하루콕</title><meta name="description" content="바닥재 줄의 마지막 폭이 최소 폭보다 작으면 첫·끝 줄에 나눠 배치하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/laminate-course-layout-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="width-field"><label for="width">방 폭 (mm)</label><input id="width" type="text" placeholder="예: 3100" inputmode="decimal" autocomplete="off"></div><div class="field" id="plank-field"><label for="plank">판재 폭 (mm)</label><input id="plank" type="text" placeholder="예: 200" inputmode="decimal" autocomplete="off"></div><div class="field" id="gap-field"><label for="gap">벽 한쪽 팽창 여유 (mm)</label><input id="gap" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="minimum-field"><label for="minimum">직접 정한 최소 끝폭 (mm)</label><input id="minimum" type="text" placeholder="예: 50" inputmode="decimal" autocomplete="off"></div></div><p class="hint">줄 폭 배치만 · 길이·엇갈림·조인트 잠금 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>마지막 폭이 사용자 최소값 미만이면 판 한 폭과 나머지를 양쪽에 반씩 나눕니다.</p></details></main></div></body></html>
