<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>표 열 추출기 | 하루콕</title><meta name="description" content="엑셀에서 복사한 탭 구분 표에서 원하는 열을 추출하세요. 열 번호·범위를 지정해 필요한 순서로 가져옵니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/text-column-extractor.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 표를 붙여넣고 열 번호를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">탭으로 구분한 표</label><textarea id="source" rows="5" maxlength="100000" placeholder="이름	나이	지역
하루	20	서울" spellcheck="false"></textarea></div><div class="field"><label for="columns">가져올 열 (1부터)</label><input id="columns" type="text" placeholder="1,3" autocomplete="off" maxlength="10000"></div><p class="hint">100,000자·10,000줄 · 최대 1,000열·결과 200,000칸</p><button class="primary" type="submit">열 추출하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>쉼표 또는 범위로 열을 지정합니다(1,3-5). 중복 번호는 한 번만 남기고 없는 열은 빈칸으로 둡니다. 마지막 줄바꿈 하나는 제외합니다.</p></details>
</main></div></body></html>
