<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/json-flattener.js?v=20261104-160" defer></script>

<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 중첩된 JSON을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">JSON</label><textarea id="source" rows="5" maxlength="100000" placeholder="{&quot;user&quot;:{&quot;name&quot;:&quot;하루&quot;},&quot;tags&quot;:[&quot;도구&quot;]}" spellcheck="false"></textarea></div><p class="hint">JSON 100,000자 · 중첩 40단계</p><button class="primary" type="submit">평탄화하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>각 키는 JSON Pointer 경로입니다. ~는 ~0, /는 ~1로 표시합니다. 빈 배열·객체도 값으로 남깁니다. 루트 값의 경로는 빈 문자열입니다.</p></details>
