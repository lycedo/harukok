<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>타임랩스 계산기 | 하루콕</title><meta name="description" content="타임랩스 촬영 시간·촬영 간격·재생 FPS로 촬영 장수와 완성 영상 길이를 계산하세요. 첫 장은 시작 즉시 찍고 종료시각의 장도 포함합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/timelapse-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="duration-field"><label for="duration">전체 촬영 시간 (초)</label><input id="duration" type="text" placeholder="예: 3600" inputmode="decimal" autocomplete="off"></div><div class="field" id="interval-field"><label for="interval">촬영 시작 간격 (초)</label><input id="interval" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="fps-field"><label for="fps">재생 FPS</label><input id="fps" type="text" placeholder="예: 30" inputmode="decimal" autocomplete="off"></div><div class="field" id="exposure-field"><label for="exposure">한 장 노출시간 (초)</label><input id="exposure" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div></div><p class="hint">시작 0초 첫 장 포함 · 촬영시간은 마지막 시작시각 한도 · 저장 지연 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>장수=floor(촬영 시간÷간격)+1입니다. 영상 길이는 장수÷FPS이며 마지막 노출은 지정 촬영시간 뒤에 끝날 수 있습니다.</p></details></main></div></body></html>
