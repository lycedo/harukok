<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 텍스트 data URI를 붙여넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">텍스트 data URI</label><textarea id="source" rows="5" maxlength="200000" placeholder="data:text/plain;charset=UTF-8,%ED%95%98%EB%A3%A8%EC%BD%95" spellcheck="false"></textarea></div><p class="hint">UTF-8·US-ASCII 텍스트만 · charset 생략은 ASCII</p><button class="primary" type="submit">분석하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>지원 헤더는 MIME 타입, charset, 마지막 ;base64입니다. 다른 매개변수·따옴표 매개변수·공백·조각(#)은 지원하지 않습니다. 퍼센트는 두 자리 16진수여야 하며 UTF-8 BOM은 보존합니다. 파일을 열거나 HTML을 실행하지 않습니다.</p><p><a href="https://www.rfc-editor.org/rfc/rfc2397" target="_blank" rel="noopener noreferrer">Data URI 형식</a></p></details>
</main></div></body></html>
