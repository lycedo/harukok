<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>분산·표준편차 계산기 | 하루콕</title><meta name="description" content="숫자 목록의 모분산·표본분산과 표준편차를 계산하세요. 모집단과 표본 기준을 선택하고 평균과 자료 수를 함께 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/statistics-calculator.js?v=20261104" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 숫자를 나누어 넣고 계산 기준을 고르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">숫자 목록</label><textarea id="source" rows="5" placeholder="예: 2, 4, 4, 4, 5, 5, 7, 9" spellcheck="false"></textarea></div><div class="field"><label for="mode">계산 기준</label><select id="mode"><option value="population">모집단 전체 (N으로 나눔)</option><option value="sample">표본 (N−1로 나눔)</option></select></div><p class="hint">최대 10,000개 · 값 ±1조 · 쉼표·공백·줄바꿈으로 구분</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="4" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>분산은 평균에서 떨어진 정도를 제곱한 값의 평균이며 표준편차는 그 제곱근입니다. 표본은 N−1로 나눕니다. 입력 숫자와 같은 단위를 쓰는 값은 표준편차이며 결과는 근삿값입니다.</p></details>
</main></div></body></html>
