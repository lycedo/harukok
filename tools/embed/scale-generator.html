<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>음계 생성기 | 하루콕</title><meta name="description" content="으뜸음과 음계 종류로 장음계·단음계·펜타토닉·반음계를 만드세요. 음계 구성음과 으뜸음 기준 반음 위치를 함께 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/scale-generator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 으뜸음과 음계 종류를 고르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="root-field"><label for="root">으뜸음</label><select id="root"><option value="C">C</option><option value="C#">C#</option><option value="D">D</option><option value="Eb">Eb</option><option value="E">E</option><option value="F">F</option><option value="F#">F#</option><option value="G">G</option><option value="Ab">Ab</option><option value="A">A</option><option value="Bb">Bb</option><option value="B">B</option></select></div><div class="field" id="scale-field"><label for="scale">음계</label><select id="scale"><option value="major">장음계</option><option value="minor">자연 단음계</option><option value="harmonic">화성 단음계</option><option value="melodic">가락 단음계 (상행)</option><option value="majorPenta">장조 펜타토닉</option><option value="minorPenta">단조 펜타토닉</option><option value="chromatic">반음계</option></select></div></div><p class="hint">가락 단음계는 상행 기준 · 옥타브 구분 없는 음이름</p><button class="primary" type="submit">음계 만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>장·단음계는 음도 순서에 맞춰 샵·플랫 철자를 만듭니다. 반음계는 이명동음 단순 표기를 사용하며 실제 연주 운지나 악기의 조옮김은 적용하지 않습니다.</p></details></main></div></body></html>
