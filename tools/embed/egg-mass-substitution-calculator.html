<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>달걀 질량 대체 계산기 | 하루콕</title><meta name="description" content="달걀 개수와 가식부 무게로 필요한 총질량과 다른 크기 달걀의 환산 개수를 구하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/egg-mass-substitution-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="count-field"><label for="count">원래 달걀 수</label><input id="count" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="original-field"><label for="original">원래 1개 가식부 질량 (g)</label><input id="original" type="text" placeholder="예: 50" inputmode="decimal" autocomplete="off"></div><div class="field" id="replacement-field"><label for="replacement">대체 1개 가식부 질량 (g)</label><input id="replacement" type="text" placeholder="예: 60" inputmode="decimal" autocomplete="off"></div></div><p class="hint">껍데기 제외 직접 잰 질량 · 흰자·노른자 조성 차이 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>등급별 고정 달걀 무게를 가정하지 않습니다. 부분 개수는 질량으로 계량하세요.</p></details></main></div></body></html>
