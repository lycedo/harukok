<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>벽돌 수량 계산기 | 하루콕</title><meta name="description" content="벽 순면적·벽돌 가로·높이·줄눈 폭으로 한 겹 벽의 벽돌 수를 견적 내세요. 줄눈을 포함한 반복 모듈 면적과 파손 여유를 사용합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/brick-quantity-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="area-field"><label for="area">개구부 제외 벽 순면적 (m²)</label><input id="area" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="width-field"><label for="width">벽돌 보이는 가로 (mm)</label><input id="width" type="text" placeholder="예: 190" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">벽돌 보이는 높이 (mm)</label><input id="height" type="text" placeholder="예: 57" inputmode="decimal" autocomplete="off"></div><div class="field" id="joint-field"><label for="joint">줄눈 폭 (mm)</label><input id="joint" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="waste-field"><label for="waste">파손 여유 (%)</label><input id="waste" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div></div><p class="hint">한 겹 평면 반복 모듈 견적 · 모서리·쌓기 패턴·구조 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>줄눈을 포함한 (가로+줄눈)×(높이+줄눈)을 반복 모듈로 사용합니다. 가장자리 줄눈과 절단·연결 철물은 따로 산정하세요.</p></details></main></div></body></html>
