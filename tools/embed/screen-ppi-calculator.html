<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>화면 PPI 계산기 - 무료 도구 | 하루콕</title><meta name="description" content="모니터의 가로·세로 해상도와 대각선 인치로 PPI 픽셀 밀도 및 실제 화면 가로·세로 크기를 계산하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/image-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/creative100-common.js?v=20261104" defer></script><script src="/tools/screen-ppi-calculator.js?v=20261104" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content">
<style>body{display:flow-root;padding:0;background:transparent}</style></head><body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 해상도와 대각선 인치를 입력하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="pixel-width">가로 해상도 (px)</label><input id="pixel-width" type="number" placeholder="예: 1920" inputmode="decimal" min="1" max="100000" step="1"></div><div class="field"><label for="pixel-height">세로 해상도 (px)</label><input id="pixel-height" type="number" placeholder="예: 1080" inputmode="decimal" min="1" max="100000" step="1"></div></div><div class="field"><label for="diagonal">화면 대각선 (인치)</label><input id="diagonal" type="number" placeholder="예: 24" step="any" inputmode="decimal" min="0.1" max="1000"></div><button class="primary" type="submit">PPI 계산하기</button><p class="error" id="error" role="alert"></p></form><section class="result" id="result" hidden aria-live="polite"><h2>결과</h2><div class="result-value" id="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button class="secondary" id="copy" type="button">결과 복사하기</button><p class="hint" id="copy-status" role="status"></p></section></section>

<details class="tool-notes"><summary>도움말</summary><p>PPI = √(가로² + 세로²) ÷ 대각선 인치입니다. 베젤을 제외한 직사각형 화면 기준이며 프린터 DPI와 다릅니다.</p><p>파일·입력값은 브라우저 안에서 처리하며 서버로 전송하거나 저장하지 않습니다.</p></details></main></div></body></html>
