<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>PDF 글자 추가 | 하루콕</title><meta name="description" content="선택한 페이지의 위·왼쪽 위치에 글자를 넣습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><link rel="stylesheet" href="/tools/image-tools.css?v=20261027-image"><script src="/tools/vendor/pdf-lib-1.17.1.min.js" defer></script><script src="/tools/vendor/fontkit-1.1.1.min.js" defer></script><script src="/tools/native1000-ui.js?v=20261108-1000" defer></script><script src="/tools/native1000-pdf.js?v=20261108-1000" defer></script><script src="/tools/pdf-add-text.js?v=20261108-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head><body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="field"><label for="files">PDF 파일</label><input class="image-file" type="file" id="files" accept=".pdf,application/pdf"><p id="file-status" class="hint" role="status"></p></div><fieldset id="file-controls" class="image-controls"><legend>설정</legend><div class="field"><label for="pages">페이지 · 비우면 전체</label><input id="pages" type="text" value="" placeholder="1-3,5" maxlength="10000" autocomplete="off"></div><div class="field"><label for="text">넣을 글자</label><input id="text" type="text" value="" placeholder="하루콕" maxlength="10000" autocomplete="off"></div><div class="field"><label for="x">왼쪽 여백 · mm</label><input id="x" type="text" value="20" placeholder="20" maxlength="10000" autocomplete="off"></div><div class="field"><label for="y">위쪽 여백 · mm</label><input id="y" type="text" value="20" placeholder="20" maxlength="10000" autocomplete="off"></div><div class="field"><label for="size">글자 크기 · pt</label><input id="size" type="text" value="12" placeholder="12" maxlength="10000" autocomplete="off"></div><p class="hint">PDF당20MB·합계50MB·200쪽 · 암호 PDF 제외 · 서버 전송 없음</p><button id="execute" class="primary" type="submit">실행하기</button></fieldset><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><div id="file-preview" class="image-preview"></div><div id="downloads" class="actions"></div><label for="result-text">복사할 결과</label><textarea id="result-text" class="code-output" rows="3" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>참고</summary><p>원본은 보존하고 결과 파일을 새로 만듭니다.</p><a href="/tools/vendor/THIRD_PARTY_LICENSES.txt">공개 라이브러리 고지</a></details></main></div></body></html>
