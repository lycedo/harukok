<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>robots.txt 만들기 | 하루콕</title><meta name="description" content="크롤러 이름·허용·제외 경로와 사이트맵 주소로 robots.txt 초안을 만드세요. 줄 삽입과 잘못된 경로를 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/robots-txt-generator.js?v=20261104-300" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 크롤러 이름과 경로를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="agent">크롤러 이름 (*은 전체)</label><input id="agent" type="text" maxlength="1000" placeholder="*" autocomplete="off"></div><div class="field"><label for="allow">허용 경로 (선택)</label><textarea id="allow" rows="5" maxlength="100000" placeholder="/public/" spellcheck="false"></textarea></div><div class="field"><label for="disallow">제외 경로 (선택)</label><textarea id="disallow" rows="5" maxlength="100000" placeholder="/private/" spellcheck="false"></textarea></div><div class="field"><label for="sitemap">사이트맵 URL (선택)</label><input id="sitemap" type="text" maxlength="1000" placeholder="https://example.com/sitemap.xml" autocomplete="off"></div><p class="hint">크롤링 지침 생성 · 실제 사이트 파일 변경 없음</p><button class="primary" type="submit">만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>Allow 목록 밖의 경로가 자동으로 금지되지는 않습니다. 허용·제외가 모두 비면 전체 허용입니다. 경로는 /로 시작하며 공백·#은 인코딩해야 합니다. robots.txt는 인증이나 보안 차단 기능이 아닙니다.</p><p><a href="https://www.rfc-editor.org/rfc/rfc9309" target="_blank" rel="noopener noreferrer">Robots Exclusion Protocol</a></p></details>
</main></div></body></html>
