<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>목표 저축액 계산기 | 하루콕</title><meta name="description" content="현재 자금과 목표 금액·기간·가정 수익률로 필요한 월말 납입액을 계산하세요. 초기 자금의 월 복리와 매월 같은 금액의 납입을 반영합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/savings-goal-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 현재 자금·목표·기간·수익률을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="initial-field"><label for="initial">현재 자금 (원, 정수)</label><input id="initial" type="text" placeholder="예: 1000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="target-field"><label for="target">목표 금액 (원, 정수)</label><input id="target" type="text" placeholder="예: 10000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="months-field"><label for="months">기간 (개월)</label><input id="months" type="text" placeholder="예: 36" inputmode="decimal" autocomplete="off"></div><div class="field" id="rate-field"><label for="rate">가정 명목 연이율 (%)</label><input id="rate" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div></div><p class="hint">월말 납입 · 월 복리 · 연이율 소수점 12자리 · 원 단위 올림</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>입력값을 일정하게 둔 수학적 추정입니다. 실제 상품의 세금·수수료·일수 계산과 다를 수 있습니다. 원 단위 반올림은 표시에만 적용합니다. 필요한 월 납입액의 올림은 입력 십진값으로 정확히 결정합니다. 목표는 기간 종료 시점 기준입니다. 음수 수익률이면 현재 자금이 목표 이상이어도 납입이 필요할 수 있습니다.</p><a href="https://www.investor.gov/savings-goal-calculator" target="_blank" rel="noopener noreferrer">SEC Investor.gov · 목표 저축 계산</a></details></main></div></body></html>
