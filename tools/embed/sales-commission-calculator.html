<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>판매 수수료 계산기 | 하루콕</title><meta name="description" content="판매금액·정률 수수료·건당 고정비로 정산액을 계산하세요. 목표 정산액을 받기 위한 최소 정수 판매가도 역산합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/sales-commission-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="mode-field"><label for="mode">계산 방향</label><select id="mode"><option value="sale">판매가 → 정산액</option><option value="net">목표 정산액 → 판매가</option></select></div><div class="field" id="amount-field"><label for="amount">금액 (원)</label><input id="amount" type="text" placeholder="예: 10000" inputmode="decimal" autocomplete="off"></div><div class="field" id="rate-field"><label for="rate">판매가 대비 수수료 (%)</label><input id="rate" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="fixed-field"><label for="fixed">건당 고정 수수료 (원)</label><input id="fixed" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div></div><p class="hint">판매가 1원 단위 올림 · 수수료·정산액은 소수 원 표시</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>정산액=판매가×(1−수수료율)−고정비입니다. 정률 수수료는 중간에 반올림하지 않으며 실제 플랫폼의 반올림·과세 규칙과 다를 수 있습니다.</p></details></main></div></body></html>
