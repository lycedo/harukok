<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>밀가루 단백질 배합 계산기 | 하루콕</title><meta name="description" content="단백질 함량이 다른 두 밀가루를 목표 함량으로 섞는 질량을 구하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/flour-protein-blend-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="total-field"><label for="total">완성 밀가루 총질량 (g)</label><input id="total" type="text" placeholder="예: 1000" inputmode="decimal" autocomplete="off"></div><div class="field" id="low-field"><label for="low">낮은 단백질 함량 (%)</label><input id="low" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="high-field"><label for="high">높은 단백질 함량 (%)</label><input id="high" type="text" placeholder="예: 14" inputmode="decimal" autocomplete="off"></div><div class="field" id="target-field"><label for="target">목표 단백질 함량 (%)</label><input id="target" type="text" placeholder="예: 12" inputmode="decimal" autocomplete="off"></div></div><p class="hint">표시된 단백질 질량 비율 기준 · 제빵 성능 동일 보장 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>밀가루 혼합의 가중평균 함량만 계산합니다. 글루텐 강도·흡수율은 별도 특성입니다.</p></details></main></div></body></html>
