<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 글 또는 16진수 바이트를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">글 또는 16진수 바이트</label><textarea id="source" rows="5" maxlength="100000" placeholder="123456789" spellcheck="false"></textarea></div><div class="field"><label for="mode">입력 형식</label><select id="mode"><option value="text">UTF-8 글</option><option value="hex">16진수 바이트</option></select></div><p class="hint">CRC-32/ISO-HDLC · 최대 100,000바이트</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>
