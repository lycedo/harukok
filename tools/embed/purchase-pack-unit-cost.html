<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>묶음 구매 단위 원가 계산기 | 하루콕</title><meta name="description" content="박스·봉지 단위 구매를 실제 사용 기본단위 원가로 환산하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/purchase-pack-unit-cost.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="boxes-field"><label for="boxes">구매 박스 수</label><input id="boxes" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div><div class="field" id="packs-field"><label for="packs">박스당 개별 포장 수</label><input id="packs" type="text" placeholder="예: 12" inputmode="decimal" autocomplete="off"></div><div class="field" id="quantity-field"><label for="quantity">포장당 기본단위 양</label><input id="quantity" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div><div class="field" id="usable-field"><label for="usable">실사용 가능 비율 (%)</label><input id="usable" type="text" placeholder="예: 90" inputmode="decimal" autocomplete="off"></div><div class="field" id="cost-field"><label for="cost">총구매비+배송비 (원)</label><input id="cost" type="text" placeholder="예: 54000" inputmode="decimal" autocomplete="off"></div></div><p class="hint">기본단위는 g·mL·개 등 직접 통일 · 총비용 직접 입력</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>단위가 다른 상품을 자동 환산하지 않습니다.</p></details></main></div></body></html>
