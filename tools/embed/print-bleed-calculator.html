<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>인쇄 도련·안전선 계산기 | 하루콕</title><meta name="description" content="완성 인쇄물 크기·도련·안전 여백·해상도로 작업 캔버스와 안전영역 치수를 계산하세요. mm와 올림 픽셀을 함께 표시합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/print-bleed-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="width-field"><label for="width">완성 가로 (mm)</label><input id="width" type="text" placeholder="예: 90" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">완성 세로 (mm)</label><input id="height" type="text" placeholder="예: 50" inputmode="decimal" autocomplete="off"></div><div class="field" id="bleed-field"><label for="bleed">사방 도련 (mm)</label><input id="bleed" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="safe-field"><label for="safe">재단선 안쪽 안전 여백 (mm)</label><input id="safe" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="dpi-field"><label for="dpi">해상도 (DPI)</label><input id="dpi" type="text" placeholder="예: 300" inputmode="decimal" autocomplete="off"></div></div><p class="hint">도련·안전 여백 직접 입력 · 출력소 규격 자동 적용 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>작업 크기=완성 크기+도련×2입니다. 안전영역은 완성 크기에서 안전 여백×2를 빼며 픽셀은 mm÷25.4×DPI를 올립니다.</p></details></main></div></body></html>
