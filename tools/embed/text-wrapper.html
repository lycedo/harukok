<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>텍스트 줄바꿈 도구 | 하루콕</title><meta name="description" content="긴 글을 정한 글자 수에 맞춰 줄바꿈하세요. 단어 우선 또는 글자 수 기준으로 감싸고 기존 줄 구분을 유지합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/text-wrapper.js?v=20261104-300" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 글과 한 줄의 최대 글자 수를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">원문</label><textarea id="source" rows="5" maxlength="100000" placeholder="긴 문장을 원하는 너비로 나누어 보세요." spellcheck="false"></textarea></div><div class="field"><label for="width">한 줄 글자 수</label><input id="width" type="text" maxlength="1000" placeholder="10" autocomplete="off"></div><div class="field"><label for="mode">줄바꿈 기준</label><select id="mode"><option value="words">단어 우선</option><option value="characters">글자 수대로</option></select></div><p class="hint">100,000자 · 줄 너비 1~200 코드 포인트</p><button class="primary" type="submit">줄바꿈하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>화면 픽셀 너비가 아닌 유니코드 코드 포인트 수입니다. 단어 모드는 가로 공백·탭을 한 칸으로 정리하며 너무 긴 단어도 나눕니다. 글자 모드는 공백을 유지합니다.</p></details>
</main></div></body></html>
