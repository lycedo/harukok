<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>저항 색띠 계산기 | 하루콕</title><meta name="description" content="4밴드·5밴드 저항의 색띠를 읽어 저항값과 허용오차를 구하세요. 금색·은색 배수와 최소·최대 저항 범위를 지원합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/resistor-color-code.js?v=20261108-1000" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 밴드 수와 색띠를 왼쪽부터 고르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="bands-field"><label for="bands">밴드 수</label><select id="bands"><option value="4" selected>4밴드</option><option value="5">5밴드</option></select></div><div class="field" id="first-field"><label for="first">첫째 숫자 띠</label><select id="first"><option value="brown">갈색(1)</option><option value="red">빨강(2)</option><option value="orange">주황(3)</option><option value="yellow" selected>노랑(4)</option><option value="green">초록(5)</option><option value="blue">파랑(6)</option><option value="violet">보라(7)</option><option value="gray">회색(8)</option><option value="white">흰색(9)</option></select></div><div class="field" id="second-field"><label for="second">둘째 숫자 띠</label><select id="second"><option value="black">검정(0)</option><option value="brown">갈색(1)</option><option value="red">빨강(2)</option><option value="orange">주황(3)</option><option value="yellow">노랑(4)</option><option value="green">초록(5)</option><option value="blue">파랑(6)</option><option value="violet" selected>보라(7)</option><option value="gray">회색(8)</option><option value="white">흰색(9)</option></select></div><div class="field" id="third-field"><label for="third">셋째 숫자 띠(5밴드)</label><select id="third"><option value="black" selected>검정(0)</option><option value="brown">갈색(1)</option><option value="red">빨강(2)</option><option value="orange">주황(3)</option><option value="yellow">노랑(4)</option><option value="green">초록(5)</option><option value="blue">파랑(6)</option><option value="violet">보라(7)</option><option value="gray">회색(8)</option><option value="white">흰색(9)</option></select></div><div class="field" id="multiplier-field"><label for="multiplier">배수 띠</label><select id="multiplier"><option value="black">검정(0)</option><option value="brown">갈색(1)</option><option value="red" selected>빨강(2)</option><option value="orange">주황(3)</option><option value="yellow">노랑(4)</option><option value="green">초록(5)</option><option value="blue">파랑(6)</option><option value="violet">보라(7)</option><option value="gray">회색(8)</option><option value="white">흰색(9)</option><option value="gold">금색(×0.1)</option><option value="silver">은색(×0.01)</option></select></div><div class="field" id="tolerance-field"><label for="tolerance">오차 띠</label><select id="tolerance"><option value="brown">갈색(±1%)</option><option value="red">빨강(±2%)</option><option value="green">초록(±0.5%)</option><option value="blue">파랑(±0.25%)</option><option value="violet">보라(±0.1%)</option><option value="gray">회색(±0.05%)</option><option value="gold" selected>금색(±5%)</option><option value="silver">은색(±10%)</option></select></div></div><p class="hint">일반 4·5밴드 저항 · 0Ω 점퍼·특수 군용 코드 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="4" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>4밴드는 숫자 2개, 배수, 오차로 읽고 5밴드는 숫자 3개, 배수, 오차로 읽습니다. 금색 배수는 0.1, 은색은 0.01입니다. 띠의 방향을 먼저 확인하세요. 온도계수 6번째 띠는 다루지 않습니다.</p><a href="https://www.vishay.com/docs/20143/colorcod.pdf" target="_blank" rel="noopener noreferrer">Vishay · 색띠 표</a></details>
</main></div></body></html>
