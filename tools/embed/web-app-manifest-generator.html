<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>웹 앱 manifest 만들기 | 하루콕</title><meta name="description" content="앱 이름·시작 주소·색상으로 설치용 Web App Manifest JSON을 만드세요. 앱 설치 조건은 별도로 갖춰야 합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/web-app-manifest-generator.js?v=20261105-500" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="name">앱 이름</label><input id="name" type="text" maxlength="1000" placeholder="하루콕" autocomplete="off"></div><div class="field"><label for="short">짧은 이름</label><input id="short" type="text" maxlength="1000" placeholder="하루콕" autocomplete="off"></div><div class="field"><label for="start">시작 경로</label><input id="start" type="text" maxlength="1000" placeholder="/" autocomplete="off"></div><div class="field"><label for="color">테마 색상 HEX</label><input id="color" type="text" maxlength="1000" placeholder="#16233D" autocomplete="off"></div><div class="field"><label for="background">배경 HEX</label><input id="background" type="text" maxlength="1000" placeholder="#F4F0E6" autocomplete="off"></div><div class="field"><label for="display">표시</label><select id="display"><option value="standalone">독립 앱</option><option value="minimal-ui">최소 메뉴</option><option value="browser">브라우저</option></select></div><div class="field"><label for="icon">PNG 아이콘 URL</label><input id="icon" type="text" maxlength="1000" placeholder="https://example.com/icon-512.png" autocomplete="off"></div><p class="hint">이 도구는 JSON을 만듭니다. HTTPS·아이콘·브라우저 설치 조건을 확인하세요.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>앱 이름·시작 주소·색상으로 설치용 Web App Manifest JSON을 만드세요. 앱 설치 조건은 별도로 갖춰야 합니다.</p><p><a href="https://www.w3.org/TR/appmanifest/" target="_blank" rel="noopener noreferrer">Web Application Manifest</a></p></details>
</main></div></body></html>
