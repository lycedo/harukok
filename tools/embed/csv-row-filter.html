<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>CSV 행 조건 필터 | 하루콕</title><meta name="description" content="열 값이 같거나 글자를 포함하는 행을 추출하세요. 숫자 크기 조건도 지원합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">CSV</label><textarea id="source" rows="5" maxlength="100000" placeholder="이름,점수

콕,80" spellcheck="false"></textarea></div><div class="field"><label for="column">조건 열</label><input id="column" type="text" maxlength="1000" placeholder="점수" autocomplete="off"></div><div class="field"><label for="mode">조건</label><select id="mode"><option value="eq">같음</option><option value="ne">다름</option><option value="contains">글자 포함</option><option value="gt">숫자보다 큼</option><option value="lt">숫자보다 작음</option></select></div><div class="field"><label for="value">비교 값</label><input id="value" type="text" maxlength="1000" placeholder="80" autocomplete="off"></div><p class="hint">첫 행은 열 이름. 최대 1,000행·50열·100,000자.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>
