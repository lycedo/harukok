<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>구분자 사이 글 추출 | 하루콕</title><meta name="description" content="글에서 두 구분자 사이의 내용을 추출하세요. 첫 구간 또는 모든 완성된 구간을 원래 순서대로 JSON 배열에 담습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/text-between-extractor.js?v=20261108-1000" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 원문과 시작·끝 구분자를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">원문</label><textarea id="source" rows="5" maxlength="100000" placeholder="&lt;name&gt;하루&lt;/name&gt; &lt;name&gt;콕&lt;/name&gt;" spellcheck="false"></textarea></div><div class="field"><label for="from">시작 구분자</label><input id="from" type="text" maxlength="1000" placeholder="&lt;name&gt;" autocomplete="off"></div><div class="field"><label for="to">끝 구분자</label><input id="to" type="text" maxlength="1000" placeholder="&lt;/name&gt;" autocomplete="off"></div><div class="field"><label for="mode">찾을 구간</label><select id="mode"><option value="all">모든 구간</option><option value="first">첫 구간만</option></select></div><p class="hint">100,000자 · 구분자 각 1,000자 · 문자 그대로 검색</p><button class="primary" type="submit">추출하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>정규식·중첩 구분자는 해석하지 않습니다. 닫는 구분자가 없는 마지막 구간은 제외합니다. 완성된 구간은 겹치지 않게 찾으며 빈 내용도 보존합니다.</p></details>
</main></div></body></html>
