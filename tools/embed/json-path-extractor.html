<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>JSON 경로 추출기 | 하루콕</title><meta name="description" content="JSON Pointer 경로로 객체의 값과 배열 항목을 추출하세요. 슬래시와 물결표가 들어간 키도 안전하게 찾습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/json-path-extractor.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> JSON과 찾을 경로를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">JSON</label><textarea id="source" rows="5" maxlength="100000" placeholder="{&quot;users&quot;:[{&quot;name&quot;:&quot;하루&quot;}]}" spellcheck="false"></textarea></div><div class="field"><label for="path">경로 (빈칸은 전체)</label><input id="path" type="text" placeholder="/users/0/name" autocomplete="off" maxlength="10000"></div><p class="hint">JSON 100,000자 · 경로는 /키/0 형식</p><button class="primary" type="submit">추출하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>JSON Pointer를 사용합니다. ~1은 /, ~0은 ~입니다. 점 표기·와일드카드는 지원하지 않습니다. 큰 정수는 문자열로 넣으세요.</p></details>
</main></div></body></html>
