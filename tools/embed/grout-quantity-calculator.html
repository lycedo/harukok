<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>줄눈재 소요량 계산기 | 하루콕</title><meta name="description" content="타일·줄눈 폭·충전 깊이·재료 밀도로 줄눈재 소요량을 계산하세요. 반복 격자의 줄눈 면적을 사용해 교차 부분을 중복 계산하지 않습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/grout-quantity-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="area-field"><label for="area">타일 시공 면적 (m²)</label><input id="area" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="width-field"><label for="width">타일 가로 (mm)</label><input id="width" type="text" placeholder="예: 300" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">타일 세로 (mm)</label><input id="height" type="text" placeholder="예: 300" inputmode="decimal" autocomplete="off"></div><div class="field" id="joint-field"><label for="joint">줄눈 폭 (mm)</label><input id="joint" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="depth-field"><label for="depth">채울 깊이 (mm)</label><input id="depth" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div><div class="field" id="density-field"><label for="density">줄눈재 밀도 (kg/L)</label><input id="density" type="text" placeholder="예: 1.6" inputmode="decimal" autocomplete="off"></div><div class="field" id="waste-field"><label for="waste">손실 여유 (%)</label><input id="waste" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">타일+줄눈 모듈 반복 · 수축·단차·가장자리 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>줄눈 면적 비율=1−타일면적÷(타일+줄눈 모듈면적)입니다. 면적(m²)×깊이(mm)는 리터이며 실제 제품 소요표와 다를 수 있습니다.</p></details></main></div></body></html>
