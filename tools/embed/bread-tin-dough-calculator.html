<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>식빵틀 반죽 투입량 계산기 | 하루콕</title><meta name="description" content="직육면체 틀의 부피와 직접 정한 충전율·반죽 밀도로 투입 반죽량을 구하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/bread-tin-dough-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="length-field"><label for="length">틀 안쪽 길이 (cm)</label><input id="length" type="text" placeholder="예: 20" inputmode="decimal" autocomplete="off"></div><div class="field" id="width-field"><label for="width">안쪽 폭 (cm)</label><input id="width" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">안쪽 높이 (cm)</label><input id="height" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="fill-field"><label for="fill">직접 정한 채움 비율 (%)</label><input id="fill" type="text" placeholder="예: 50" inputmode="decimal" autocomplete="off"></div><div class="field" id="density-field"><label for="density">투입 반죽 밀도 (g/mL)</label><input id="density" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div></div><p class="hint">직육면체·직접 정한 충전율과 밀도 · 발효 높이 예측 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>틀의 실제 곡면·경사와 발효·오븐 팽창은 반영하지 않습니다.</p></details></main></div></body></html>
