<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>음표 주파수 계산기 | 하루콕</title><meta name="description" content="음이름이나 MIDI 번호를 12평균율 주파수로 변환하세요. A4 기준 주파수를 직접 입력해 Hz·주기와 MIDI 번호를 확인할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/note-frequency-calculator.js?v=20261108-1000" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 음이름 또는 MIDI 번호와 A4 기준을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="mode-field"><label for="mode">입력 방식</label><select id="mode"><option value="note">음이름</option><option value="midi">MIDI 번호</option></select></div><div class="field" id="source-field"><label for="source">음이름 또는 MIDI 번호</label><input id="source" type="text" placeholder="예: A4, C#4, Db4 또는 69" inputmode="text" autocomplete="off"></div><div class="field" id="reference-field"><label for="reference">A4 기준 (Hz)</label><input id="reference" type="text" placeholder="예: 440" inputmode="decimal" autocomplete="off"></div></div><p class="hint">12평균율 · C4=MIDI 60 · #/b/♯/♭ 지원</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>주파수는 A4 기준×2^((MIDI−69)÷12)입니다. 옥타브 표기는 C4=MIDI 60으로 통일하며 다른 기기에서 같은 MIDI 번호의 옥타브 이름이 다를 수 있습니다.</p></details>
</main></div></body></html>
