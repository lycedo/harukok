<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>재료 부피·무게 환산기 | 하루콕</title><meta name="description" content="재료별 직접 정한 벌크 밀도로 부피와 질량을 환산하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/ingredient-volume-weight-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="mode-field"><label for="mode">변환 방향</label><select id="mode"><option value="volume">부피 → 질량</option><option value="mass">질량 → 부피</option></select></div><div class="field" id="amount-field"><label for="amount">부피(mL) 또는 질량(g)</label><input id="amount" type="text" placeholder="예: 240" inputmode="decimal" autocomplete="off"></div><div class="field" id="density-field"><label for="density">직접 확인한 밀도 (g/mL)</label><input id="density" type="text" placeholder="예: 0.5" inputmode="decimal" autocomplete="off"></div></div><p class="hint">재료 밀도 직접 입력 · 눌러 담기·습도 차이 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>컵의 부피와 재료 질량은 밀도가 있어야 환산할 수 있습니다. 재료별 고정 환산표를 적용하지 않습니다.</p></details></main></div></body></html>
