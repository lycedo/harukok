<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>문자 대응표 치환기 | 하루콕</title><meta name="description" content="원래 문자와 바꿀 문자를 같은 순서로 넣어 한 번에 치환하세요. 연쇄 치환 없이 처리합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/text-substitution-mapper.js?v=20261105-500" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">바꿀 글</label><textarea id="source" rows="5" maxlength="100000" placeholder="ABC CAB" spellcheck="false"></textarea></div><div class="field"><label for="from">원래 문자 목록</label><input id="from" type="text" maxlength="1000" placeholder="ABC" autocomplete="off"></div><div class="field"><label for="to">대응할 문자 목록</label><input id="to" type="text" maxlength="1000" placeholder="123" autocomplete="off"></div><p class="hint">최대 100,000자. 브라우저에서 처리합니다.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>원래 문자와 바꿀 문자를 같은 순서로 넣어 한 번에 치환하세요. 연쇄 치환 없이 처리합니다.</p></details>
</main></div></body></html>
