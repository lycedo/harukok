<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>CPC·CPM·CTR 계산기 | 하루콕</title><meta name="description" content="광고비·노출·클릭·전환 수로 CPC·CPM·CTR·전환율·CPA를 계산하세요. 분모가 0인 지표는 계산 불가로 따로 표시합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/ad-metrics-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="spend-field"><label for="spend">광고비 (원)</label><input id="spend" type="text" placeholder="예: 100000" inputmode="decimal" autocomplete="off"></div><div class="field" id="impressions-field"><label for="impressions">노출 수</label><input id="impressions" type="text" placeholder="예: 10000" inputmode="decimal" autocomplete="off"></div><div class="field" id="clicks-field"><label for="clicks">클릭 수</label><input id="clicks" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div><div class="field" id="conversions-field"><label for="conversions">전환 수</label><input id="conversions" type="text" placeholder="예: 25" inputmode="decimal" autocomplete="off"></div></div><p class="hint">같은 집계기간 · 클릭당 전환 0~1건 모형</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>CPC=비용÷클릭, CPM=비용÷노출×1000, CTR=클릭÷노출, 전환율=전환÷클릭, CPA=비용÷전환입니다.</p></details></main></div></body></html>
