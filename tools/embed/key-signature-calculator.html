<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>장조·단조 조표 찾기 | 하루콕</title><meta name="description" content="장조·단조 이름에서 조표의 샵·플랫 수와 붙는 음 순서를 찾으세요. 관계 장조 또는 관계 단조도 함께 표시합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/key-signature-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 항목을 고르고 실행 버튼을 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="key-field"><label for="key">조성</label><select id="key"><option value="major:Cb">Cb 장조</option><option value="major:Gb">Gb 장조</option><option value="major:Db">Db 장조</option><option value="major:Ab">Ab 장조</option><option value="major:Eb">Eb 장조</option><option value="major:Bb">Bb 장조</option><option value="major:F">F 장조</option><option value="major:C">C 장조</option><option value="major:G">G 장조</option><option value="major:D">D 장조</option><option value="major:A">A 장조</option><option value="major:E">E 장조</option><option value="major:B">B 장조</option><option value="major:F#">F# 장조</option><option value="major:C#">C# 장조</option><option value="minor:Ab">Ab 단조</option><option value="minor:Eb">Eb 단조</option><option value="minor:Bb">Bb 단조</option><option value="minor:F">F 단조</option><option value="minor:C">C 단조</option><option value="minor:G">G 단조</option><option value="minor:D">D 단조</option><option value="minor:A">A 단조</option><option value="minor:E">E 단조</option><option value="minor:B">B 단조</option><option value="minor:F#">F# 단조</option><option value="minor:C#">C# 단조</option><option value="minor:G#">G# 단조</option><option value="minor:D#">D# 단조</option><option value="minor:A#">A# 단조</option></select></div></div><p class="hint">전통적 0~7개 조표·자연단음계 기준 · 화성·가락단음계 임시표 별도</p><button class="primary" type="submit">조표 찾기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><detai
