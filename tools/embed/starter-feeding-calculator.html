<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>발효종 먹이 비율 계산기 | 하루콕</title><meta name="description" content="보유 발효종과 먹이 비율로 추가할 밀가루·물과 최종 수분율을 계산하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/starter-feeding-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="starter-field"><label for="starter">보유 발효종 (g)</label><input id="starter" type="text" placeholder="예: 20" inputmode="decimal" autocomplete="off"></div><div class="field" id="hydration-field"><label for="hydration">보유 발효종 수분율 (%)</label><input id="hydration" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="flourRatio-field"><label for="flourRatio">발효종 1g당 밀가루 비율</label><input id="flourRatio" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div><div class="field" id="waterRatio-field"><label for="waterRatio">발효종 1g당 물 비율</label><input id="waterRatio" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div></div><p class="hint">밀가루·물 질량만 · 발효 시간·안전 판단 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>수분율은 물÷밀가루×100입니다. 발효로 생기는 질량 변화는 제외합니다.</p></details></main></div></body></html>
