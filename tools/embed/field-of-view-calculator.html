<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>렌즈 화각 계산기 | 하루콕</title><meta name="description" content="센서 가로·세로와 렌즈 초점거리로 수평·수직·대각 화각을 계산하세요. 촬영 거리에서 화면에 들어오는 가로·세로 범위도 추정합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/field-of-view-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="width-field"><label for="width">센서 가로 (mm)</label><input id="width" type="text" placeholder="예: 36" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">센서 세로 (mm)</label><input id="height" type="text" placeholder="예: 24" inputmode="decimal" autocomplete="off"></div><div class="field" id="focal-field"><label for="focal">초점거리 (mm)</label><input id="focal" type="text" placeholder="예: 50" inputmode="decimal" autocomplete="off"></div><div class="field" id="distance-field"><label for="distance">피사체까지 거리 (m)</label><input id="distance" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">직선 투영 렌즈·원거리 근사 · 어안·왜곡·포커스 브리딩 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>화각=2atan(센서 치수÷2초점거리)입니다. 장면 크기는 촬영거리×센서치수÷초점거리의 원거리 근사이며 접사에서는 오차가 커집니다.</p><a href="https://www.edmundoptics.com/knowledge-center/application-notes/imaging/understanding-focal-length-and-field-of-view/" target="_blank" rel="noopener noreferrer">Edmund Optics 초점거리·화각</a></details></main></div></body></html>
