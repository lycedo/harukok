<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>용지 평량·총무게 계산기 | 하루콕</title><meta name="description" content="용지 크기·평량·장수로 종이의 예상 무게를 계산하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/paper-gsm-weight-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="width-field"><label for="width">용지 가로 (mm)</label><input id="width" type="text" placeholder="예: 210" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">용지 세로 (mm)</label><input id="height" type="text" placeholder="예: 297" inputmode="decimal" autocomplete="off"></div><div class="field" id="gsm-field"><label for="gsm">평량 (g/m²)</label><input id="gsm" type="text" placeholder="예: 80" inputmode="decimal" autocomplete="off"></div><div class="field" id="sheets-field"><label for="sheets">용지 장수</label><input id="sheets" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div></div><p class="hint">평량은 면적 1m²당 종이 무게 · 잉크·포장·습도 변화 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>한 장 무게=가로mm×세로mm÷1,000,000×평량입니다. 평량만으로 종이 두께를 추정하지 않습니다.</p><a href="https://committee.iso.org/standard/77583.html" target="_blank" rel="noopener noreferrer">ISO 536 평량</a></details></main></div></body></html>
