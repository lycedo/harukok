<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>원뿔대 부피·겉넓이 계산기 | 하루콕</title><meta name="description" content="원뿔대 부피·겉넓이 계산기로 위아래 반지름과 높이의 직각 원뿔대을 확인하세요. 입력값으로 바로 계산하며 결과를 복사할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/cone-frustum-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head><body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="field"><label for="r1">아래 반지름</label><input id="r1" type="text" inputmode="decimal" maxlength="150" placeholder="3" autocomplete="off"></div><div class="field"><label for="r2">위 반지름</label><input id="r2" type="text" inputmode="decimal" maxlength="150" placeholder="1" autocomplete="off"></div><div class="field"><label for="height">수직 높이</label><input id="height" type="text" inputmode="decimal" maxlength="150" placeholder="4" autocomplete="off"></div><p class="hint">반지름≥0 · 적어도 하나&gt;0 · 높이&gt;0 · 직각 원뿔대</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="7" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>V=πh(R²+Rr+r²)/3, 옆넓이=π(R+r)√[(R−r)²+h²]입니다. 전체 겉넓이는 양쪽 원면을 포함합니다.</p><a href="https://openstax.org/books/calculus-volume-3/pages/2-5-equations-of-lines-and-planes-in-space" target="_blank" rel="noopener noreferrer">OpenStax · 좌표 기하</a></details></main></div></body></html>
