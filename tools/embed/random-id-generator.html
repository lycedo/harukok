<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>랜덤 ID 생성기 | 하루콕</title><meta name="description" content="원하는 문자 집합과 길이로 랜덤 ID를 만드세요. URL 안전 문자·16진수·직접 고른 문자를 안전한 난수로 조합합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/random-id-generator.js?v=20261104-300" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 문자 집합과 ID 길이를 고르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="alphabet">문자 집합</label><select id="alphabet"><option value="url">URL 안전 문자</option><option value="hex">16진수 소문자</option><option value="custom">직접 입력</option></select></div><div class="field"><label for="custom">직접 쓸 문자 (직접 입력일 때)</label><input id="custom" type="text" maxlength="1000" placeholder="ABCD0123" autocomplete="off"></div><div class="field"><label for="length">ID 길이</label><input id="length" type="text" maxlength="1000" placeholder="12" autocomplete="off"></div><div class="field"><label for="count">만들 개수</label><input id="count" type="text" maxlength="1000" placeholder="3" autocomplete="off"></div><p class="hint">길이 1~256 · 1~100개 · 직접 문자 2~128종</p><button class="primary" type="submit">만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>문자를 고르게 뽑도록 편향된 난숫값을 버립니다. ID는 이 화면 안에서만 중복을 피하며 서비스 전체의 고유성이나 비밀번호 안전성을 보장하지 않습니다.</p></details>
</main></div></body></html>
