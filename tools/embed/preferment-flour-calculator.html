<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>발효종 포함 밀가루 배분 계산기 | 하루콕</title><meta name="description" content="총 밀가루 중 발효종에 포함할 비율과 수분율로 본반죽 밀가루·물을 나누세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/preferment-flour-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="flour-field"><label for="flour">전체 밀가루 (g)</label><input id="flour" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div><div class="field" id="preferment-field"><label for="preferment">발효종에 넣을 밀가루 비율 (%)</label><input id="preferment" type="text" placeholder="예: 20" inputmode="decimal" autocomplete="off"></div><div class="field" id="starterHydration-field"><label for="starterHydration">발효종 수분율 (%)</label><input id="starterHydration" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="hydration-field"><label for="hydration">전체 반죽 수분율 (%)</label><input id="hydration" type="text" placeholder="예: 70" inputmode="decimal" autocomplete="off"></div></div><p class="hint">발효종 비율은 총 밀가루 중 밀가루 비중</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>소금·기타 재료와 발효에 따른 질량 변화는 제외합니다.</p></details></main></div></body></html>
