<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>ND 필터 노출시간 계산기 | 하루콕</title><meta name="description" content="기존 셔터시간과 ND 필터의 스톱·배수·광학농도로 새 노출시간을 계산하세요. 필터 표기 사이의 환산값도 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/nd-filter-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="shutter-field"><label for="shutter">기존 노출시간 (초 또는 분수)</label><input id="shutter" type="text" placeholder="1/125" inputmode="text" autocomplete="off"></div><div class="field" id="mode-field"><label for="mode">필터 표기</label><select id="mode"><option value="stops">스톱 수</option><option value="factor">ND 배수 (ND64라면 64)</option><option value="density">광학농도 (ND1.8이라면 1.8)</option></select></div><div class="field" id="strength-field"><label for="strength">필터 강도</label><input id="strength" type="text" placeholder="예: 6" inputmode="decimal" autocomplete="off"></div></div><p class="hint">ISO·조리개 유지 · 장노출 감도 변화·필터 색편이 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>스톱 1단계마다 노출시간이 2배입니다. ND 배수=2^스톱=10^광학농도이며 필터 제품의 실제 투과율과 차이가 날 수 있습니다.</p><a href="https://files.canon-europe.com/files/soft28121/manual/PS_G7_ADVCUG_EN.pdf" target="_blank" rel="noopener noreferrer">Canon ND 필터 3스톱=광량 1/8</a></details></main></div></body></html>
