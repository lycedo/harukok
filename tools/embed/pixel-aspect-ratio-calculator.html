<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>픽셀 종횡비 SAR·DAR 계산기 | 하루콕</title><meta name="description" content="저장 영상의 가로·세로 픽셀과 샘플 종횡비 SAR로 표시 종횡비 DAR을 계산하세요. 정사각형 픽셀로 보일 때의 환산 가로 크기도 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/pixel-aspect-ratio-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 저장 크기와 SAR 분자·분모를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="width-field"><label for="width">저장 가로 (px)</label><input id="width" type="text" placeholder="예: 720" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">저장 세로 (px)</label><input id="height" type="text" placeholder="예: 576" inputmode="decimal" autocomplete="off"></div><div class="field" id="sarN-field"><label for="sarN">SAR 가로 비율 (분자)</label><input id="sarN" type="text" placeholder="예: 16" inputmode="decimal" autocomplete="off"></div><div class="field" id="sarD-field"><label for="sarD">SAR 세로 비율 (분모)</label><input id="sarD" type="text" placeholder="예: 15" inputmode="decimal" autocomplete="off"></div></div><p class="hint">DAR=(저장 가로÷세로)×SAR · 크롭·영상 변환 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>가로 크기에 SAR 분자÷분모를 곱해 실제 표시 비율을 구합니다. 정사각 픽셀 환산 가로가 소수일 수 있으며 코덱별 패딩·클린 어퍼처는 적용하지 않습니다.</p></details></main></div></body></html>
