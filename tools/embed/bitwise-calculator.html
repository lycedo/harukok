<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>비트 연산 계산기 | 하루콕</title><meta name="description" content="8·16·32·64비트 정수의 AND·OR·XOR·NOT와 논리 이동을 계산하세요. 10진수·16진수·2진수 결과를 표시합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/bitwise-calculator.js?v=20261104-300" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 비트 폭과 연산을 고르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="width">비트 폭</label><select id="width"><option value="8">8비트</option><option value="16">16비트</option><option value="32">32비트</option><option value="64">64비트</option></select></div><div class="field"><label for="mode">연산</label><select id="mode"><option value="and">AND</option><option value="or">OR</option><option value="xor">XOR</option><option value="not">NOT</option><option value="left">왼쪽 이동</option><option value="right">오른쪽 논리 이동</option></select></div><div class="field"><label for="a">A (부호 없는 값)</label><input id="a" type="text" maxlength="1000" placeholder="255" autocomplete="off"></div><div class="field"><label for="b">B 또는 이동 칸수 (NOT는 미사용)</label><input id="b" type="text" maxlength="1000" placeholder="15" autocomplete="off"></div><p class="hint">0~2^폭−1 · 이동 0~폭 · 넘친 비트 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>BigInt로 비트 폭을 제한해 계산합니다. 오른쪽 이동은 0으로 채우는 논리 이동이며 부호 있는 산술 이동은 아닙니다.</p></details>
</main></div></body></html>
