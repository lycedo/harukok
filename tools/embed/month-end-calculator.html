<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>월말·개월 계산기 | 하루콕</title><meta name="description" content="개월을 더하거나 빼고 해당 날짜를 계산하세요. 월말 유지 규칙을 선택하거나 여러 달의 마지막 날짜 목록을 만들 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/month-end-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 기준일·개월 차이와 계산 방식을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="base-field"><label for="base">기준일</label><input id="base" type="date" placeholder="예: 2026-01-31" min="1900-01-01" max="2100-12-31"></div><div class="field" id="offset-field"><label for="offset">개월 차이 (-1200~1200)</label><input id="offset" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field" id="mode-field"><label for="mode">계산 방식</label><select id="mode"><option value="add">개월 가감 날짜</option><option value="list">월말 날짜 목록</option></select></div><div class="field" id="rule-field"><label for="rule">개월 가감 규칙</label><select id="rule"><option value="clamp">같은 일자, 없으면 말일</option><option value="end">기준일이 말일이면 말일 유지</option></select></div><div class="field" id="count-field"><label for="count">월말 목록 개수 (목록일 때)</label><input id="count" type="text" placeholder="예: 12" inputmode="decimal" autocomplete="off"></div></div><p class="hint">존재하지 않는 일자는 해당 월 말일 · 목록은 시작 월부터</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>같은 일자 규칙은 기준일의 일을 목표 월에 적용하고 초과하면 말일로 줄입니다. 말일 유지 규칙은 기준일 자체가 말일인 경우에만 목표 월 말일을 사용합니다.</p></details></main></div></body></html>
