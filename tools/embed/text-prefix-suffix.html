<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>줄 앞뒤 글자 붙이기 | 하루콕</title><meta name="description" content="여러 줄의 앞과 뒤에 같은 글자를 한 번에 붙이세요. 따옴표·괄호·접두사·접미사로 목록을 정리할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/text-prefix-suffix.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 원문과 앞뒤에 붙일 글자를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">원문</label><textarea id="source" rows="5" maxlength="100000" placeholder="사과
배
귤" spellcheck="false"></textarea></div><div class="field"><label for="prefix">앞에 붙일 글자</label><input id="prefix" type="text" placeholder="&quot;" autocomplete="off" maxlength="10000"></div><div class="field"><label for="suffix">뒤에 붙일 글자</label><input id="suffix" type="text" placeholder="&quot;," autocomplete="off" maxlength="10000"></div><div class="field"><label for="empty">빈 줄 처리</label><select id="empty"><option value="keep">빈 줄에도 붙이기</option><option value="skip">빈 줄은 그대로</option></select></div><p class="hint">원문 100,000자·10,000줄 · 앞뒤 각 1,000자</p><button class="primary" type="submit">붙이기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>각 줄의 공백과 줄 순서를 유지합니다. 윈도 줄바꿈은 LF로 바꾸며 마지막 줄바꿈 하나는 보존합니다.</p></details>
</main></div></body></html>
