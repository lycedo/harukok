<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>실 교체 볼 수 계산기 | 하루콕</title><meta name="description" content="도안의 원래 실 길이를 다른 실의 한 볼 길이로 바꿔 필요한 볼 수를 구하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/yarn-substitution-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="oldBalls-field"><label for="oldBalls">도안 원래 볼 수</label><input id="oldBalls" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div><div class="field" id="oldLength-field"><label for="oldLength">원래 한 볼 길이 (m)</label><input id="oldLength" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="newLength-field"><label for="newLength">대체 한 볼 길이 (m)</label><input id="newLength" type="text" placeholder="예: 120" inputmode="decimal" autocomplete="off"></div><div class="field" id="extra-field"><label for="extra">추가 여유율 (%)</label><input id="extra" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">도안 총길이 기준 · 굵기·게이지·섬유 차이는 별도 확인</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>스와치 면적으로 실을 추정하는 도구가 아닌 이미 정해진 도안 길이의 실 교체 계산입니다.</p></details></main></div></body></html>
