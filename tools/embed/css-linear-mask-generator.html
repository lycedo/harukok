<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="axis">방향</label><select id="axis"><option value="bottom">위→아래</option><option value="right">왼쪽→오른쪽</option></select></div><div class="field"><label for="start">불투명 시작(%)</label><input id="start" type="text" maxlength="1000" placeholder="10" autocomplete="off"></div><div class="field"><label for="end">불투명 끝(%)</label><input id="end" type="text" maxlength="1000" placeholder="90" autocomplete="off"></div><p class="hint">브라우저에서 처리합니다. 서버 전송 없음.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>
