<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>사진 노출값 EV 계산기 | 하루콕</title><meta name="description" content="조리개·셔터시간·ISO로 카메라 설정의 노출값 EV와 ISO 100 환산 EV를 계산하세요. 셔터시간은 1/125 같은 분수로 입력할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/exposure-value-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="aperture-field"><label for="aperture">조리개 F값</label><input id="aperture" type="text" placeholder="예: 8" inputmode="decimal" autocomplete="off"></div><div class="field" id="shutter-field"><label for="shutter">셔터시간 (초 또는 분수)</label><input id="shutter" type="text" placeholder="1/125" inputmode="text" autocomplete="off"></div><div class="field" id="iso-field"><label for="iso">ISO 감도</label><input id="iso" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div></div><p class="hint">EV=log₂(F²/초) · 측광값·장면 밝기 자동 측정 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>EV100=설정 EV−log₂(ISO÷100)입니다. 센서별 실제 감도와 렌즈 투과율·필터·상반칙 불궤는 반영하지 않습니다.</p></details></main></div></body></html>
