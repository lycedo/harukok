<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>흙·자갈 소요량 계산기 | 하루콕</title><meta name="description" content="면적·덮을 깊이·벌크 밀도로 흙이나 자갈 소요 부피와 무게를 계산하세요. 포대 무게와 손실 여유를 넣어 필요한 포대 수를 구합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/soil-gravel-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="area-field"><label for="area">덮을 면적 (m²)</label><input id="area" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="depth-field"><label for="depth">깊이 (cm)</label><input id="depth" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div><div class="field" id="density-field"><label for="density">벌크 밀도 (kg/m³)</label><input id="density" type="text" placeholder="예: 1500" inputmode="decimal" autocomplete="off"></div><div class="field" id="bag-field"><label for="bag">1포 무게 (kg)</label><input id="bag" type="text" placeholder="예: 20" inputmode="decimal" autocomplete="off"></div><div class="field" id="waste-field"><label for="waste">손실 여유 (%)</label><input id="waste" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">재료 밀도 직접 입력 · 다짐·수분 변화 자동 반영 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>면적×깊이로 부피를 구하고 벌크 밀도를 곱합니다. 포대 수는 입력 소수로 정확히 올립니다. 재료 성적서의 실제 밀도를 쓰세요.</p></details></main></div></body></html>
