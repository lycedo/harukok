<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>기간 안 요일 날짜 찾기 | 하루콕</title><meta name="description" content="기간 안의 여러 요일 날짜를 제외일과 함께 골라 목록으로 만드세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/weekday-occurrences-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="start-field"><label for="start">기간 시작</label><input id="start" type="date" placeholder="2026-01-01" min="1900-01-01" max="2100-12-31"></div><div class="field" id="end-field"><label for="end">기간 끝</label><input id="end" type="date" placeholder="2026-01-10" min="1900-01-01" max="2100-12-31"></div><div class="field" id="weekdays-field"><label for="weekdays">요일 · 월=1~일=7</label><input id="weekdays" type="text" placeholder="1,3,5" inputmode="text" autocomplete="off"></div><div class="field" id="excluded-field"><label for="excluded">제외 날짜 · 없으면 비우기</label><textarea id="excluded" rows="6" maxlength="100000" placeholder="2026-01-02" spellcheck="false"></textarea></div></div><p class="hint">양 끝 포함 · 요일 복수 선택 · 제외일 직접 입력</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>법정 공휴일을 자동 조회하지 않습니다. 같은 날짜가 중복 생성되지 않습니다.</p></details></main></div></body></html>
