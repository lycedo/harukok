<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>피자 크기별 반죽 분할 계산기 | 하루콕</title><meta name="description" content="피자 지름·개수와 직접 정한 면적당 반죽 질량으로 반죽 볼을 나누세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/pizza-dough-ball-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="diameter-field"><label for="diameter">피자 지름 (cm)</label><input id="diameter" type="text" placeholder="예: 30" inputmode="decimal" autocomplete="off"></div><div class="field" id="density-field"><label for="density">반죽 면적당 질량 (g/cm²)</label><input id="density" type="text" placeholder="예: 0.3" inputmode="decimal" autocomplete="off"></div><div class="field" id="count-field"><label for="count">피자 수</label><input id="count" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="waste-field"><label for="waste">전체 여유율 (%)</label><input id="waste" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div></div><p class="hint">원형 피자 · 면적당 반죽량 직접 선택</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>원하는 두께의 반죽량은 사용자가 정합니다. 발효 팽창과 굽기 손실은 포함하지 않습니다.</p></details></main></div></body></html>
