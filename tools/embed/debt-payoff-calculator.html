<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>고정금액 상환기간 계산기 | 하루콕</title><meta name="description" content="대출잔액·고정금리·매달 갚을 금액으로 완제까지 필요한 개월 수와 마지막 납입액을 계산하세요. 매달 이자를 먼저 붙인 뒤 납부하는 모형입니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/debt-payoff-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="principal-field"><label for="principal">현재 원금 (원)</label><input id="principal" type="text" placeholder="예: 1000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="annual-field"><label for="annual">연이율 (%)</label><input id="annual" type="text" placeholder="예: 6" inputmode="decimal" autocomplete="off"></div><div class="field" id="payment-field"><label for="payment">매달 갚을 금액 (원)</label><input id="payment" type="text" placeholder="예: 100000" inputmode="decimal" autocomplete="off"></div></div><p class="hint">매월 말 납부 · 이율 소수 12자리까지 · 중간 반올림 없음 · 최대 1,200개월</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>매월 잔액에 월 이율을 곱해 이자를 붙입니다. 월 납입액이 첫 달 이자를 넘지 않으면 잔액이 줄지 않습니다. 수수료·추가 차입은 제외합니다.</p></details></main></div></body></html>
