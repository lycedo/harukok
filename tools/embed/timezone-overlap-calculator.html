<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>도시별 근무시간 겹침 계산기 | 하루콕</title><meta name="description" content="두 도시의 현지 날짜·근무 시각을 UTC로 바꿔 겹치는 시간을 계산하세요. 브라우저 시간대 규칙의 일광절약시간을 반영하고 중복·존재하지 않는 시각은 알려줍니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/timezone-overlap-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 각 도시의 현지 날짜와 시작·종료 시각을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="dateA-field"><label for="dateA">A 현지 날짜</label><input id="dateA" type="date" placeholder="예: 2026-11-04" min="1900-01-01" max="2100-12-31"></div><div class="field" id="zoneA-field"><label for="zoneA">A 도시</label><select id="zoneA"><option value="Asia/Seoul">서울</option><option value="Asia/Tokyo">도쿄</option><option value="Asia/Shanghai">상하이</option><option value="Asia/Singapore">싱가포르</option><option value="Asia/Kolkata">콜카타</option><option value="Asia/Dubai">두바이</option><option value="Europe/London">런던</option><option value="Europe/Paris">파리</option><option value="America/New_York">뉴욕</option><option value="America/Los_Angeles">로스앤젤레스</option><option value="Pacific/Honolulu">호놀룰루</option><option value="Australia/Sydney">시드니</option><option value="UTC">UTC</option></select></div><div class="field" id="startA-field"><label for="startA">A 시작</label><input id="startA" type="time" placeholder="예: 09:00" inputmode="text" autocomplete="off"></div><div class="field" id="endA-field"><label for="endA">A 종료</label><input id="endA" type="time" placeholder="예: 18:00" inputmode="text" autocomplete="off"></div><div class="field" id="dateB-field"><label for="dateB">B 현지 날짜</label><input id="dateB" type="date" placeholder="예: 2026-11-04" min="1900-01-01" max="2100-12-31"></div><div class="field" id="zoneB-field"><label for="zoneB">B 도시</label><select id="zoneB"><option value="Asia/Seoul">서울</option><option value="Asia/Tokyo">도쿄</option><option value="Asia/Shanghai">상하이</option><option value="Asia/Singapore">싱가포르</option><option value="Asia/Kolkata">콜카타</option><option value="Asia/Dubai">두바이</option><option value="Europe/London">런던</option><option value="Europe/Paris">파리</option><option value="America/New_York">뉴욕</option><option value="America/Los_Angeles">로스앤젤레스</option><option value="Pacific/Honolulu">호놀룰루</option><option value="Australia/Sydney">시드니</option><option value="UTC">UTC</option></select></div><div class="field" id="startB-field"><label for="startB">B 시작</label><input id="startB" type="time" placeholder="예: 00:00" inputmode="text" autocomplete="off"></div><div class="field" id="endB-field"><label for="endB">B 종료</label><input id="endB" type="time" placeholder="예: 09:00" inputmode="text" autocomplete="off"></div></div><p class="hint">현지 날짜 각각 지정 · 2000~2100년 · 중복·없는 시각 거부</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>종료 시각이 시작보다 이르면 현지 다음 날로 봅니다. 브라우저 Intl 시간대 규칙을 사용하며 일광절약시간의 사라지거나 두 번 생기는 시각은 임의로 선택하지 않습니다. 시간대 규칙은 브라우저 업데이트 상태에 따라 다를 수 있습니다.</p><a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/DateTimeFormat" target="_blank" rel="noopener noreferrer">MDN · 시간대 날짜 표시</a></details></main></div></body></html>
