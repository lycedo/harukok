<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>월 주기 날짜 일정 만들기 | 하루콕</title><meta name="description" content="정한 월 간격과 여러 날짜 번호로 반복 일정을 만들고 제외일을 빼세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/recurring-date-scheduler.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="start-field"><label for="start">첫 기준월 날짜</label><input id="start" type="date" placeholder="2026-01-01" min="1900-01-01" max="2100-12-31"></div><div class="field" id="every-field"><label for="every">반복 월 간격</label><input id="every" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field" id="count-field"><label for="count">발생 기준월 수</label><input id="count" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="days-field"><label for="days">매달 날짜 번호 · 1~31</label><input id="days" type="text" placeholder="15,31" inputmode="text" autocomplete="off"></div><div class="field" id="excluded-field"><label for="excluded">제외 날짜 · 없으면 비우기</label><textarea id="excluded" rows="6" maxlength="100000" placeholder="2026-02-15" spellcheck="false"></textarea></div></div><p class="hint">없는 29~31일은 월말로 조정 · 겹친 월말은 1회</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>첫 기준일 이전 날짜와 직접 지정한 제외일을 뺍니다. 월말 조정된 날짜가 다음 달 기준을 바꾸지 않습니다.</p></details></main></div></body></html>
