<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>다운로드 시간 계산기 | 하루콕</title><meta name="description" content="파일 크기와 회선 속도로 다운로드에 필요한 이론 시간을 계산하세요. MB·GB·GiB와 Mbps·Gbps·MiB/s를 구분해 환산합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/download-time-calculator.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 파일 크기와 전송 속도를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="size">파일 크기</label><input id="size" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field"><label for="sizeUnit">파일 크기 단위</label><select id="sizeUnit"><option value="MB">MB (100만 바이트)</option><option value="GB">GB (10억 바이트)</option><option value="GiB">GiB (2³⁰ 바이트)</option></select></div><div class="field"><label for="rate">전송 속도</label><input id="rate" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field"><label for="rateUnit">속도 단위</label><select id="rateUnit"><option value="Mbps">Mbps</option><option value="Gbps">Gbps</option><option value="MiBs">MiB/s</option></select></div></div><p class="hint">이론값 · 통신 손실·서버 대기·속도 변화 제외</p><button id="start" class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>1바이트는 8비트입니다. Mbps는 초당 100만 비트이며 MB/s와 다릅니다. 화면 시간은 필요한 초를 올림합니다.</p></details>
</main></div></body></html>
