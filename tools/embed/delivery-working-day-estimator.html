<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>주문 마감·배송일 계산기 | 하루콕</title><meta name="description" content="주문 마감시각·준비 영업일·운송 영업일로 가정 배송 날짜를 구하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/delivery-working-day-estimator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="date-field"><label for="date">주문 날짜</label><input id="date" type="date" placeholder="2026-01-09" min="1900-01-01" max="2100-12-31"></div><div class="field" id="time-field"><label for="time">주문 시각</label><input id="time" type="time" placeholder="16:00" inputmode="text" autocomplete="off"></div><div class="field" id="cutoff-field"><label for="cutoff">당일 접수 마감시각</label><input id="cutoff" type="time" placeholder="14:00" inputmode="text" autocomplete="off"></div><div class="field" id="preparation-field"><label for="preparation">접수 후 준비 영업일</label><input id="preparation" type="text" placeholder="예: 0" inputmode="decimal" autocomplete="off"></div><div class="field" id="transit-field"><label for="transit">발송 후 운송 영업일</label><input id="transit" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field" id="excluded-field"><label for="excluded">추가 휴무일 · 없으면 비우기</label><textarea id="excluded" rows="6" maxlength="100000" placeholder="2026-01-01" spellcheck="false"></textarea></div></div><p class="hint">월~금·마감시각 당일 포함 · 휴무 직접 입력 · 실제 배송 보장 아님</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>판매자·운송사 공지 일정을 직접 설정하세요. 실시간 택배 추적은 하지 않습니다.</p></details></main></div></body></html>
