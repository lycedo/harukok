<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>잔디 롤 수량 계산기 | 하루콕</title><meta name="description" content="시공 면적·잔디 롤 크기·절단 손실률로 잔디 롤 수와 구매 면적을 계산하세요. 실제 배치 대신 면적 기준 구매량을 추정합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/turf-roll-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="area-field"><label for="area">시공 면적 (m²)</label><input id="area" type="text" placeholder="예: 25" inputmode="decimal" autocomplete="off"></div><div class="field" id="width-field"><label for="width">롤 너비 (m)</label><input id="width" type="text" placeholder="예: 0.5" inputmode="decimal" autocomplete="off"></div><div class="field" id="length-field"><label for="length">롤 길이 (m)</label><input id="length" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div><div class="field" id="waste-field"><label for="waste">절단 여유 (%)</label><input id="waste" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">면적 기준 · 무늬 방향·이음새·불규칙 경계 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>시공면적×(1+여유율)을 한 롤 면적으로 나눠 올립니다. 실제 절단 배치와 재사용 가능 조각은 계산하지 않습니다.</p></details></main></div></body></html>
