<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>방 벽면적 계산기 | 하루콕</title><meta name="description" content="직사각형 방의 길이·너비·높이로 네 벽의 면적을 계산하세요. 문·창문 크기와 개수를 입력해 제외한 벽면적을 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/wall-area-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 방 크기와 제외할 문·창문을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="length-field"><label for="length">방 길이 (m)</label><input id="length" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="width-field"><label for="width">방 너비 (m)</label><input id="width" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">벽 높이 (m)</label><input id="height" type="text" placeholder="예: 2.4" inputmode="decimal" autocomplete="off"></div><div class="field" id="openings-field"><label for="openings">문·창문 가로,높이,개수 (선택)</label><textarea id="openings" rows="6" maxlength="100000" placeholder="0.9,2,1
1.5,1.2,2" spellcheck="false"></textarea></div></div><p class="hint">직사각형 방의 네 벽 · 바닥·천장 제외 · 개구부 중복 입력 주의</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>네 벽 면적=2×(길이+너비)×높이입니다. 문·창문 면적을 개수만큼 빼며 페인트 도장 횟수·도포율·타일 개수는 계산하지 않습니다.</p></details></main></div></body></html>
