<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>배당금·배당수익률 계산기 | 하루콕</title><meta name="description" content="주식 수·회당 주당 배당금·연간 횟수로 가정 배당금을 계산하세요. 직접 입력한 공제율과 취득 단가로 순배당금과 단순 배당수익률을 추정합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/dividend-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 수량·회당 배당금·횟수·공제율·단가를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="shares-field"><label for="shares">보유 수량 (주, 정수)</label><input id="shares" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="dividend-field"><label for="dividend">회당 주당 배당금 (원)</label><input id="dividend" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div><div class="field" id="payments-field"><label for="payments">연간 지급 횟수</label><input id="payments" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="deduction-field"><label for="deduction">가정 공제율 (%)</label><input id="deduction" type="text" placeholder="예: 0" inputmode="decimal" autocomplete="off"></div><div class="field" id="price-field"><label for="price">주당 취득 단가 (원)</label><input id="price" type="text" placeholder="예: 20000" inputmode="decimal" autocomplete="off"></div></div><p class="hint">배당·공제율 사용자 가정 · 실제 배당·세율 조회 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>입력값을 일정하게 둔 수학적 추정입니다. 실제 상품의 세금·수수료·일수 계산과 다를 수 있습니다. 원 단위 반올림은 표시에만 적용합니다. 총배당=수량×회당 배당금×횟수입니다. 배당수익률은 주당 연간 총배당÷취득 단가이며 주가 변동이나 재투자는 반영하지 않습니다.</p></details></main></div></body></html>
