<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>JSON Schema 만들기 | 하루콕</title><meta name="description" content="JSON 예시에서 2020-12 JSON Schema 초안을 추정하세요. 중첩 객체·배열·여러 자료형을 분석하고 필수 키 여부를 고릅니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/json-schema-generator.js?v=20261108-1000" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> JSON 예시를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">JSON 예시</label><textarea id="source" rows="5" maxlength="100000" placeholder="{&quot;id&quot;:1,&quot;name&quot;:&quot;하루&quot;,&quot;tags&quot;:[&quot;도구&quot;]}" spellcheck="false"></textarea></div><div class="field"><label for="required">보이는 객체 키</label><select id="required"><option value="all">필수 키로 표시</option><option value="none">필수 여부 정하지 않기</option></select></div><p class="hint">2020-12 초안 추정 · 실제 전체 데이터 보장 아님</p><button class="primary" type="submit">만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>샘플의 자료형만 추정합니다. 문자열 형식·값 범위·허용하지 않을 추가 키는 정하지 않습니다. 빈 배열의 항목은 제한하지 않고, 서로 다른 배열 항목은 anyOf로 합칩니다. 중복 JSON 키는 중단합니다.</p><p><a href="https://json-schema.org/draft/2020-12/schema" target="_blank" rel="noopener noreferrer">JSON Schema 2020-12</a></p></details>
</main></div></body></html>
