<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>엇갈림 무늬 벽지 재단 계산기 | 하루콕</title><meta name="description" content="엇갈림 무늬를 맞춘 벽지 A·B 재단 길이와 두 폭 한 쌍 기준 롤 소요량을 구하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/wallpaper-half-drop-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="height-field"><label for="height">벽 높이+총 여유 (cm)</label><input id="height" type="text" placeholder="예: 250" inputmode="decimal" autocomplete="off"></div><div class="field" id="repeat-field"><label for="repeat">세로 무늬 반복 (cm)</label><input id="repeat" type="text" placeholder="예: 60" inputmode="decimal" autocomplete="off"></div><div class="field" id="roll-field"><label for="roll">롤 길이 (cm)</label><input id="roll" type="text" placeholder="예: 1000" inputmode="decimal" autocomplete="off"></div><div class="field" id="drops-field"><label for="drops">필요 세로 폭 수</label><input id="drops" type="text" placeholder="예: 6" inputmode="decimal" autocomplete="off"></div></div><p class="hint">B 폭은 A보다 반 반복 더 재단 · 완성 A·B 쌍 기준 보수적 수량</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>엇갈림 제품의 시작 무늬·롤간 재사용·대칭 무늬별 실제 절단 계획은 다를 수 있습니다.</p></details></main></div></body></html>
