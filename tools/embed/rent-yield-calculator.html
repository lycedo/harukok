<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>임대수익률 계산기 | 하루콕</title><meta name="description" content="매입가·보증금·월세·공실·비용·대출이자로 임대수익률을 계산하세요. 총매입원가 기준과 투입 자기자본 기준 수익률을 함께 비교합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/rent-yield-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="price-field"><label for="price">매입가 (원)</label><input id="price" type="text" placeholder="예: 200000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="acquisition-field"><label for="acquisition">취득 추가비용 (원)</label><input id="acquisition" type="text" placeholder="예: 10000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="deposit-field"><label for="deposit">반환할 임대보증금 (원)</label><input id="deposit" type="text" placeholder="예: 20000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="loan-field"><label for="loan">대출원금 (원)</label><input id="loan" type="text" placeholder="예: 100000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="annual-field"><label for="annual">대출 연이율 (%)</label><input id="annual" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="rent-field"><label for="rent">월세 (원)</label><input id="rent" type="text" placeholder="예: 1000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="vacancy-field"><label for="vacancy">연간 공실 개월</label><input id="vacancy" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field" id="expenses-field"><label for="expenses">연간 운영비 (원)</label><input id="expenses" type="text" placeholder="예: 1000000" inputmode="decimal" autocomplete="off"></div></div><p class="hint">보증금은 반환 채무 · 세금·매각차익·대출 원금상환 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>순영업수익=공실 반영 월세−운영비입니다. 자기자본=매입가+추가비용−보증금−대출이며 현금흐름은 순영업수익에서 이자만 뺍니다.</p></details></main></div></body></html>
