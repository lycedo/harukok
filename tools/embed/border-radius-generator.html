<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="top-left">왼쪽 위 (px)</label><input id="top-left" type="number" placeholder="예: 24" step="any" inputmode="decimal" min="0" max="500"></div><div class="field"><label for="top-right">오른쪽 위 (px)</label><input id="top-right" type="number" placeholder="예: 8" step="any" inputmode="decimal" min="0" max="500"></div><div class="field"><label for="bottom-right">오른쪽 아래 (px)</label><input id="bottom-right" type="number" placeholder="예: 24" step="any" inputmode="decimal" min="0" max="500"></div><div class="field"><label for="bottom-left">왼쪽 아래 (px)</label><input id="bottom-left" type="number" placeholder="예: 8" step="any" inputmode="decimal" min="0" max="500"></div></div><button class="primary" type="submit">CSS 만들기</button><p class="error" id="error" role="alert"></p></form><section class="result" id="result" hidden aria-live="polite"><h2>결과</h2><div class="result-value" id="result-value"></div><div class="sheet" id="radius-preview">모서리 미리보기</div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button class="secondary" id="copy" type="button">결과 복사하기</button><p class="hint" id="copy-status" role="status"></p></section></section>

<details class="tool-notes"><summary>도움말</summary><p>0~500px을 입력하세요. CSS 순서는 왼쪽 위부터 시계 방향입니다. 반지름 합이 요소보다 크면 브라우저가 비율에 맞춰 줄입니다.</p><p>파일·입력값은 브라우저 안에서 처리하며 서버로 전송하거나 저장하지 않습니다.</p></details></main></div></body></html>
