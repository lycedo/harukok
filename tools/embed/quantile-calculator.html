<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>백분위수·사분위수 계산기 | 하루콕</title><meta name="description" content="백분위수·사분위수 계산기로 숫자 목록의 백분위수와 Q1·중앙값·Q3을 확인하세요. 입력값으로 바로 계산하며 결과를 복사할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/quantile-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head><body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 목록과 백분위(0~100)를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="field"><label for="values">숫자 목록</label><textarea id="values" rows="5" maxlength="100000" placeholder="1, 2, 3, 4, 5" spellcheck="false"></textarea></div><div class="field"><label for="percent">구할 백분위(%)</label><input id="percent" type="text" inputmode="decimal" maxlength="150" placeholder="25" autocomplete="off"></div><p class="hint">최대 2,000개 · 쉼표·공백·줄바꿈으로 구분</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="7" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>오름차순 목록에서 h=(n−1)p 위치를 선형 보간하는 R7 방식입니다. 사분위수 정의에 따라 다른 프로그램과 값이 달라질 수 있습니다.</p><a href="https://www.itl.nist.gov/div898/handbook/eda/section3/eda35.htm" target="_blank" rel="noopener noreferrer">NIST · 통계량 정의</a></details></main></div></body></html>
