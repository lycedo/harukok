<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>랜덤 날짜 뽑기 | 하루콕</title><meta name="description" content="시작일과 종료일 사이에서 겹치지 않는 날짜를 무작위로 뽑으세요. 평일·주말 조건을 선택하고 최대 1,000개의 날짜를 복사할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/random-date-generator.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 날짜 범위와 조건·개수를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="start">시작일</label><input id="start" type="date" placeholder="예: 2026-11-01" min="1900-01-01" max="2100-12-31"></div><div class="field"><label for="end">종료일</label><input id="end" type="date" placeholder="예: 2026-11-30" min="1900-01-01" max="2100-12-31"></div><div class="field"><label for="count">뽑을 개수</label><input id="count" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field"><label for="mode">날짜 조건</label><select id="mode"><option value="all">모든 요일</option><option value="weekday">월~금</option><option value="weekend">토·일</option></select></div></div><p class="hint">시작·종료일 포함 · 중복 없음 · 공휴일 구분 없음</p><button id="start" class="primary" type="submit">날짜 뽑기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>Web Crypto 난수를 사용해 각 날짜를 같은 확률로 뽑고 결과를 날짜순으로 정렬합니다. 평일은 월~금 기준이며 공휴일과 지역별 휴일은 제외하지 않습니다.</p></details>
</main></div></body></html>
