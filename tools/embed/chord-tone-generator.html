<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>화음 구성음 만들기 | 하루콕</title><meta name="description" content="으뜸음과 화음 종류를 골라 화음 구성음을 만드세요. 장·단·감·증 삼화음과 7화음·서스펜디드 화음의 음도 철자를 표시합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/chord-tone-generator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 항목을 고르고 실행 버튼을 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="root-field"><label for="root">으뜸음</label><select id="root"><option value="C">C</option><option value="C#">C#</option><option value="D">D</option><option value="Eb">Eb</option><option value="E">E</option><option value="F">F</option><option value="F#">F#</option><option value="G">G</option><option value="Ab">Ab</option><option value="A">A</option><option value="Bb">Bb</option><option value="B">B</option></select></div><div class="field" id="quality-field"><label for="quality">화음 종류</label><select id="quality"><option value="major">장3화음</option><option value="minor">단3화음</option><option value="dim">감3화음</option><option value="aug">증3화음</option><option value="dominant7">딸림7화음</option><option value="major7">장7화음</option><option value="minor7">단7화음</option><option value="halfDim7">반감7화음</option><option value="dim7">감7화음</option><option value="sus2">sus2</option><option value="sus4">sus4</option></select></div></div><p class="hint">12평균율·근음 위치 음도 순서 · 전위·옥타브·운지 제외</p><button class="primary" type="submit">화음 만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>화음별 반음 간격을 적용하되 3도·5도·7도 음이름을 유지합니다. 이명동음 철자를 보존해 E#·Bbb 같은 표기가 나올 수 있습니다.</p></details></main></div></body></html>
