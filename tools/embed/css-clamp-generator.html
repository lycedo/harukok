<!DOCTYPE html>

<title>CSS clamp 만들기 | 하루콕</title><meta name="description" content="화면 너비에 따라 바뀌는 CSS clamp 값을 만드세요. 최소·최대 크기와 기준 화면 너비로 선형 보간식을 계산합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/css-clamp-generator.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 크기와 화면 너비의 최솟값·최댓값을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="minimum">최소 크기 (px)</label><input id="minimum" type="text" placeholder="16" autocomplete="off" maxlength="10000"></div><div class="field"><label for="maximum">최대 크기 (px)</label><input id="maximum" type="text" placeholder="24" autocomplete="off" maxlength="10000"></div><div class="field"><label for="from">최소 화면 너비 (px)</label><input id="from" type="text" placeholder="320" autocomplete="off" maxlength="10000"></div><div class="field"><label for="to">최대 화면 너비 (px)</label><input id="to" type="text" placeholder="960" autocomplete="off" maxlength="10000"></div></div><p class="hint">크기 0~10,000px · 화면 너비 1~10,000px</p><button class="primary" type="submit">코드 만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>출력은 px와 vw를 사용합니다. 최소 화면 너비에서 최소 크기, 최대 너비에서 최대 크기가 되며 바깥 범위는 제한합니다. 표시 계수는 소수점 8자리로 반올림합니다.</p></details>
</main></div></body></html>
