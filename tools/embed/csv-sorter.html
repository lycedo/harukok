<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>CSV 행 정렬기 | 하루콕</title><meta name="description" content="선택한 CSV 열을 문자순 또는 정확한 십진수 순서로 정렬하세요. 머리글을 유지합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/csv-sorter.js?v=20261105-500" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">CSV</label><textarea id="source" rows="5" maxlength="100000" placeholder="이름,점수
하루,90
콕,80" spellcheck="false"></textarea></div><div class="field"><label for="column">정렬 열</label><input id="column" type="text" maxlength="1000" placeholder="점수" autocomplete="off"></div><div class="field"><label for="type">값 종류</label><select id="type"><option value="text">문자 코드 순</option><option value="number">숫자</option></select></div><div class="field"><label for="direction">순서</label><select id="direction"><option value="asc">오름차순</option><option value="desc">내림차순</option></select></div><p class="hint">첫 행은 열 이름. 최대 1,000행·50열·100,000자.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>선택한 CSV 열을 문자순 또는 정확한 십진수 순서로 정렬하세요. 머리글을 유지합니다.</p><p><a href="https://www.rfc-editor.org/rfc/rfc4180.html" target="_blank" rel="noopener noreferrer">CSV 형식 RFC 4180</a></p></details>
</main></div></body></html>
