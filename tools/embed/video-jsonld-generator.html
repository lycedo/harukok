<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>영상 JSON-LD 만들기 | 하루콕</title><meta name="description" content="영상 제목·설명·썸네일·업로드일·길이로 VideoObject JSON-LD를 만드세요. 영상 파일을 업로드하지 않습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/video-jsonld-generator.js?v=20261107-1000" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="name">영상 제목</label><input id="name" type="text" maxlength="1000" placeholder="도구 소개" autocomplete="off"></div><div class="field"><label for="description">영상 설명</label><input id="description" type="text" maxlength="1000" placeholder="무료 도구 사용 화면입니다." autocomplete="off"></div><div class="field"><label for="thumbnail">썸네일 URL</label><input id="thumbnail" type="text" maxlength="1000" placeholder="https://example.com/thumb.jpg" autocomplete="off"></div><div class="field"><label for="uploaded">업로드 시각</label><input id="uploaded" type="text" maxlength="1000" placeholder="2026-11-07T10:00:00+09:00" autocomplete="off"></div><div class="field"><label for="seconds">영상 길이 · 정수 초</label><input id="seconds" type="text" maxlength="1000" placeholder="90" autocomplete="off"></div><div class="field"><label for="url">영상 파일 URL</label><input id="url" type="text" maxlength="1000" placeholder="https://example.com/video.mp4" autocomplete="off"></div><p class="hint">실제 페이지에 표시한 사실을 넣으세요. 가짜 평가·후기는 생성하지 않습니다.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>영상 제목·설명·썸네일·업로드일·길이로 VideoObject JSON-LD를 만드세요. 영상 파일을 업로드하지 않습니다.</p><p><a href="https://schema.org/docs/schemas.html" target="_blank" rel="noopener noreferrer">Schema.org vocabulary</a></p></details>
</main></div></body></html>
