<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>몇 번째 요일 날짜 찾기 | 하루콕</title><meta name="description" content="해당 월의 첫째~다섯째 또는 마지막 특정 요일을 찾으세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/nth-weekday-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="date-field"><label for="date">해당 월의 날짜</label><input id="date" type="date" placeholder="2026-02-01" min="1900-01-01" max="2100-12-31"></div><div class="field" id="weekday-field"><label for="weekday">요일 · 월=1~일=7</label><input id="weekday" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field" id="nth-field"><label for="nth">몇 번째</label><select id="nth"><option value="1">첫째</option><option value="2">둘째</option><option value="3">셋째</option><option value="4">넷째</option><option value="5">다섯째</option><option value="last">마지막</option></select></div></div><p class="hint">Gregorian 월 기준 · 존재하지 않는 다섯째 요일은 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>요일의 월 안 순서만 계산합니다.</p></details></main></div></body></html>
