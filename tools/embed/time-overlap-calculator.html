<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>시간대 겹침 계산기 | 하루콕</title><meta name="description" content="매일 반복되는 두 시간대의 겹치는 구간과 분량을 계산하세요. 종료 시각이 시작보다 이르면 자정을 넘는 구간으로 처리합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/time-overlap-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 두 시간대의 시작과 종료 시각을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="startA-field"><label for="startA">A 시작</label><input id="startA" type="time" placeholder="예: 22:00" inputmode="text" autocomplete="off"></div><div class="field" id="endA-field"><label for="endA">A 종료</label><input id="endA" type="time" placeholder="예: 02:00" inputmode="text" autocomplete="off"></div><div class="field" id="startB-field"><label for="startB">B 시작</label><input id="startB" type="time" placeholder="예: 01:00" inputmode="text" autocomplete="off"></div><div class="field" id="endB-field"><label for="endB">B 종료</label><input id="endB" type="time" placeholder="예: 03:00" inputmode="text" autocomplete="off"></div></div><p class="hint">매일 반복하는 시각 구간 · 같은 시작·종료는 0분</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>특정 날짜가 아닌 하루의 반복 시간대를 비교합니다. 자정을 넘으면 00:00 기준으로 나누어 계산하고 경계 시각만 같은 경우는 0분입니다.</p></details></main></div></body></html>
