<details class="tool-notes"><summary>도움말</summary><p>같은 키가 여러 번 나와도 지우지 않습니다. +는 공백으로 읽고 잘못된 퍼센트 인코딩은 거절합니다. # 뒤의 fragment는 제외합니다. 주소로 접속하지 않고 글자만 분석합니다.</p><p><a href="https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams" target="_blank" rel="noopener noreferrer">변환 기준</a></p></details>
