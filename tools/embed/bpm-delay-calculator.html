<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>BPM 딜레이 계산기 | 하루콕</title><meta name="description" content="BPM과 음표 길이로 딜레이·리버브 프리딜레이에 쓸 시간을 ms로 계산하세요. 기본 음표와 점음표·셋잇단음표를 선택할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/bpm-delay-calculator.js?v=20261108-1000" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> BPM과 음표 길이를 고르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="bpm-field"><label for="bpm">BPM (4분음표 기준)</label><input id="bpm" type="text" placeholder="예: 120" inputmode="decimal" autocomplete="off"></div><div class="field" id="note-field"><label for="note">음표</label><select id="note"><option value="1">온음표</option><option value="2">2분음표</option><option value="4">4분음표</option><option value="8">8분음표</option><option value="16">16분음표</option><option value="32">32분음표</option></select></div><div class="field" id="feel-field"><label for="feel">리듬</label><select id="feel"><option value="straight">기본</option><option value="dotted">점음표</option><option value="triplet">셋잇단음표</option></select></div></div><p class="hint">BPM 1~1000 · 4분음표가 1박</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>4분음표 길이는 60,000÷BPM ms입니다. 점음표는 기본 길이의 1.5배, 셋잇단음표는 2/3배입니다.</p></details>
</main></div></body></html>
