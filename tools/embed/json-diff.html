<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>JSON 비교 도구 | 하루콕</title><meta name="description" content="두 JSON의 추가·삭제·변경 경로를 비교하세요. 객체 키 순서와 공백은 무시하고 배열은 위치별로 비교합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/json-diff.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 비교할 JSON 두 개를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="before">이전 JSON</label><textarea id="before" rows="5" maxlength="100000" placeholder="{&quot;name&quot;:&quot;하루&quot;,&quot;count&quot;:1}" spellcheck="false"></textarea></div><div class="field"><label for="after">이후 JSON</label><textarea id="after" rows="5" maxlength="100000" placeholder="{&quot;count&quot;:2,&quot;name&quot;:&quot;하루&quot;}" spellcheck="false"></textarea></div><p class="hint">각 100,000자 · 객체 키 순서 무시</p><button class="primary" type="submit">비교하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>배열은 같은 인덱스끼리 비교합니다. 경로는 JSON Pointer 형식입니다. 숫자는 자바스크립트 숫자 범위로 비교합니다.</p></details>
</main></div></body></html>
