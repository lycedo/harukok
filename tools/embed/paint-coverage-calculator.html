<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>페인트 소요량 계산기 | 하루콕</title><meta name="description" content="칠할 면적과 도장 횟수·제품 도포 면적으로 필요한 페인트 양을 계산하세요. 용기당 용량으로 올림한 구매 개수와 남는 양을 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/paint-coverage-calculator.js?v=20261108-1000" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 면적·도장 횟수·제품 규격을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="area-field"><label for="area">칠할 면적 (m²)</label><input id="area" type="text" placeholder="예: 30" inputmode="decimal" autocomplete="off"></div><div class="field" id="coats-field"><label for="coats">도장 횟수</label><input id="coats" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div><div class="field" id="coverage-field"><label for="coverage">제품 도포 면적 (m²/L·1회)</label><input id="coverage" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="container-field"><label for="container">용기당 용량 (L)</label><input id="container" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div></div><p class="hint">제품의 1회 도포 기준 · 흡수·손실·추가 여유 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>필요량은 면적×도장 횟수÷리터당 도포 면적입니다. 제품에 적힌 기준을 사용하며 표면 상태와 도구에 따른 손실은 별도로 더해야 합니다.</p></details>
</main></div></body></html>
