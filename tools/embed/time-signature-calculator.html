<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>박자·마디 길이 계산기 | 하루콕</title><meta name="description" content="박자표·마디 수·BPM으로 전체 재생 길이를 계산하세요. BPM이 가리키는 음표와 점음표 여부를 지정해 6/8박자 같은 리듬도 환산합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/time-signature-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 박자표·마디 수·BPM 기준 음표를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="numerator-field"><label for="numerator">박자표 위 숫자</label><input id="numerator" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="denominator-field"><label for="denominator">박자표 아래 숫자</label><select id="denominator"><option value="2">2</option><option value="4">4</option><option value="8">8</option><option value="16">16</option></select></div><div class="field" id="bars-field"><label for="bars">마디 수</label><input id="bars" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="bpm-field"><label for="bpm">BPM</label><input id="bpm" type="text" placeholder="예: 120" inputmode="decimal" autocomplete="off"></div><div class="field" id="beat-field"><label for="beat">BPM 기준 음표</label><select id="beat"><option value="4">4분음표</option><option value="8">8분음표</option><option value="2">2분음표</option></select></div><div class="field" id="feel-field"><label for="feel">기준 음표 형태</label><select id="feel"><option value="plain">기본</option><option value="dotted">점음표</option></select></div></div><p class="hint">일정 템포 · 쉼·반복·픽업·템포 변화 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>박자표의 마디 길이를 BPM 기준 음표 개수로 바꿔 60÷BPM초를 곱합니다. 시:분:초 표시는 1초 반올림하며 원래 길이도 초 단위로 함께 적습니다.</p></details></main></div></body></html>
