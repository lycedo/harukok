<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>읽기 시간 계산기 | 하루콕</title><meta name="description" content="글 분량과 읽는 속도로 예상 읽기 시간을 계산하세요. 공백 제외 글자 수 또는 공백으로 나눈 단어 수를 기준으로 선택할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/reading-time-calculator.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 글과 분당 읽는 분량을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="source">읽을 글</label><textarea id="source" rows="6" maxlength="100000" spellcheck="false" placeholder="여기에 글을 붙여넣으세요."></textarea></div><div class="field"><label for="mode">분량 기준</label><select id="mode"><option value="chars">공백 제외 글자</option><option value="words">공백 구분 단어</option></select></div><div class="field"><label for="speed">분당 읽는 분량</label><input id="speed" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div></div><p class="hint">사용자 속도 기준 · 낭독·난이도·휴식은 별도</p><button id="start" class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="6" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>글자는 유니코드 코드 포인트 기준으로 공백을 제외합니다. 단어는 공백으로 나누며 실제 읽기 속도는 사람과 글에 따라 다릅니다.</p></details>
</main></div></body></html>
