<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>콘크리트 소요량 계산기 | 하루콕</title><meta name="description" content="직사각 바닥의 가로·세로·두께로 콘크리트 부피를 계산하세요. 손실 여유와 포대당 완성 부피를 넣어 구매 포대 수도 구합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/concrete-volume-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="length-field"><label for="length">길이 (m)</label><input id="length" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="width-field"><label for="width">너비 (m)</label><input id="width" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div><div class="field" id="depth-field"><label for="depth">두께 (cm)</label><input id="depth" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="waste-field"><label for="waste">손실 여유 (%)</label><input id="waste" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="yield-field"><label for="yield">1포 완성 부피 (L)</label><input id="yield" type="text" placeholder="예: 12" inputmode="decimal" autocomplete="off"></div></div><p class="hint">직사각 평판 견적 · 배합·양생·구조 설계 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>가로×세로×두께에 손실률을 더합니다. 포대 규격의 완성 부피를 직접 넣으세요. 구조 적합성이나 허용 하중은 판단하지 않습니다.</p></details></main></div></body></html>
