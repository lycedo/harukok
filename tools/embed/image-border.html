<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>사진 테두리 넣기 - 무료 도구 | 하루콕</title><meta name="description" content="사진 바깥에 색상 테두리를 넣고 PNG로 저장하세요. 원본은 자르지 않고 테두리 두께만큼 캔버스를 늘립니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/image-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/creative100-common.js?v=20261104" defer></script><script src="/tools/image-border.js?v=20261104" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq">
<style>body{display:flow-root;padding:0;background:transparent}</style></head><body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 사진과 테두리 두께·색을 정하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="image-form" novalidate><div class="field"><label for="image-file">사진 선택</label><input class="image-file" id="image-file" type="file" accept="image/jpeg,image/png,image/webp"><p class="hint">JPG·PNG·WebP · 10MB·1,200만 화소 이하</p></div><fieldset class="image-controls" id="image-controls" disabled><legend>변환 설정</legend><div class="field"><label for="thickness">테두리 두께 (px)</label><input id="thickness" type="number" placeholder="예: 20" inputmode="decimal" min="0" max="1000" step="1"></div><div class="field"><label for="border-color">테두리 색상 HEX</label><input id="border-color" type="text" placeholder="예: #16233D"  ></div><button class="primary" id="image-submit" type="submit">사진 변환하기</button></fieldset></form><p class="error" id="image-error" role="alert"></p><p class="hint" id="image-status" role="status"></p><figure id="source-figure" hidden><figcaption>원본</figcaption><div class="image-preview"><img id="source-preview" alt="선택한 원본"></div><p class="hint" id="source-info"></p></figure><section class="result" id="image-result" hidden aria-live="polite"><h2>결과</h2><div class="image-preview" ><img id="result-preview" alt="변환한 사진"></div><p id="result-info"></p><div class="actions"><a class="primary" id="download-image" download >PNG로 저장하기</a></div></section></section>

<details class="tool-notes"><summary>도움말</summary><p>두께는 0~1,000px입니다. 가로·세로에 두께의 두 배를 더하며 완성 이미지는 1,200만 화소 이하입니다.</p><p>파일·입력값은 브라우저 안에서 처리하며 서버로 전송하거나 저장하지 않습니다.</p></details></main></div></body></html>
