<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>ULID 생성기 | 하루콕</title><meta name="description" content="48비트 시각과 안전한 난수로 26자리 ULID를 만드세요. 지정한 밀리초 또는 현재 시각으로 여러 개를 생성합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/ulid-generator.js?v=20261104-300" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 개수와 사용할 시각을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="count">만들 개수</label><input id="count" type="text" maxlength="1000" placeholder="3" autocomplete="off"></div><div class="field"><label for="timestamp">UNIX 밀리초 (빈칸은 현재 시각)</label><input id="timestamp" type="text" maxlength="1000" placeholder="0" autocomplete="off"></div><p class="hint">1~100개 · 26자리 ULID · 안전한 브라우저 난수</p><button class="primary" type="submit">만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>Crockford Base32의 48비트 시각과 80비트 난수를 사용합니다. 같은 밀리초 안의 생성 순서는 보장하지 않으며 서버에 ID를 등록하지 않습니다.</p><p><a href="https://github.com/ulid/spec" target="_blank" rel="noopener noreferrer">ULID 규격</a></p></details>
</main></div></body></html>
