<details class="tool-notes"><summary>계산 방법</summary><p>직렬은 R₁+R₂+…이고 병렬은 1÷(1/R₁+1/R₂+…)입니다. 병렬에 0Ω이 하나라도 있으면 이상적인 합성 저항은 0Ω입니다. 각 저항의 허용오차·정격·발열은 포함하지 않습니다. 숫자 입력은 0 또는 절댓값 10⁻¹⁰⁰~10¹⁰⁰이며 항목에 따라 0은 제외합니다. 결과는 유효숫자 최대 12자리의 근삿값입니다.</p><a href="https://openstax.org/books/university-physics-volume-2/pages/10-2-resistors-in-series-and-parallel" target="_blank" rel="noopener noreferrer">OpenStax · 저항 회로</a></details>
