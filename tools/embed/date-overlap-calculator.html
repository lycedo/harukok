<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>날짜 기간 겹침 계산기 | 하루콕</title><meta name="description" content="두 날짜 기간이 겹치는 시작일·종료일과 일수를 계산하세요. 양 끝 날짜를 포함하는 일정·예약 기간의 교집합을 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/date-overlap-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 두 기간의 시작일과 종료일을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="startA-field"><label for="startA">A 시작일</label><input id="startA" type="date" placeholder="예: 2026-11-01" min="1900-01-01" max="2100-12-31"></div><div class="field" id="endA-field"><label for="endA">A 종료일</label><input id="endA" type="date" placeholder="예: 2026-11-10" min="1900-01-01" max="2100-12-31"></div><div class="field" id="startB-field"><label for="startB">B 시작일</label><input id="startB" type="date" placeholder="예: 2026-11-05" min="1900-01-01" max="2100-12-31"></div><div class="field" id="endB-field"><label for="endB">B 종료일</label><input id="endB" type="date" placeholder="예: 2026-11-15" min="1900-01-01" max="2100-12-31"></div></div><p class="hint">양 끝 날짜 포함 · 같은 경계 날짜도 1일</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>교집합 시작일은 두 시작일 중 늦은 날, 종료일은 두 종료일 중 이른 날입니다. 날짜만 비교하며 체크인·체크아웃 같은 시간 조건은 적용하지 않습니다.</p></details></main></div></body></html>
