<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>줄 번호 붙이기 | 하루콕</title><meta name="description" content="여러 줄에 시작 번호와 간격을 정해 번호를 붙이세요. 구분 글자와 빈 줄 처리 방식도 고를 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/text-numbering.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 원문과 번호 시작 값을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">원문</label><textarea id="source" rows="5" maxlength="100000" placeholder="준비
검토
완료" spellcheck="false"></textarea></div><div class="field"><label for="start">시작 번호</label><input id="start" type="text" placeholder="1" autocomplete="off" maxlength="10000"></div><div class="field"><label for="step">증가 간격</label><input id="step" type="text" placeholder="1" autocomplete="off" maxlength="10000"></div><div class="field"><label for="separator">번호 뒤 구분 글자</label><input id="separator" type="text" placeholder=". " autocomplete="off" maxlength="10000"></div><div class="field"><label for="empty">빈 줄 처리</label><select id="empty"><option value="skip">빈 줄은 그대로</option><option value="include">빈 줄도 번호 붙이기</option></select></div><p class="hint">100,000자·10,000줄 · 시작 0~10억</p><button class="primary" type="submit">번호 붙이기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>빈 줄을 건너뛰면 다음 번호도 건너뛰지 않습니다. 줄 순서와 양끝 공백을 유지합니다.</p></details>
</main></div></body></html>
