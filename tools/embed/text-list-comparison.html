<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>목록 비교 도구 | 하루콕</title><meta name="description" content="두 줄 목록의 공통 항목·차집합·합집합을 구하세요. 중복을 제거하고 처음 나온 순서로 결과를 정리합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/text-list-comparison.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 항목을 한 줄에 하나씩 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="a">목록 A</label><textarea id="a" rows="5" maxlength="100000" placeholder="사과
배
포도" spellcheck="false"></textarea></div><div class="field"><label for="b">목록 B</label><textarea id="b" rows="5" maxlength="100000" placeholder="배
포도
귤" spellcheck="false"></textarea></div><div class="field"><label for="mode">비교 방식</label><select id="mode"><option value="intersection">두 목록의 공통 항목</option><option value="difference">A에만 있는 항목</option><option value="reverse">B에만 있는 항목</option><option value="union">두 목록 합치기</option></select></div><div class="field"><label for="space">공백 처리</label><select id="space"><option value="exact">양끝 공백 구분</option><option value="trim">양끝 공백 무시</option></select></div><p class="hint">각 100,000자·10,000줄 · 빈 줄 제외</p><button class="primary" type="submit">비교하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>영문 대소문자는 구분합니다. 중복 항목은 한 번만 남기며 A 다음 B 순서를 따릅니다.</p></details>
</main></div></body></html>
