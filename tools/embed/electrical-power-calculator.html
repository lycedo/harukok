<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 전력·전압·전류 중 구할 값 한 칸을 비우세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="power-field"><label for="power">전력 P(W)</label><input id="power" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 60"></div><div class="field" id="voltage-field"><label for="voltage">전압 V(V)</label><input id="voltage" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 12"></div><div class="field" id="current-field"><label for="current">전류 I(A)</label><input id="current" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 5"></div></div><p class="hint">직류·일정 전압/전류 · 교류 역률 계산 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="4" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>P=VI, V=P÷I, I=P÷V를 사용합니다. 전력·전압·전류는 음수가 아닌 크기입니다. 교류 실효값·역률·상수 계산에는 이 모델을 적용하지 않습니다. 저항이 필요한 계산은 옴의 법칙 도구를 사용하세요. 숫자 입력은 0 또는 절댓값 10⁻¹⁰⁰~10¹⁰⁰이며 항목에 따라 0은 제외합니다. 결과는 유효숫자 최대 12자리의 근삿값입니다.</p><a href="https://openstax.org/books/college-physics-2e/pages/20-4-electric-power-and-energy" target="_blank" rel="noopener noreferrer">OpenStax · 전력</a></details>
</main></div></body></html>
