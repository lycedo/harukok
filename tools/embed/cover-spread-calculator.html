<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>책 표지 펼침 크기 계산기 | 하루콕</title><meta name="description" content="뒤표지·책등·앞표지와 날개·도련을 포함한 표지 펼침 크기를 구하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/cover-spread-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="width-field"><label for="width">표지 한 면 가로 (mm)</label><input id="width" type="text" placeholder="예: 148" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">표지 세로 (mm)</label><input id="height" type="text" placeholder="예: 210" inputmode="decimal" autocomplete="off"></div><div class="field" id="spine-field"><label for="spine">책등 두께 (mm)</label><input id="spine" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div><div class="field" id="flap-field"><label for="flap">양쪽 날개 각각 (mm)</label><input id="flap" type="text" placeholder="예: 0" inputmode="decimal" autocomplete="off"></div><div class="field" id="bleed-field"><label for="bleed">사방 도련 (mm)</label><input id="bleed" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div></div><p class="hint">바깥쪽에서 본 뒤표지→책등→앞표지 · 날개는 좌우 같은 크기</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>가로는 표지 두 면+책등+양쪽 날개+양쪽 도련입니다. 세로는 표지 높이+양쪽 도련입니다. 하드커버 싸개·힌지·접착 여유는 제외합니다.</p></details></main></div></body></html>
