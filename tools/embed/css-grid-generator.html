<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>CSS Grid 만들기 | 하루콕</title><meta name="description" content="고정 열 또는 반응형 CSS Grid 코드를 만드세요. 열 수·간격·최소 카드 너비로 복사할 레이아웃을 생성합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/css-grid-generator.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 배치 방식과 간격을 고르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field"><label for="mode">배치 방식</label><select id="mode"><option value="fixed">고정 열 수</option><option value="responsive">너비에 맞춰 자동 배치</option></select></div><div class="field"><label for="columns">열 수 (고정 배치)</label><input id="columns" type="text" placeholder="3" autocomplete="off" maxlength="10000"></div><div class="field"><label for="gap">간격 (px)</label><input id="gap" type="text" placeholder="16" autocomplete="off" maxlength="10000"></div><div class="field"><label for="minimum">최소 카드 너비 (반응형, px)</label><input id="minimum" type="text" placeholder="200" autocomplete="off" maxlength="10000"></div></div><p class="hint">고정 1~12열 · 간격 0~200px</p><button class="primary" type="submit">코드 만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>코드 생성 도구입니다. 컨테이너에 grid 클래스를 붙이고 자식 요소를 넣어 사용하세요. 반응형은 카드가 부모 너비보다 커지지 않게 제한합니다.</p></details>
</main></div></body></html>
