<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>연평균 성장률 계산기 | 하루콕</title><meta name="description" content="시작 값과 종료 값·기간으로 복리 연평균 성장률 CAGR을 계산하세요. 중간 입출금이 없는 두 시점의 기하 평균 변화율을 구합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/cagr-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 시작 값·종료 값·기간을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="initial-field"><label for="initial">시작 값</label><input id="initial" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="final-field"><label for="final">종료 값</label><input id="final" type="text" placeholder="예: 121" inputmode="decimal" autocomplete="off"></div><div class="field" id="years-field"><label for="years">기간 (년)</label><input id="years" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div></div><p class="hint">시작 값 0 초과 · 중간 입출금 없는 두 시점 기준</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>CAGR=(종료 값÷시작 값)^(1÷기간)−1입니다. 중간 현금흐름과 변동성을 반영하지 않는 수학적 요약값이며 미래 성장률이 아닙니다.</p></details></main></div></body></html>
