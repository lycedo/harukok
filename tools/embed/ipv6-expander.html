<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>IPv6 주소 펼치기 | 하루콕</title><meta name="description" content="축약된 IPv6를 8개 4자리 블록으로 펼치고 16진수 압축 표기로 바꾸세요. IPv4가 붙은 주소도 처리합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> IPv6 주소를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">IPv6 주소</label><input id="source" type="text" maxlength="1000" placeholder="2001:db8::1" autocomplete="off"></div><p class="hint">IPv6 128비트 · 포트·프리픽스·영역 ID 제외</p><button class="primary" type="submit">변환하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>가장 긴 0 블록을 압축하며 길이가 같으면 앞쪽을 고릅니다. IPv4 꼬리는 16진수로 바꿉니다. 주소 유효 형식만 확인하며 네트워크에 접속하지 않습니다.</p><p><a href="https://www.rfc-editor.org/rfc/rfc4291" target="_blank" rel="noopener noreferrer">IPv6 주소 형식</a></p></details>
