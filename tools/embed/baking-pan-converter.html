<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>베이킹 팬 크기 환산기 | 하루콕</title><meta name="description" content="기존 팬과 새 팬의 모양·내부 치수·반죽 높이로 레시피 배수를 계산하세요. 원형과 직사각 팬 사이를 반죽 부피 기준으로 환산합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/baking-pan-converter.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="oldShape-field"><label for="oldShape">기존 팬 모양</label><select id="oldShape"><option value="round">원형</option><option value="rect">직사각</option></select></div><div class="field" id="oldWidth-field"><label for="oldWidth">기존 지름 또는 가로 (cm)</label><input id="oldWidth" type="text" placeholder="예: 20" inputmode="decimal" autocomplete="off"></div><div class="field" id="oldHeight-field"><label for="oldHeight">기존 세로 (직사각일 때, cm)</label><input id="oldHeight" type="text" placeholder="예: 20" inputmode="decimal" autocomplete="off"></div><div class="field" id="oldDepth-field"><label for="oldDepth">기존 반죽 높이 (cm)</label><input id="oldDepth" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="newShape-field"><label for="newShape">새 팬 모양</label><select id="newShape"><option value="round">원형</option><option value="rect">직사각</option></select></div><div class="field" id="newWidth-field"><label for="newWidth">새 지름 또는 가로 (cm)</label><input id="newWidth" type="text" placeholder="예: 24" inputmode="decimal" autocomplete="off"></div><div class="field" id="newHeight-field"><label for="newHeight">새 세로 (직사각일 때, cm)</label><input id="newHeight" type="text" placeholder="예: 24" inputmode="decimal" autocomplete="off"></div><div class="field" id="newDepth-field"><label for="newDepth">새 반죽 높이 (cm)</label><input id="newDepth" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div></div><p class="hint">수직 옆면 팬 · 내부 치수 기준 · 굽는 온도·시간 자동 환산 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>팬 면적×채울 반죽 높이로 부피를 비교합니다. 원형은 세로 값이 쓰이지 않지만 입력 형식은 확인합니다. 반죽 팽창을 고려해 높이를 직접 정하세요.</p></details></main></div></body></html>
