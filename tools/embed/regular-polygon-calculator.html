<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>정다각형 계산기 | 하루콕</title><meta name="description" content="정다각형 계산기로 한 변과 변 개수의 넓이·둘레·내접외접 반지름을 확인하세요. 입력값으로 바로 계산하며 결과를 복사할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/regular-polygon-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head><body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="field"><label for="n">변 개수 n</label><input id="n" type="text" inputmode="decimal" maxlength="150" placeholder="6" autocomplete="off"></div><div class="field"><label for="side">한 변 길이</label><input id="side" type="text" inputmode="decimal" maxlength="150" placeholder="2" autocomplete="off"></div><p class="hint">정수 n 3~1,000,000 · 모든 변·각이 같은 볼록다각형</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="7" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>정n각형 넓이는 ns²/[4tan(π/n)]입니다. 내접원은 변에 접하고 외접원은 꼭짓점을 지납니다.</p><a href="https://openstax.org/books/calculus-volume-3/pages/2-5-equations-of-lines-and-planes-in-space" target="_blank" rel="noopener noreferrer">OpenStax · 좌표 기하</a></details></main></div></body></html>
