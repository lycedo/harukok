<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>URL 정규화 도구 | 하루콕</title><meta name="description" content="브라우저 URL 규칙으로 도메인·기본 포트·상대 경로를 정리하세요. 쿼리 정렬과 해시 제거를 선택할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/url-normalizer.js?v=20261105-500" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">URL</label><input id="source" type="text" maxlength="1000" placeholder="HTTPS://EXAMPLE.COM:443/a/../b?z=1&amp;a=2#top" autocomplete="off"></div><div class="field"><label for="query">쿼리 순서</label><select id="query"><option value="keep">유지</option><option value="sort">키 정렬</option></select></div><div class="field"><label for="hash">해시</label><select id="hash"><option value="keep">유지</option><option value="remove">제거</option></select></div><p class="hint">쿼리 정렬은 서명 URL의 의미를 바꿀 수 있습니다. 기본은 순서 유지입니다.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>브라우저 URL 규칙으로 도메인·기본 포트·상대 경로를 정리하세요. 쿼리 정렬과 해시 제거를 선택할 수 있습니다.</p><p><a href="https://url.spec.whatwg.org/" target="_blank" rel="noopener noreferrer">WHATWG URL Standard</a></p></details>
</main></div></body></html>
