<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>래글런 늘림 단수 계산기 | 하루콕</title><meta name="description" content="현재·목표 코 수와 늘림 한 번의 추가 코 수로 필요한 늘림 횟수와 단 수를 구하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/raglan-increase-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="current-field"><label for="current">현재 전체 코 수</label><input id="current" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="target-field"><label for="target">목표 전체 코 수</label><input id="target" type="text" placeholder="예: 180" inputmode="decimal" autocomplete="off"></div><div class="field" id="per-field"><label for="per">늘림 단 1회 추가 코</label><input id="per" type="text" placeholder="예: 8" inputmode="decimal" autocomplete="off"></div><div class="field" id="interval-field"><label for="interval">늘림 단 사이 간격 단 수</label><input id="interval" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div></div><p class="hint">첫 단에서 1회 늘림 · 정수 횟수 올림 · 몸판·소매 배분 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>추가 코 수로 나눠떨어지지 않으면 최종 도달 코 수가 목표를 넘습니다.</p></details></main></div></body></html>
