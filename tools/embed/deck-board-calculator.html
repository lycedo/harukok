<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>데크 판재 수량 계산기 | 하루콕</title><meta name="description" content="직사각 데크 크기·판재 폭·틈·판재 길이로 동일 방향 판재 수량을 계산하세요. 한 줄의 끝부분을 자르는 단순 배치와 여유분을 사용합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/deck-board-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="length-field"><label for="length">데크 길이 (m)</label><input id="length" type="text" placeholder="예: 4" inputmode="decimal" autocomplete="off"></div><div class="field" id="width-field"><label for="width">데크 너비 (m)</label><input id="width" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="boardWidth-field"><label for="boardWidth">판재 너비 (mm)</label><input id="boardWidth" type="text" placeholder="예: 140" inputmode="decimal" autocomplete="off"></div><div class="field" id="gap-field"><label for="gap">판재 옆 틈 (mm)</label><input id="gap" type="text" placeholder="예: 5" inputmode="decimal" autocomplete="off"></div><div class="field" id="boardLength-field"><label for="boardLength">판재 1장 길이 (m)</label><input id="boardLength" type="text" placeholder="예: 2" inputmode="decimal" autocomplete="off"></div><div class="field" id="waste-field"><label for="waste">추가 판재 여유 (%)</label><input id="waste" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">판재는 데크 길이 방향 · 끝 이음 틈·절단 조각 재사용 제외</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>너비 방향은 판재 n장과 틈 n−1개의 합이 데크 너비를 덮도록 올립니다. 끝 판재는 절단하며 구조·장선·고정물 수량은 별도입니다.</p></details></main></div></body></html>
