<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>손익분기점 계산기 | 하루콕</title><meta name="description" content="기간 고정비와 단위 판매가·변동비로 손익분기 판매 수량을 계산하세요. 정수 원 입력으로 수량을 정확히 올림하고 해당 매출을 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/break-even-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 고정비·단위 판매가·변동비를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="fixed-field"><label for="fixed">기간 고정비 (원, 정수)</label><input id="fixed" type="text" placeholder="예: 1000000" inputmode="decimal" autocomplete="off"></div><div class="field" id="price-field"><label for="price">단위 판매가 (원, 정수)</label><input id="price" type="text" placeholder="예: 10000" inputmode="decimal" autocomplete="off"></div><div class="field" id="variable-field"><label for="variable">단위 변동비 (원, 정수)</label><input id="variable" type="text" placeholder="예: 6000" inputmode="decimal" autocomplete="off"></div></div><p class="hint">같은 기간·같은 제품 기준 · 판매가·변동비 일정 가정</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>단위 공헌이익=판매가−변동비입니다. 고정비÷공헌이익을 정수 수량으로 올립니다. 세금·제품 혼합과 수량에 따른 가격 변화는 반영하지 않습니다.</p></details></main></div></body></html>
