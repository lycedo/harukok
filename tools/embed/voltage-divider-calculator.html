<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>분압 저항 계산기 | 하루콕</title><meta name="description" content="분압 저항 계산기로 두 저항 분압기의 부하 연결 전후 출력전압을 확인하세요. 입력값으로 바로 계산하며 결과를 복사할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/voltage-divider-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head><body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="field"><label for="voltage">입력 전압(V)</label><input id="voltage" type="text" inputmode="decimal" maxlength="150" placeholder="12" autocomplete="off"></div><div class="field"><label for="top">입력 쪽 저항 R1(Ω)</label><input id="top" type="text" inputmode="decimal" maxlength="150" placeholder="1000" autocomplete="off"></div><div class="field"><label for="bottom">접지 쪽 저항 R2(Ω)</label><input id="bottom" type="text" inputmode="decimal" maxlength="150" placeholder="2000" autocomplete="off"></div><div class="field"><label for="load">출력 부하 저항(Ω·0=없음)</label><input id="load" type="text" inputmode="decimal" maxlength="150" placeholder="0" autocomplete="off"></div><p class="hint">R1·R2&gt;0 · 부하는 R2와 병렬 · 이상적 직류 전원</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="7" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>부하가 없으면 Vout=Vin R2/(R1+R2)입니다. 부하가 있으면 R2와 RL의 병렬 합성저항을 R2 대신 씁니다. 입력원 내부저항·발열·저항 오차는 제외합니다.</p><a href="https://openstax.org/books/university-physics-volume-2/pages/15-3-rlc-series-circuits-with-ac" target="_blank" rel="noopener noreferrer">OpenStax · 교류 회로</a></details></main></div></body></html>
