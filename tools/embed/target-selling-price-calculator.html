<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>목표 순이익 판매가 계산기 | 하루콕</title><meta name="description" content="상품 원가·배송비·고정 수수료·판매 수수료율과 목표 순이익으로 최소 판매가를 구하세요. 여러 비용을 공제한 뒤 목표 이익이 남도록 1원 단위로 올립니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/target-selling-price-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="cost-field"><label for="cost">상품 원가 (원)</label><input id="cost" type="text" placeholder="예: 5000" inputmode="decimal" autocomplete="off"></div><div class="field" id="shipping-field"><label for="shipping">판매자 부담 배송비 (원)</label><input id="shipping" type="text" placeholder="예: 3000" inputmode="decimal" autocomplete="off"></div><div class="field" id="fixed-field"><label for="fixed">기타 건당 고정비 (원)</label><input id="fixed" type="text" placeholder="예: 500" inputmode="decimal" autocomplete="off"></div><div class="field" id="profit-field"><label for="profit">목표 순이익 (원)</label><input id="profit" type="text" placeholder="예: 2000" inputmode="decimal" autocomplete="off"></div><div class="field" id="rate-field"><label for="rate">판매가 대비 수수료 (%)</label><input id="rate" type="text" placeholder="예: 10" inputmode="decimal" autocomplete="off"></div></div><p class="hint">수수료·순이익은 소수 원 표시 · 세금·반품·광고비는 직접 원가에 포함</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>판매가=(원가+배송비+고정비+목표이익)÷(1−판매수수료율)입니다. 실제 계약상 수수료 계산 단위와 과세 처리는 별도입니다.</p></details></main></div></body></html>
