<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>텍스트 나누기 | 하루콕</title><meta name="description" content="긴 글을 글자 수 또는 줄 수에 맞춰 여러 묶음으로 나누세요. 한글과 이모지를 코드 포인트 기준으로 처리합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/text-chunk-splitter.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 글과 묶음 크기를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">나눌 글</label><textarea id="source" rows="5" maxlength="100000" placeholder="가나다라마바사아자차" spellcheck="false"></textarea></div><div class="field"><label for="mode">나누는 기준</label><select id="mode"><option value="characters">글자 수</option><option value="lines">줄 수</option></select></div><div class="field"><label for="size">한 묶음 크기</label><input id="size" type="text" placeholder="3" autocomplete="off" maxlength="10000"></div><p class="hint">100,000자 · 묶음 크기 1~10,000 · 최대 10,000묶음</p><button class="primary" type="submit">나누기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>글자는 유니코드 코드 포인트 기준이며 결합 이모지는 나뉠 수 있습니다. 줄 기준은 마지막 줄바꿈 하나를 제외합니다. 각 묶음은 번호로 구분합니다.</p></details>
</main></div></body></html>
