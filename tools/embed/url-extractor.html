<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>URL 추출기 | 하루콕</title><meta name="description" content="글 속 http·https 주소를 한 번에 추출하세요. 중복과 문장 끝 기호 처리 방식을 고르고 주소 목록을 복사합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/url-extractor.js?v=20261108-1000" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 주소가 섞인 글을 붙여넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">원문</label><textarea id="source" rows="5" maxlength="100000" placeholder="참고: https://example.com/a 와 https://example.org/" spellcheck="false"></textarea></div><div class="field"><label for="punctuation">문장 끝 기호</label><select id="punctuation"><option value="trim">마침표·쉼표·닫는 괄호 정리</option><option value="keep">찾은 글자 그대로</option></select></div><div class="field"><label for="duplicates">중복 주소</label><select id="duplicates"><option value="unique">같은 주소 한 번만</option><option value="keep">모두 유지</option></select></div><p class="hint">100,000자 · http·https 형식 추출</p><button class="primary" type="submit">추출하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>공백·따옴표·꺾쇠에서 주소를 끊습니다. 기호 정리는 문맥을 추정하므로 실제 주소의 끝 기호도 빠질 수 있습니다. 형식만 확인하며 주소에 접속하지 않습니다.</p></details>
</main></div></body></html>
