<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>CSS 글꼴 단축 속성 만들기 | 하루콕</title><meta name="description" content="글꼴 이름·기울기·굵기·크기·줄 높이를 CSS font 단축 속성으로 만드세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="family">글꼴 이름</label><input id="family" type="text" maxlength="1000" placeholder="Noto Sans KR" autocomplete="off"></div><div class="field"><label for="style">기울기</label><select id="style"><option value="normal">normal</option><option value="italic">italic</option></select></div><div class="field"><label for="weight">굵기1~1000</label><input id="weight" type="text" maxlength="1000" placeholder="400" autocomplete="off"></div><div class="field"><label for="size">크기(px)</label><input id="size" type="text" maxlength="1000" placeholder="18" autocomplete="off"></div><div class="field"><label for="line">줄 높이 배수</label><input id="line" type="text" maxlength="1000" placeholder="1.5" autocomplete="off"></div><p class="hint">브라우저에서 처리합니다. 서버 전송 없음.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>
