<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="axis">스크롤 축</label><select id="axis"><option value="x">가로</option><option value="y">세로</option></select></div><div class="field"><label for="strict">스냅 강도</label><select id="strict"><option value="mandatory">mandatory</option><option value="proximity">proximity</option></select></div><div class="field"><label for="align">맞춤 위치</label><select id="align"><option value="start">start</option><option value="center">center</option><option value="end">end</option></select></div><div class="field"><label for="size">카드 길이(px)</label><input id="size" type="text" maxlength="1000" placeholder="300" autocomplete="off"></div><div class="field"><label for="gap">카드 사이(px)</label><input id="gap" type="text" maxlength="1000" placeholder="16" autocomplete="off"></div><p class="hint">브라우저에서 처리합니다. 서버 전송 없음.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>
