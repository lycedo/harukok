<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>CSV 키 결합기 | 하루콕</title><meta name="description" content="두 CSV를 같은 키로 왼쪽 결합하세요. 오른쪽 키는 중복 없이 입력하며 일치하지 않는 값은 빈칸입니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/csv-joiner.js?v=20261105-500" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">왼쪽 CSV</label><textarea id="source" rows="5" maxlength="100000" placeholder="ID,이름
1,하루
2,콕" spellcheck="false"></textarea></div><div class="field"><label for="right">오른쪽 CSV</label><textarea id="right" rows="5" maxlength="100000" placeholder="ID,점수
1,90" spellcheck="false"></textarea></div><div class="field"><label for="leftKey">왼쪽 키 열</label><input id="leftKey" type="text" maxlength="1000" placeholder="ID" autocomplete="off"></div><div class="field"><label for="rightKey">오른쪽 키 열</label><input id="rightKey" type="text" maxlength="1000" placeholder="ID" autocomplete="off"></div><p class="hint">첫 행은 열 이름. 최대 1,000행·50열·100,000자. 오른쪽 키는 고유해야 합니다.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>두 CSV를 같은 키로 왼쪽 결합하세요. 오른쪽 키는 중복 없이 입력하며 일치하지 않는 값은 빈칸입니다.</p><p><a href="https://www.rfc-editor.org/rfc/rfc4180.html" target="_blank" rel="noopener noreferrer">CSV 형식 RFC 4180</a></p></details>
</main></div></body></html>
