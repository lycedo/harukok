<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>초점거리 환산 계산기 | 하루콕</title><meta name="description" content="센서 가로·세로·실제 초점거리로 풀프레임 대각 기준 크롭 배수와 35mm 환산 초점거리를 계산하세요. 서로 다른 종횡비의 환산 한계도 확인합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/crop-factor-calculator.js?v=20261105-500" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 계산하기를 누르세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="width-field"><label for="width">센서 가로 (mm)</label><input id="width" type="text" placeholder="예: 24" inputmode="decimal" autocomplete="off"></div><div class="field" id="height-field"><label for="height">센서 세로 (mm)</label><input id="height" type="text" placeholder="예: 16" inputmode="decimal" autocomplete="off"></div><div class="field" id="focal-field"><label for="focal">실제 초점거리 (mm)</label><input id="focal" type="text" placeholder="예: 35" inputmode="decimal" autocomplete="off"></div></div><p class="hint">풀프레임 36×24mm·대각 화각 기준 · 광학 초점거리 변화 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>크롭 배수=풀프레임 대각÷센서 대각입니다. 환산 초점거리는 실제 초점거리×크롭 배수이며 종횡비가 다르면 수평·수직 화각이 동시에 같지 않습니다.</p></details></main></div></body></html>
