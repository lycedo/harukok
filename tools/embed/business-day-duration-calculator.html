<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>기간별 근무시간 합산기 | 하루콕</title><meta name="description" content="시작일부터 종료일까지 요일별 지정 시간을 합산하세요. 월~일에 서로 다른 근무시간을 넣고 직접 지정한 제외 날짜를 빼서 총 예정 시간을 계산합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/business-day-duration-calculator.js?v=20261104-300" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 날짜 범위와 요일별 시간을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="start-field"><label for="start">시작일</label><input id="start" type="date" placeholder="예: 2026-11-02" min="1900-01-01" max="2100-12-31"></div><div class="field" id="end-field"><label for="end">종료일</label><input id="end" type="date" placeholder="예: 2026-11-08" min="1900-01-01" max="2100-12-31"></div><div class="field" id="weekly-field"><label for="weekly">요일,하루 시간 (월=1~일=7)</label><textarea id="weekly" rows="6" maxlength="100000" placeholder="1,8
2,8
3,8
4,8
5,6" spellcheck="false"></textarea></div><div class="field" id="excluded-field"><label for="excluded">제외 날짜 (선택, 한 줄에 하나)</label><textarea id="excluded" rows="6" maxlength="100000" placeholder="2026-11-03" spellcheck="false"></textarea></div></div><p class="hint">양 끝 날짜 포함 · 시간 미입력 요일은 0 · 임금·휴게 자동 계산 없음</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>각 날짜의 요일에 입력한 하루 시간을 더합니다. 공휴일은 자동 제외하지 않으며 지정한 날짜만 뺍니다. 출퇴근 시각 차이가 아닌 반복 요일 일정의 합계입니다.</p></details></main></div></body></html>
