<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>SVG를 PNG로 변환 - 무료 도구 | 하루콕</title><meta name="description" content="정적 SVG 도형을 원하는 가로 크기의 PNG로 변환하세요. 비율과 투명 배경을 유지하며 외부 참조는 허용하지 않습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/image-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/creative100-common.js?v=20261104" defer></script><script src="/tools/svg-to-png.js?v=20261104" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq">
<style>body{display:flow-root;padding:0;background:transparent}</style></head><body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> SVG 파일과 PNG 가로 크기를 정하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="image-form" novalidate><div class="field"><label for="image-file">SVG 파일</label><input class="image-file" id="image-file" type="file" accept="image/svg+xml,.svg"><p class="hint">정적 SVG · 2MB 이하 · 기본 도형·내부 그라데이션만</p></div><fieldset class="image-controls" id="image-controls" disabled><legend>변환 설정</legend><div class="field"><label for="output-width">PNG 가로 (px)</label><input id="output-width" type="number" placeholder="예: 600" inputmode="decimal" min="1" max="8192" step="1"></div><button class="primary" id="image-submit" type="submit">사진 변환하기</button></fieldset></form><p class="error" id="image-error" role="alert"></p><p class="hint" id="image-status" role="status"></p><figure id="source-figure" hidden><figcaption>원본</figcaption><div class="image-preview"><img id="source-preview" alt="선택한 원본"></div><p class="hint" id="source-info"></p></figure><section class="result" id="image-result" hidden aria-live="polite"><h2>결과</h2><div class="image-preview" ><img id="result-preview" alt="변환한 사진"></div><p id="result-info"></p><div class="actions"><a class="primary" id="download-image" download >PNG로 저장하기</a></div></section></section>

<details class="tool-notes"><summary>도움말</summary><p>가로·세로(px) 또는 viewBox가 필요합니다. 스크립트·스타일·외부 참조·텍스트·foreignObject는 지원하지 않습니다. 출력은 1,200만 화소 이하입니다.</p><p>파일·입력값은 브라우저 안에서 처리하며 서버로 전송하거나 저장하지 않습니다.</p></details></main></div></body></html>
