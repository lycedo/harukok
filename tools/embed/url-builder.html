<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>URL 쿼리 만들기 | 하루콕</title><meta name="description" content="기본 주소에 검색 매개변수를 안전하게 붙이세요. 한글·공백·반복 키를 URL 인코딩하고 기존 쿼리 처리 방식을 고릅니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/url-builder.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-faq"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 주소와 탭으로 구분한 키·값을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="base">기본 URL</label><input id="base" type="text" placeholder="https://example.com/search" autocomplete="off" maxlength="10000"></div><div class="field"><label for="params">키와 값 (사이는 탭)</label><textarea id="params" rows="5" maxlength="100000" placeholder="q	하루 콕
page	1" spellcheck="false"></textarea></div><div class="field"><label for="mode">기존 쿼리 처리</label><select id="mode"><option value="append">기존 값에 추가</option><option value="replace">기존 값 지우고 추가</option></select></div><div class="field"><label for="fragment">해시 (빈칸은 유지)</label><input id="fragment" type="text" placeholder="results" autocomplete="off" maxlength="10000"></div><p class="hint">http·https 주소만 지원 · 매개변수 10,000줄</p><button class="primary" type="submit">URL 만들기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>매개변수 한 줄은 키, 탭, 값 순서입니다. 값이 없으면 빈 문자열입니다. 같은 키를 여러 번 쓸 수 있으며 주소에 접속하지 않습니다.</p></details>
</main></div></body></html>
