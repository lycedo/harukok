<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>URL 추적 매개변수 지우기 | 하루콕</title><meta name="description" content="URL 목록에서 utm_·클릭 추적 매개변수를 지우세요. 추가로 제거할 키도 지정할 수 있습니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/url-list-tracking-remover.js?v=20261107-1000" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입력 후 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="field"><label for="source">URL · 한 줄씩</label><textarea id="source" rows="5" maxlength="100000" placeholder="https://example.com/?a=1&amp;utm_source=test&amp;fbclid=demo" spellcheck="false"></textarea></div><div class="field"><label for="keys">추가 제거 키 · 한 줄씩 · 없으면 비우기</label><textarea id="keys" rows="5" maxlength="100000" placeholder="tracking_id" spellcheck="false"></textarea></div><div class="field"><label for="hash">해시(#) 처리</label><select id="hash"><option value="keep">유지</option><option value="remove">제거</option></select></div><p class="hint">서명 URL은 변경하면 동작이 달라질 수 있습니다. 결과를 확인하세요.</p><button class="primary" type="submit">실행하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="5" class="code-output" wrap="off" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>참고</summary><p>URL 목록에서 utm_·클릭 추적 매개변수를 지우세요. 추가로 제거할 키도 지정할 수 있습니다.</p></details>
</main></div></body></html>
