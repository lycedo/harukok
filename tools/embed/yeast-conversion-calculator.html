<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top"><title>생이스트·건조이스트 환산기 | 하루콕</title><meta name="description" content="직접 확인한 생이스트 대비 건조이스트 질량 비율로 서로 환산하세요."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/yeast-conversion-calculator.js?v=20261107-1000" defer></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261108-1000"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="mode-field"><label for="mode">변환 방향</label><select id="mode"><option value="fresh">생이스트 → 건조이스트</option><option value="dry">건조이스트 → 생이스트</option></select></div><div class="field" id="amount-field"><label for="amount">원래 이스트 (g)</label><input id="amount" type="text" placeholder="예: 30" inputmode="decimal" autocomplete="off"></div><div class="field" id="ratio-field"><label for="ratio">생이스트 1g당 건조이스트 (g)</label><input id="ratio" type="text" placeholder="예: 0.33" inputmode="decimal" autocomplete="off"></div></div><p class="hint">제품별 환산 비율 직접 입력 · 예시 비율은 보편 규칙 아님</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><details class="tool-notes"><summary>계산 방법</summary><p>건조 유형·제품·레시피에 따라 대체 비율과 사용법이 다릅니다. 제품 안내 비율을 우선 확인하세요.</p><a href="https://www.kingarthurbaking.com/blog/2023/04/24/how-to-bake-with-fresh-yeast" target="_blank" rel="noopener noreferrer">King Arthur 생·건조 이스트 환산 예</a></details></main></div></body></html>
