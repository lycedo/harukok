<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><base target="_top">
<title>겉넓이 계산기 | 하루콕</title><meta name="description" content="직육면체·원기둥·원뿔·구의 겉넓이를 계산하세요. 밑면을 포함한 전체 겉넓이와 옆넓이를 구분합니다."><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="/tools/everyday-tools.css?v=20261024-ux"><link rel="stylesheet" href="/tools/tool-controls.css?v=20261025-flow"><script src="/tools/surface-area-calculator.js?v=20261104-160" defer></script>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/tools/site-ui.css?v=20261113-content"><style>body{display:flow-root;padding:0;background:transparent}</style></head>
<body><div class="wrap"><main><p class="tool-help"><strong>사용방법</strong> 입체도형을 고르고 길이를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="shape-field"><label for="shape">입체도형</label><select id="shape"><option value="box">직육면체</option><option value="cylinder">원기둥</option><option value="cone">원뿔</option><option value="sphere">구</option></select></div><div class="field" id="unit-field"><label for="unit">길이 단위</label><select id="unit"><option value="cm">cm</option><option value="m">m</option></select></div><div class="field" id="a-field"><label for="a">가로</label><input id="a" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 3"></div><div class="field" id="b-field"><label for="b">세로</label><input id="b" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 4"></div><div class="field" id="c-field"><label for="c">높이</label><input id="c" type="text" inputmode="decimal" autocomplete="off" placeholder="예: 5"></div></div><p class="hint">길이 0.000001~10억 · 밑면 포함</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="4" readonly spellcheck="false"></textarea><button id="copy" class="secondary" type="button">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section>

<details class="tool-notes"><summary>계산 방법</summary><p>원기둥은 밑면 두 개, 원뿔은 밑면 한 개를 포함합니다. 원뿔의 모선 길이는 반지름과 수직 높이로 계산합니다. 구에는 옆넓이를 따로 표시하지 않습니다.</p></details>
</main></div></body></html>
