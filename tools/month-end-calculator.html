<body><div class="wrap"><nav class="site-nav" aria-label="주요 메뉴"><a class="site-nav-brand" href="/">하루<span>콕</span></a><div class="site-nav-links"><a href="/#all-tools">전체 도구</a></div></nav><main><h1>월말·개월 계산기</h1><p class="tool-help"><strong>사용방법</strong> 기준일·개월 차이와 계산 방식을 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="base-field"><label for="base">기준일</label><input id="base" type="date" placeholder="예: 2026-01-31" min="1900-01-01" max="2100-12-31"></div><div class="field" id="offset-field"><label for="offset">개월 차이 (-1200~1200)</label><input id="offset" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field" id="mode-field"><label for="mode">계산 방식</label><select id="mode"><option value="add">개월 가감 날짜</option><option value="list">월말 날짜 목록</option></select></div><div class="field" id="rule-field"><label for="rule">개월 가감 규칙</label><select id="rule"><option value="clamp">같은 일자, 없으면 말일</option><option value="end">기준일이 말일이면 말일 유지</option></select></div><div class="field" id="count-field"><label for="count">월말 목록 개수 (목록일 때)</label><input id="count" type="text" placeholder="예: 12" inputmode="decimal" autocomplete="off"></div></div><p class="hint">존재하지 않는 일자는 해당 월 말일 · 목록은 시작 월부터</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><aside class="ad-banner ad-banner-strip" aria-label="광고"><p class="ad-label">광고</p><div class="ad-strip-slot"><script src="/ad-banner-isolated.js?v=20261027-banner"></script></div></a
