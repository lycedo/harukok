<main><h1>이름 뽑기</h1>
<p class="tool-help"><strong>사용방법</strong> 이름을 한 줄씩 쓰고, 뽑을 인원을 정하세요.</p>
<noscript><p class="noscript">도구를 사용하려면 자바스크립트를 허용해 주세요.</p></noscript>
<section class="sheet"><form id="random-form"><div class="field"><label for="participants">참가자 이름 · 한 줄에 한 명</label><textarea id="participants" rows="5" style="min-height:160px" maxlength="16000" required aria-describedby="list-hint" placeholder="민수 A&#10;민수 B&#10;지우&#10;서연"></textarea><div class="actions"><button type="button" class="secondary" id="sample-list">예시 명단 넣기</button><button type="button" class="secondary" id="clear-list">명단 지우기</button></div><p class="hint" id="list-hint">최대 200명 · 같은 이름은 ‘민수 A’, ‘민수 B’처럼 구분하세요.</p></div><div class="field"><label for="count">뽑을 인원 (명)</label><input id="count" type="number" min="1" max="200" step="1" value="1" required></div><button class="primary" type="submit">이름 뽑기</button><p id="random-error" class="error" role="alert"></p></form><div id="random-result" class="result" aria-live="polite" tabindex="-1" role="region" aria-labelledby="result-summary" hidden><h2 id="result-summary"></h2><div id="random-output" class="name-output"></div><button id="copy-result" class="secondary" type="button">결과 복사하기</button><p id="copy-status" role="status" class="hint"></p></div><p class="hint">한 번의 추첨 안에서만 중복을 막습니다. 다시 뽑으면 이전 당첨자도 포함됩니다.</p><p class="hint">명단은 서버에 저장하지 않습니다. 결과는 복사해 두세요.</p></section>
