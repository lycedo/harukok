<body><div class="wrap"><nav class="site-nav" aria-label="주요 메뉴"><a class="site-nav-brand" href="/">하루<span>콕</span></a><div class="site-nav-links"><a href="/#all-tools">전체 도구</a></div></nav><main><h1>인쇄·제본 계산기</h1><div id="tool-modes" class="tool-modes" role="group" aria-label="기능 선택"><p class="tool-modes-title">기능 선택</p><div class="mode-buttons"><button type="button" data-mode="book-spine-calculator" aria-pressed="true">책등 두께 계산기</button><button type="button" data-mode="print-bleed-calculator" aria-pressed="false">인쇄 도련·안전선 계산기</button><button type="button" data-mode="cover-spread-calculator" aria-pressed="false">책 표지 펼침 크기 계산기</button><button type="button" data-mode="paper-gsm-weight-calculator" aria-pressed="false">용지 평량·총무게 계산기</button><button type="button" data-mode="print-sheet-layout-calculator" aria-pressed="false">인쇄 용지 배치 계산기</button></div></div><iframe id="tool-mode-frame" class="tool-mode-frame" title="선택한 기능" hidden></iframe><p class="tool-help"><strong>사용방법</strong> 페이지 수·종이 두께·추가 여유를 넣으세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="pages-field"><label for="pages">본문 페이지 수 (쪽)</label><input id="pages" type="text" placeholder="예: 200" inputmode="decimal" autocomplete="off"></div><div class="field" id="thickness-field"><label for="thickness">종이 한 장 두께 (µm)</label><input id="thickness" type="text" placeholder="예: 100" inputmode="decimal" autocomplete="off"></div><div class="field" id="allowance-field"><label for="allowance">표지·제본 추가 여유 (mm)</label><input id="allowance" type="text" placeholder="예: 0.5" inputmode="decimal" autocomplete="off"></div></div><p class="hint">양면 1장=2쪽 · 홀수 페이지는 1장 올림 · 종이 두께 직접 입력</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text
