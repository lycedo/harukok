<body><div class="wrap"><nav class="site-nav" aria-label="주요 메뉴"><a class="site-nav-brand" href="/">하루<span>콕</span></a><div class="site-nav-links"><a href="/#all-tools">전체 도구</a></div></nav><main><h1>월 주기 날짜 일정 만들기</h1><p class="tool-help"><strong>사용방법</strong> 값을 넣고 실행하세요.</p><noscript><p>자바스크립트를 허용해 주세요.</p></noscript><section class="sheet"><form id="calculator" novalidate><div class="fields"><div class="field" id="start-field"><label for="start">첫 기준월 날짜</label><input id="start" type="date" placeholder="2026-01-01" min="1900-01-01" max="2100-12-31"></div><div class="field" id="every-field"><label for="every">반복 월 간격</label><input id="every" type="text" placeholder="예: 1" inputmode="decimal" autocomplete="off"></div><div class="field" id="count-field"><label for="count">발생 기준월 수</label><input id="count" type="text" placeholder="예: 3" inputmode="decimal" autocomplete="off"></div><div class="field" id="days-field"><label for="days">매달 날짜 번호 · 1~31</label><input id="days" type="text" placeholder="15,31" inputmode="text" autocomplete="off"></div><div class="field" id="excluded-field"><label for="excluded">제외 날짜 · 없으면 비우기</label><textarea id="excluded" rows="6" maxlength="100000" placeholder="2026-02-15" spellcheck="false"></textarea></div></div><p class="hint">없는 29~31일은 월말로 조정 · 겹친 월말은 1회</p><button class="primary" type="submit">계산하기</button><p id="error" class="error" role="alert"></p></form><section id="result" class="result" hidden aria-live="polite"><h2>결과</h2><div id="result-value" class="result-value"></div><label for="result-text">복사할 결과</label><textarea id="result-text" rows="8" readonly spellcheck="false"></textarea><button id="copy" type="button" class="secondary">결과 복사하기</button><p id="copy-status" class="hint" role="status"></p></section></section><aside class="ad-banner ad-banner-strip" aria-label="광고"><p class="ad-label">광고</p><div class="ad-strip-slot"><script src="/ad-banner-isolated.js?v=20261027-banner"></script></div></aside><details class="tool-notes"><summary>계산 방법</summary><p>첫 기준일 이전 날짜와 직접 지정한 제외일을 뺍니다. 월말 조정된 날짜가 다음 달 기준을 바꾸지 않습니다.</p></details><nav class="related" aria-label="함께 쓰는 도구"><a href="/tools/date-calculator">날짜·디데이 계산기</a><a href="/tools/business-day-calculator">영업일 계산기</a></nav></main><footer><a href="/about">소개</a> · <a href="/privacy">개인정보처리방침</a> · <a href="mailto:contact@harukok.com">의견 보내기</a><p>© 2026 하루콕</p></footer></div></body></html>
